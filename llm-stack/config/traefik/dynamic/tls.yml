# TLS for every router. The certificate is self-signed and generated by the
# tls-init service on first `up` -- there is no script to run and no CA to
# install. Browsers show a warning once; accept it and they remember.
#
# The file names are fixed and do not depend on LLM_DOMAIN, so changing the
# domain needs no edit here: tls-init notices and regenerates.
#
# For a real public domain, see the certificatesResolvers block in
# ../traefik.yml.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/tls.crt
        keyFile: /etc/traefik/certs/tls.key

  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
