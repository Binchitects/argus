# TLS material, generated by scripts/gen-certs. Traefik watches this directory,
# so replacing the certificate files is picked up without a restart.
#
# The filenames are fixed rather than templated because Traefik's file provider
# does not expand environment variables. If you change LLM_DOMAIN in .env, also
# change the four paths below.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/llm.localhost.fullchain.crt
        keyFile: /etc/traefik/certs/llm.localhost.key

  certificates:
    - certFile: /etc/traefik/certs/llm.localhost.fullchain.crt
      keyFile: /etc/traefik/certs/llm.localhost.key
      stores:
        - default

  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
