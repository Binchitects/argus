# ==============================================================================
# LiteLLM gateway (compose profile: gateway)
#
# Why put this in front of vLLM at all?
#   - one virtual API key per person, with spend limits and rate limits
#   - usage attributed to a user, which vLLM alone cannot do (its metrics carry
#     a model_name label but no user dimension)
#   - one endpoint that can front local vLLM AND hosted providers, with fallbacks
#
# Reach it at https://gateway.<LLM_DOMAIN>/v1. Mint per-person keys with
# POST /key/generate using LITELLM_MASTER_KEY.
#
# NOTE ON NAMES: `model_name` is what clients and the Open WebUI model picker
# display. LiteLLM does NOT expand ${VAR} here -- but it DOES resolve
# `os.environ/NAME`, which is how the engine below is selected from .env.
# scripts/switch-model rewrites the display name when you change model.
# ==============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # The engine is chosen in .env, not here.
  #
  # ENGINE_API_BASE / ENGINE_MODEL / ENGINE_API_KEY are set by scripts/setup.sh
  # from the engine you picked, and docker-compose.yml defaults them to the vLLM
  # wiring so an older .env keeps working. `os.environ/` is resolved by LiteLLM
  # for every litellm_params key -- which is what makes ONE config file serve
  # both vLLM and llama.cpp.
  #
  #   vllm      ENGINE_API_BASE=http://vllm:8000/v1
  #   llamacpp  ENGINE_API_BASE=http://llamacpp:8080/v1
  #
  # ENGINE_MODEL carries its `openai/` prefix in .env. That prefix means "speak
  # the OpenAI protocol to api_base" -- it is NOT api.openai.com. The part after
  # it must equal the engine's served name (vLLM --served-model-name, llama.cpp
  # --alias) or the engine answers 404 to everything.
  #
  # Both entries below are the SAME backend under two names: `local` is the
  # stable alias clients should use, and the second is the human-readable one
  # the Open WebUI model picker shows. scripts/switch-model rewrites the
  # display name and the advertised window when the model changes.
  # ---------------------------------------------------------------------------

  # Stable alias, so clients need not change when the model or engine does.
  - model_name: local
    litellm_params:
      model: os.environ/ENGINE_MODEL
      api_base: os.environ/ENGINE_API_BASE
      api_key: os.environ/ENGINE_API_KEY
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000008
    model_info:
      mode: chat
      # ADVERTISE the window. Without these, /model/info returns null for
      # max_input_tokens and every client has to guess -- and clients CACHE
      # the guess. Hermes wrote 24,576 to its context_length_cache.yaml back
      # when vLLM really did serve that, then kept refusing on a 131,072
      # engine because nothing ever invalidated the entry. Reporting the
      # truth here is what stops that happening again, for every client.
      #
      # These are LITERAL numbers on purpose: model_info is not part of
      # litellm_params, and an os.environ/ value would arrive as a string
      # where an int is expected. setup.sh and switch-model rewrite them.
      max_input_tokens: 262144
      max_output_tokens: 8192
      max_tokens: 262144

  # Display name, shown in the Open WebUI model picker.
  - model_name: qwen3.8-flash-next
    litellm_params:
      model: os.environ/ENGINE_MODEL
      api_base: os.environ/ENGINE_API_BASE
      api_key: os.environ/ENGINE_API_KEY
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000008
    model_info:
      mode: chat
      max_input_tokens: 262144
      max_output_tokens: 8192
      max_tokens: 262144

  # Compatibility alias. Clients that cached the previous served name -- the
  # Hermes desktop model picker among them -- would otherwise get a 404 when
  # someone selects it. Pointing it at the same backend means a stale entry in
  # any client's list is harmless rather than a dead option.
  - model_name: qwen3.8-9b
    litellm_params:
      model: os.environ/ENGINE_MODEL
      api_base: os.environ/ENGINE_API_BASE
      api_key: os.environ/ENGINE_API_KEY
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000008
    model_info:
      mode: chat
      max_input_tokens: 262144
      max_output_tokens: 8192
      max_tokens: 262144

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  # If the local engine is down or saturated, fall back rather than queue.
  # Requires the cloud-fallback entry above.
  # fallbacks:
  #   - local: ["cloud-fallback"]

litellm_settings:
  drop_params: true
  set_verbose: false

  # ------------------------------------------------------------ spend limits
  # A default ceiling for every internal user, so a person who is added to the
  # roster and never given an explicit quota is still bounded. Spend is
  # counted from BOTH surfaces once user_header_mappings is in place, so this
  # is a per-person total rather than a per-key one.
  #
  # These are USD figures derived from token counts and the model's configured
  # price. For a purely local vLLM deployment the "cost" is notional -- what it
  # actually bounds is tokens -- but it is still the lever that stops one
  # person consuming the whole GPU for a month, and it is what the dashboards
  # sum. Set input_cost_per_token/output_cost_per_token on a model to make the
  # figure mean money.
  #
  # 0 would block every request rather than allow unlimited, so the default is
  # a real number. Raise per-person with scripts/sync-llm-users.py.
  max_internal_user_budget: os.environ/LITELLM_DEFAULT_USER_BUDGET
  internal_user_budget_duration: os.environ/LITELLM_BUDGET_DURATION
  # Cache identical completions in Redis. A big win for repeated evals and for
  # UI clients that resend the same system prompt.
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
  # Log every request to Langfuse when the `tracing` profile is running.
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # ---------------------------------------------------------------- identity
  # This is what makes one person's API usage and their chat usage add up to
  # ONE number instead of two unrelated ones.
  #
  # The problem it solves: Open WebUI authenticates to this gateway with a
  # SINGLE shared key (see WEBUI_BACKEND_KEY in docker-compose.yml). Without
  # the mapping below, every chat message from every person is spend against
  # that one key -- the gateway can tell you the web UI used $40 this month
  # and cannot tell you who used it. Per-person API keys were attributable all
  # along; the web UI was the hole.
  #
  # Open WebUI forwards the signed-in identity as headers when
  # ENABLE_FORWARD_USER_INFO_HEADERS is set. Mapping the EMAIL header to
  # `internal_user` makes LiteLLM's internal user id the person's email
  # address -- and scripts/sync-llm-users.py mints each API key with
  # `user_id: <same email>`. One identity, both surfaces.
  #
  # Email rather than X-OpenWebUI-User-Id deliberately: the user id is an
  # Open WebUI database row id, which exists nowhere else. Email is what
  # Authelia issues over OIDC, what team.yml already records, and therefore
  # the only identifier the whole stack agrees on.
  # BOTH roles, from the one header, because they do different jobs. Measured
  # on this stack rather than assumed:
  #
  #   internal_user  ATTRIBUTES the spend. It makes chat usage land on the
  #                  same identity as the person's API key, which is what
  #                  makes their total one number instead of two.
  #
  #   customer       ENFORCES the ceiling. With internal_user alone, an
  #                  over-budget person was refused on the API path (429) and
  #                  still served on the web UI -- tracked but not stopped.
  #                  The internal-user budget binds a key owned by that user;
  #                  the web UI holds a SHARED key, so nothing bound. End-user
  #                  budgets are the mechanism that checks a shared key
  #                  against the caller named in the request.
  #
  # scripts/sync-llm-users.py therefore provisions each person twice, with the
  # same email and the same ceiling: once as an internal user, once as an end
  # user. Drop either half and you lose either the total or the limit.
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: internal_user
  # /metrics is an enterprise feature on current builds; the Prometheus job for
  # it is commented out in config/prometheus/prometheus.yml.
  # callbacks: ["prometheus"]
