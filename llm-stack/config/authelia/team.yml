# ==============================================================================
# Declarative team list — the source of truth for who has access.
#
# Run `./scripts/gen-auth.sh --sync` and users.yml is made to match this file:
#
#   in this file, not in users.yml   -> CREATED  (random password, printed once)
#   in both                          -> password KEPT, groups/name/email UPDATED
#   in users.yml, not in this file   -> REMOVED
#
# Safe to commit: it contains no passwords or hashes. Those live only in
# users.yml, which is gitignored.
#
# Groups:
#   admins   everything, including Prometheus, Alertmanager, Traefik dashboard
#   users    chat (Open WebUI) and Grafana only
#
# To reset someone's password, delete their block, --sync, then --sync again
# after re-adding them; or use --add-user NAME --password '...' to set it
# explicitly.
# ==============================================================================

users:
  # The `admins` group reaches everything, including Prometheus, Alertmanager
  # and the exporters. `users` reaches chat and Grafana only.
  #
  # This is an EXAMPLE roster. Replace it with your own people and run
  # ./scripts/gen-auth.sh --sync : users here are created, users missing from
  # here are REMOVED, and groups/name/email are updated for those in both.
  - username: admin
    displayname: Administrator
    email: admin@example.com
    groups:
      - admins

  - username: alice
    displayname: Alice Example
    email: alice@example.com
    groups:
      - users

  - username: bob
    displayname: Bob Example
    email: bob@example.com
    groups:
      - users
