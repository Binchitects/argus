# TEMPLATE -- loaded directly by Authelia, which fills in the domain itself.
#
# Every  {{ env "LLM_DOMAIN" }}  below is expanded at startup by Authelia's
# `template` config filter (X_AUTHELIA_CONFIG_FILTERS in docker-compose.yml)
# from the LLM_DOMAIN environment variable, which compose passes from .env.
#
# Why: Authelia's session domain, OIDC issuer and every access-control rule
# name the domain literally. This file used to be rendered to configuration.yml
# by scripts/gen-auth, so changing LLM_DOMAIN in .env moved every Traefik route
# but left Authelia answering for the OLD domain until someone re-ran gen-auth
# -- SSO broke with no error, because nothing had failed. Now editing .env and
# running `docker compose up -d` is the whole procedure.
# ==============================================================================
# Authelia — single sign-on for the whole stack.
#
# Two distinct jobs:
#
#   1. forwardAuth gate. Traefik asks Authelia about every request to the
#      services that have no login of their own (Prometheus, Alertmanager,
#      Loki, cAdvisor, the exporters, the Traefik dashboard). This replaces the
#      basic-auth middleware.
#
#   2. OIDC provider. Grafana, Open WebUI and Langfuse delegate their OWN login
#      screens to Authelia, so you get one identity, real logout, and group ->
#      role mapping instead of three separate account databases.
#
# OIDC clients live in clients.yml, generated by scripts/gen-auth, because their
# secrets must be stored as hashes. Authelia merges multiple --config files.
#
# Secrets come from the environment (see docker-compose.yml); nothing sensitive
# is stored in this file.
# ==============================================================================

theme: dark

server:
  address: 'tcp://0.0.0.0:9091'
  buffers:
    read: 4096
    write: 4096
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'
        # Order matters: a request is authenticated by the first strategy that
        # matches. HeaderAuthorization accepts an OAuth2 access token issued by
        # this same Authelia (scope authelia.bearer.authz), which is how
        # machine clients authenticate without a browser. CookieSession is the
        # ordinary human path.
        authn_strategies:
          - name: 'HeaderAuthorization'
            schemes: ['Bearer']
          - name: 'CookieSession'

log:
  level: 'info'
  format: 'text'

totp:
  issuer: '{{ env "LLM_DOMAIN" }}'

# ------------------------------------------------------------------------------
# Users live in a YAML file with argon2id-hashed passwords. Add people with:
#     .\scripts\gen-auth.ps1 -AddUser alice -Password '...'
# ------------------------------------------------------------------------------
authentication_backend:
  password_reset:
    disable: true
  refresh_interval: '1m'
  file:
    path: '/config/users.yml'
    watch: true
    password:
      algorithm: 'argon2'
      argon2:
        variant: 'argon2id'
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16

# ------------------------------------------------------------------------------
# Access control for the forwardAuth-gated services.
#
# `one_factor` = username + password. Switch a rule to `two_factor` to require
# TOTP as well; users enrol a device from the portal.
# ------------------------------------------------------------------------------
access_control:
  default_policy: 'deny'
  rules:
    # The portal itself must never require auth, or login would be circular.
    - domain: 'auth.{{ env "LLM_DOMAIN" }}'
      policy: 'bypass'

    # Apps that authenticate through OIDC handle their own sessions; the
    # forwardAuth middleware is not applied to them, but an explicit bypass
    # keeps the intent obvious and survives a middleware mistake.
    - domain:
        - 'chat.{{ env "LLM_DOMAIN" }}'
        - 'grafana.{{ env "LLM_DOMAIN" }}'
        - 'traces.{{ env "LLM_DOMAIN" }}'
      policy: 'bypass'

    # The API and the gateway now authenticate against Authelia too. Machine
    # clients present an access token from the client_credentials grant; a
    # browser hitting /docs gets the normal login redirect.
    # STAYS one_factor on purpose. A client_credentials token is always
    # treated as 1FA by Authelia, so requiring two_factor here would deny
    # every machine caller while looking like a hardening win.
    - domain:
        - 'api.{{ env "LLM_DOMAIN" }}'
        - 'gateway.{{ env "LLM_DOMAIN" }}'
      policy: 'one_factor'

    # The admin panel. ANY signed-in person may reach it -- it shows them
    # their own usage and a password form. The console (create people, set
    # credit, rotate keys, reset passwords) is gated inside the app on
    # Authelia's Remote-Groups header, not here, so that a non-admin gets a
    # useful page rather than a 403.
    - domain: 'admin.{{ env "LLM_DOMAIN" }}'
      policy: 'one_factor'

    # Everything that ships with no authentication of its own.
    - domain:
        - 'metrics.{{ env "LLM_DOMAIN" }}'
        - 'alerts.{{ env "LLM_DOMAIN" }}'
        - 'logs.{{ env "LLM_DOMAIN" }}'
        - 'cadvisor.{{ env "LLM_DOMAIN" }}'
        - 'node.{{ env "LLM_DOMAIN" }}'
        - 'gpu.{{ env "LLM_DOMAIN" }}'
        - 's3.{{ env "LLM_DOMAIN" }}'
      policy: 'one_factor'
      subject:
        - 'group:admins'

      # NO permissive catch-all here, deliberately. A trailing
      #     - domain: '*.{{ env "LLM_DOMAIN" }}'
      #       policy: 'one_factor'
      # silently defeats every subject-restricted rule above it: when a
      # non-admin hits metrics.{{ env "LLM_DOMAIN" }} the admins rule does not MATCH
      # (wrong group) rather than denying, so evaluation falls through and any
      # authenticated user gets in. default_policy: deny covers the rest.

# ------------------------------------------------------------------------------
# Password policy. There was none, so a one-character password was accepted on
# the portal that fronts every service here. zxcvbn scores realistically -- it
# rejects 'Password1!' and accepts a long passphrase -- rather than counting
# character classes, which mostly teaches people to append '1!'.
# ------------------------------------------------------------------------------
password_policy:
  zxcvbn:
    enabled: true
    min_score: 3
  standard:
    enabled: false

session:
  name: 'authelia_session'
  same_site: 'lax'
  # A cookie scoped to the parent domain is what makes one login cover every
  # *.{{ env "LLM_DOMAIN" }} hostname.
  cookies:
    - domain: '{{ env "LLM_DOMAIN" }}'
      authelia_url: 'https://auth.{{ env "LLM_DOMAIN" }}'
      default_redirection_url: 'https://{{ env "LLM_DOMAIN" }}'
      expiration: '12h'
      inactivity: '1h'
      remember_me: '1M'
  redis:
    host: 'redis'
    port: 6379
    database_index: 3

regulation:
  # A 5-minute ban is not a deterrent: 3 tries per 5 minutes is ~860 attempts a
  # day, sustained, against a password-only login. A wider find_time also
  # catches slow spraying that resets inside a 2-minute window. The ban is
  # per-IP, so a real user who fumbles is inconvenienced, not locked out.
  max_retries: 5
  find_time: '10m'
  ban_time: '12h'

storage:
  local:
    path: '/data/db.sqlite3'

notifier:
  # No SMTP configured, so password-reset and 2FA-enrolment mails are written
  # to a file you can read with: docker exec authelia cat /data/notification.txt
  disable_startup_check: true
  filesystem:
    filename: '/data/notification.txt'

identity_providers:
  oidc:
    # The `jwks` signing key and all clients live in clients.yml, generated by
    # scripts/gen-auth (4.39 has no env override for the key, and client
    # secrets must be stored hashed).
    # By default Authelia returns email/name/groups from the USERINFO endpoint
    # only, keeping the ID token minimal. Several clients (NextAuth, which
    # Langfuse uses) read these claims straight off the ID token and fail with
    # "No email found in user object". This policy puts them in both places.
    claims_policies:
      with_profile:
        id_token:
          - 'email'
          - 'email_verified'
          - 'name'
          - 'preferred_username'
          - 'groups'

    authorization_policies:
      admins_only:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject: 'group:admins'
    cors:
      endpoints:
        - 'authorization'
        - 'token'
        - 'revocation'
        - 'introspection'
        - 'userinfo'
      allowed_origins_from_client_redirect_uris: true
