# Container-side Argus config. Mounted read-only at /etc/argus/config.yaml.
#
# COMMITTED on purpose: docker-compose bind-mounts this path, so a fresh clone
# must contain it or Argus will not start. It holds no secrets - the GitLab
# token is injected from ARGUS_GITLAB_TOKEN in .env and never written here.
gitlab:
  # A DEFAULT, and only a default. ARGUS_GITLAB_URL in .env overrides it, which
  # is the setting the deployment docs tell an operator to change -- this file
  # is committed and names a throwaway test instance, so it must never be the
  # answer for a real deployment. Leaving it here keeps `docker compose up`
  # working against the bundled test GitLab with nothing configured at all.
  #
  # A PLACEHOLDER. ARGUS_GITLAB_URL in .env overrides it, and that is the
  # setting to change -- this file is committed, so it must not name any real
  # instance. It stays a valid https URL rather than empty so that a missing
  # .env value fails as an unreachable host, which says what is wrong, instead
  # of as a parse error.
  #
  # (For a GitLab on this same machine from inside a container, the reachable
  # name is host.docker.internal, not localhost.)
  url: https://gitlab.example.com
  # token comes from ARGUS_GITLAB_TOKEN in .env -- never written here.
  #
  # TLS for a GitLab that is not on a public CA comes from
  # ARGUS_GITLAB_CA_CERT (a path inside the container; drop the PEM in
  # config/argus/tls/) or ARGUS_GITLAB_VERIFY=false when no CA file exists.
  # Both are read from the environment only, so nothing here needs editing.

index:
  data_dir: /var/lib/argus
  db_path: /var/lib/argus/index.db

packs:
  dir: /var/lib/argus/packs
