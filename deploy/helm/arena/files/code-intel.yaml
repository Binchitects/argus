# code-intel in this stack. GITLAB_URL and GITLAB_TOKEN in .env say which GitLab.
gitlab:
  # Its GitLab comes from the release's values (CODE_INTEL_GITLAB_URL); without one, its knowledge packs only.
  url: ""
index:
  data_dir: /var/lib/code-intel
  db_path: /var/lib/code-intel/index.db
packs:
  dir: /var/lib/code-intel/packs
