{{- /* Postgres (the app's database), unless an external one is used. */}}
{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "postgres") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.postgres) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: arena }
            {{- include "arena.secretEnv" (list $ "POSTGRES_PASSWORD" "DB_PASSWORD") | nindent 12 }}
            # The app's (a database the app makes itself otherwise).
            - { name: POSTGRES_DB, value: llmapp }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe: { exec: { command: [pg_isready, -U, arena, -d, postgres] }, periodSeconds: 10 }
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: shm, mountPath: /dev/shm }
      # Room for parallel queries' shared memory, as compose's shm_size.
      volumes:
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.postgresql.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "postgres") | nindent 4 }}
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
{{- end }}
