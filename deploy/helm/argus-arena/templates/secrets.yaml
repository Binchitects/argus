{{- if not .Values.secrets.existingSecret }}
{{- /* Each secret: as given in values, else as made at the first install (kept across upgrades), else new. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace "arena-secrets") }}
{{- $data := dict }}
{{- if $old }}{{ $data = $old.data | default dict }}{{ end }}
{{- $s := .Values.secrets }}
{{- $made := dict
  "ADMIN_PASSWORD" (list $s.adminPassword "")
  "DB_PASSWORD" (list $s.dbPassword "")
  "APP_KEY" (list $s.appKey "")
  "ENGINE_KEY" (list $s.engineKey "")
  "ARGUS_KEY" (list $s.argusKey "")
  "GATEWAY_KEY" (list $s.gatewayKey "sk-") }}
apiVersion: v1
kind: Secret
metadata:
  name: arena-secrets
  labels: {{- include "arena.labels" . | nindent 4 }}
  annotations:
    # Never deleted with the release: APP_KEY and the database password outlive it.
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $key, $v := $made }}
{{- $given := index $v 0 }}
{{- if $given }}
  {{ $key }}: {{ $given | b64enc }}
{{- else if hasKey $data $key }}
  {{ $key }}: {{ index $data $key }}
{{- else }}
  {{ $key }}: {{ printf "%s%s" (index $v 1) (randAlphaNum 48) | b64enc }}
{{- end }}
{{- end }}
{{- range $key, $given := dict "HF_TOKEN" $s.hfToken "GITLAB_TOKEN" $s.gitlabToken "GITLAB_USERNAME" $s.gitlabUsername "GITLAB_PASSWORD" $s.gitlabPassword }}
{{- if $given }}
  {{ $key }}: {{ $given | b64enc }}
{{- else if hasKey $data $key }}
  {{ $key }}: {{ index $data $key }}
{{- end }}
{{- end }}
{{- end }}
