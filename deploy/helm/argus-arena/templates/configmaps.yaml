{{- /* The stack's configuration files: copies of deploy/config and deploy/services (check-chart.py keeps them the same). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: arena-config
  labels: {{- include "arena.labels" . | nindent 4 }}
data:
  {{- /* With Valkey (several gateway replicas) the keys' counts live there too: litellm-ha.yaml. */}}
  litellm.yaml: |-
{{ .Files.Get (ternary "files/litellm-ha.yaml" "files/litellm.yaml" .Values.valkey.enabled) | indent 4 }}
  argus.yaml: |-
{{ .Files.Get "files/argus.yaml" | indent 4 }}
  searxng.yml: |-
{{ .Files.Get "files/searxng.yml" | indent 4 }}
  alertmanager.yml: |-
{{ .Files.Get "files/alertmanager.yml" | indent 4 }}
  loki.yml: |-
{{ .Files.Get "files/loki.yml" | indent 4 }}
  router.sh: |-
{{ .Files.Get "files/router.sh" | indent 4 }}
  sd-serve.sh: |-
{{ .Files.Get "files/sd-serve.sh" | indent 4 }}
  cpu-temp-exporter.py: |-
{{ .Files.Get "files/cpu-temp-exporter.py" | indent 4 }}
  vllm-supervisor.sh: |-
{{ .Files.Get "files/vllm-supervisor.sh" | indent 4 }}
  vllm-helper.py: |-
{{ .Files.Get "files/vllm-helper.py" | indent 4 }}
  gpu-probe.py: |-
{{ .Files.Get "files/gpu-probe.py" | indent 4 }}
  fake_vllm.py: |-
{{ .Files.Get "files/fake_vllm.py" | indent 4 }}
  fake-vllm: |-
{{ .Files.Get "files/fake-vllm" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arena-prometheus
  labels: {{- include "arena.labels" . | nindent 4 }}
data:
  prometheus.yml: |-
{{ .Files.Get "files/prometheus/prometheus.yml" | indent 4 }}
{{- range $path, $_ := .Files.Glob "files/prometheus/rules/*.yml" }}
  rules-{{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
