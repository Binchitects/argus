{{- /* Monitoring: the app's dashboards, logs and alerts read these. */}}
{{- if .Values.monitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "prometheus") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      securityContext: { runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, runAsNonRoot: true }
      containers:
        - name: prometheus
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.prometheus) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [/bin/sh, -c]
          args:
            - |
              printf %s "$ENGINE_KEY" > /tmp/engine.token; printf %s "$ARGUS_KEY" > /tmp/argus.token
              exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
                --storage.tsdb.retention.time=30d --storage.tsdb.retention.size=20GB --web.enable-lifecycle --web.enable-admin-api
          ports: [{ name: http, containerPort: 9090 }]
          env:
            {{- include "arena.secretEnv" (list $ "ENGINE_KEY" "ENGINE_KEY") | nindent 12 }}
            {{- include "arena.secretEnv" (list $ "ARGUS_KEY" "ARGUS_KEY") | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            {{- range $path, $_ := .Files.Glob "files/prometheus/rules/*.yml" }}
            - { name: config, mountPath: /etc/prometheus/rules/{{ base $path }}, subPath: rules-{{ base $path }} }
            {{- end }}
            - { name: engine, mountPath: /engine-sd, readOnly: true }
            - { name: data, mountPath: /prometheus }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: arena-prometheus } }
        {{- include "arena.claim" (list "engine" "arena-engine") | nindent 8 }}
        {{- include "arena.claim" (list "data" "arena-prometheus") | nindent 8 }}
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "prometheus") | nindent 4 }}
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "alertmanager") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "alertmanager") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      securityContext: { runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, runAsNonRoot: true }
      containers:
        - name: alertmanager
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.alertmanager) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
          ports: [{ name: http, containerPort: 9093 }]
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - { name: config, configMap: { name: arena-config } }
        {{- include "arena.claim" (list "data" "arena-alertmanager") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "alertmanager") | nindent 4 }}
  ports: [{ name: http, port: 9093, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "loki") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "loki") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, runAsNonRoot: true }
      containers:
        - name: loki
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.loki) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: [-config.file=/etc/loki/loki.yml]
          ports: [{ name: http, containerPort: 3100 }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki/loki.yml, subPath: loki.yml }
            - { name: data, mountPath: /loki }
      volumes:
        - { name: config, configMap: { name: arena-config } }
        {{- include "arena.claim" (list "data" "arena-loki") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "loki") | nindent 4 }}
  ports: [{ name: http, port: 3100, targetPort: http }]
{{- if .Values.monitoring.hostExporters.enabled }}
---
{{- /* The host's figures, as compose's node-exporter and cpu-temp-exporter: disks, memory and CPU for the
dashboards, Admin -> Storage and the host's alerts, and the CPU's temperature. One pod on each node it may run on;
Prometheus reaches them by their Services' names, so on several nodes it reads one at a time (nodeSelector). */}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: host-exporters
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "host-exporters") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "host-exporters") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      automountServiceAccountToken: false
      # The host's processes, as compose's pid: host.
      hostPID: true
      {{- with .Values.monitoring.hostExporters.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.monitoring.hostExporters.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-exporter
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.nodeExporter) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/rootfs
            - --collector.cpu.info
            - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/(docker|kubelet|containerd))($|/)
          ports: [{ name: http, containerPort: 9100 }]
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: sys, mountPath: /host/sys, readOnly: true }
            - { name: root, mountPath: /rootfs, readOnly: true, mountPropagation: HostToContainer }
        - name: cpu-temp-exporter
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.python) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [python, /app/exporter.py]
          ports: [{ name: cpu-temp, containerPort: 9110 }]
          securityContext: { runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /app/exporter.py, subPath: cpu-temp-exporter.py }
      volumes:
        - { name: proc, hostPath: { path: /proc } }
        - { name: sys, hostPath: { path: /sys } }
        - { name: root, hostPath: { path: / } }
        - { name: config, configMap: { name: arena-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "host-exporters") | nindent 4 }}
  ports: [{ name: http, port: 9100, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-temp-exporter
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "host-exporters") | nindent 4 }}
  ports: [{ name: http, port: 9110, targetPort: cpu-temp }]
{{- end }}
{{- end }}
