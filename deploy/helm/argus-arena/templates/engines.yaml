{{- /* The chat models (llama.cpp in router mode), loaded and unloaded live, on GPUs: the app writes their list. */}}
{{- if .Values.llamacpp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llamacpp
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One engine at a time on the GPU: the old one goes before the new one loads.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "llamacpp") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "llamacpp") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      {{- with .Values.llamacpp.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.llamacpp.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: llamacpp
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.llamacpp) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [/bin/sh, /router.sh]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            {{- include "arena.secretEnv" (list $ "ENGINE_KEY" "ENGINE_KEY") | nindent 12 }}
            - { name: CUDA_DEVICE_ORDER, value: PCI_BUS_ID }
            # What llama.cpp fetches itself (a preset's hf-repo) lands in the library and stays.
            - { name: LLAMA_CACHE, value: /library/.llama.cpp }
          resources:
            {{- with .Values.llamacpp.resources.requests }}
            requests: {{- toYaml . | nindent 14 }}
            {{- end }}
            limits: { {{ .Values.gpuResource }}: {{ .Values.llamacpp.gpus }} }
          volumeMounts:
            - { name: config, mountPath: /router.sh, subPath: router.sh }
            - { name: models, mountPath: /library }
            - { name: engine, mountPath: /presets, readOnly: true }
            - { name: kvcache, mountPath: /kvcache }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - { name: config, configMap: { name: arena-config, defaultMode: 0555 } }
        {{- include "arena.claim" (list "models" (include "arena.modelsClaim" .)) | nindent 8 }}
        {{- include "arena.claim" (list "engine" "arena-engine") | nindent 8 }}
        {{- if .Values.llamacpp.kvCacheClaim }}
        - { name: kvcache, persistentVolumeClaim: { claimName: {{ .Values.llamacpp.kvCacheClaim | quote }} } }
        {{- else }}
        - { name: kvcache, emptyDir: { sizeLimit: {{ .Values.llamacpp.kvCacheSize | quote }} } }
        {{- end }}
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: 2Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "llamacpp") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
---
{{- end }}
{{- /*
vLLM: one Deployment per instance, each running services/vllm/supervisor.sh over its own desired state
(/presets/NAME/models.json, written by the app into the engine claim) and status (/status/NAME, the
vllm-status claim the app reads). No Docker socket and no API access: the claims are the whole channel.
*/}}
{{- if .Values.vllm.enabled }}
{{- range .Values.vllm.instances }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: {{- include "arena.labels" $ | nindent 4 }}
spec:
  replicas: 1
  # Its GPUs are free for the next one only once this one has gone.
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" .name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" .name) | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" $ | nindent 6 }}
      {{- with .nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: {{ include "arena.image" (dict "root" $ "image" (ternary $.Values.images.python $.Values.images.vllm $.Values.vllm.fake)) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          command: [/bin/sh, /vllm/supervisor.sh]
          env:
            {{- include "arena.secretEnv" (list $ "ENGINE_KEY" "ENGINE_KEY") | nindent 12 }}
            - { name: CUDA_DEVICE_ORDER, value: PCI_BUS_ID }
            - { name: VLLM_PRESETS, value: /presets/{{ .name }} }
            - { name: VLLM_STATUS, value: /status/{{ .name }} }
            - { name: VLLM_BIN, value: {{ ternary "/fake-vllm/vllm" "vllm" $.Values.vllm.fake }} }
            - { name: HF_HUB_OFFLINE, value: "1" }
          resources:
            {{- with $.Values.vllm.resources.requests }}
            requests: {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- if not $.Values.vllm.fake }}
            limits: { {{ $.Values.gpuResource }}: {{ .gpus }} }
            {{- end }}
          volumeMounts:
            - { name: config, mountPath: /vllm/supervisor.sh, subPath: vllm-supervisor.sh }
            - { name: config, mountPath: /vllm/vllm-helper.py, subPath: vllm-helper.py }
            - { name: config, mountPath: /gpu-probe.py, subPath: gpu-probe.py }
            - { name: config, mountPath: /fake-vllm/fake_vllm.py, subPath: fake_vllm.py }
            - { name: config, mountPath: /fake-vllm/vllm, subPath: fake-vllm }
            - { name: models, mountPath: /library, readOnly: true }
            - { name: engine, mountPath: /presets, readOnly: true }
            - { name: status, mountPath: /status }
            - { name: shm, mountPath: /dev/shm }
            - { name: kvcache, mountPath: /kvcache }
      volumes:
        - { name: config, configMap: { name: arena-config, defaultMode: 0555 } }
        {{- include "arena.claim" (list "models" (include "arena.modelsClaim" $)) | nindent 8 }}
        {{- include "arena.claim" (list "engine" "arena-engine") | nindent 8 }}
        {{- include "arena.claim" (list "status" "arena-vllm-status") | nindent 8 }}
        {{- if $.Values.vllm.kvcacheClaim }}
        {{- include "arena.claim" (list "kvcache" $.Values.vllm.kvcacheClaim) | nindent 8 }}
        {{- else }}
        - { name: kvcache, emptyDir: {} }
        {{- end }}
        - { name: shm, emptyDir: { medium: Memory, sizeLimit: {{ $.Values.vllm.shmSize }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels: {{- include "arena.labels" $ | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" .name) | nindent 4 }}
  # The supervisor gives each model a port of its own (from 8001), as the app's desired state says.
  ports:
    {{- range $i := until 16 }}
    - { name: model-{{ $i }}, port: {{ add 8001 $i }}, targetPort: {{ add 8001 $i }} }
    {{- end }}
---
{{- end }}
{{- end }}
{{- /* Embeddings for Argus, on the CPU. The app fetches the file into the library's embed folder. */}}
{{- if .Values.embed.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "embed") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "embed") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      containers:
        - name: embed
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.llamacpp) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: [/bin/sh, -c]
          args:
            - |
              until [ -f /models/embed/nomic-embed-text-v1.5.f16.gguf ]; do sleep 30; done
              exec /app/llama-server -m /models/embed/nomic-embed-text-v1.5.f16.gguf --alias nomic-embed-text --embeddings --pooling mean \
                -ngl 0 -c 2048 -b 2048 -ub 2048 -t 4 --parallel 2 --port 8080
          ports: [{ name: http, containerPort: 8080 }]
          resources: {{- toYaml .Values.embed.resources | nindent 12 }}
          volumeMounts: [{ name: models, mountPath: /models, readOnly: true }]
      volumes:
        {{- include "arena.claim" (list "models" (include "arena.modelsClaim" .)) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: embed
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "embed") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
---
{{- end }}
{{- /* Pictures and video (stable-diffusion.cpp): each runs the model the app names in its control file (sd-serve.sh). */}}
{{- $media := list (dict "name" "imagegen" "on" .Values.imagegen) (dict "name" "videogen" "on" .Values.videogen) }}
{{- range $media }}
{{- if .on.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels: {{- include "arena.labels" $ | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" .name) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" .name) | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" $ | nindent 6 }}
      securityContext: { runAsUser: 65534, runAsGroup: 65534, runAsNonRoot: true }
      {{- with .on.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .on.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ include "arena.image" (dict "root" $ "image" $.Values.images.sdcpp) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          command: [/bin/sh, /sd-serve.sh]
          ports: [{ name: http, containerPort: 1234 }]
          env:
            - { name: NAME, value: {{ .name }} }
            - { name: CUDA_DEVICE_ORDER, value: PCI_BUS_ID }
          resources: { limits: { {{ $.Values.gpuResource }}: {{ .on.gpus }} } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
          volumeMounts:
            - { name: config, mountPath: /sd-serve.sh, subPath: sd-serve.sh }
            - { name: models, mountPath: /models, readOnly: true }
            - { name: engine, mountPath: /control, readOnly: true }
            - { name: status, mountPath: /status }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: arena-config, defaultMode: 0555 } }
        {{- include "arena.claim" (list "models" (include "arena.modelsClaim" $)) | nindent 8 }}
        {{- include "arena.claim" (list "engine" "arena-engine") | nindent 8 }}
        {{- include "arena.claim" (list "status" "arena-media-status") | nindent 8 }}
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels: {{- include "arena.labels" $ | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" .name) | nindent 4 }}
  ports: [{ name: http, port: 1234, targetPort: http }]
---
{{- end }}
{{- end }}
{{- /* Speech to text and text to speech. It fetches its models itself. */}}
{{- if .Values.audio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "arena.selector" (dict "root" $ "name" "audio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "arena.selector" (dict "root" $ "name" "audio") | nindent 8 }}
    spec:
      {{- include "arena.podDefaults" . | nindent 6 }}
      containers:
        - name: audio
          image: {{ include "arena.image" (dict "root" $ "image" .Values.images.audio) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          # Plain HTTPS downloads: Hugging Face's Xet transfer stalls on flaky links. Its models stay loaded until the app
          # unloads them, not on a timer of its own.
          env: [{ name: HF_HUB_DISABLE_XET, value: "1" }, { name: STT_MODEL_TTL, value: "-1" }, { name: TTS_MODEL_TTL, value: "-1" }]
          volumeMounts: [{ name: models, mountPath: /home/ubuntu/.cache/huggingface/hub }]
      volumes:
        {{- include "arena.claim" (list "models" "arena-audio") | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: audio
  labels: {{- include "arena.labels" . | nindent 4 }}
spec:
  selector: {{- include "arena.selector" (dict "root" $ "name" "audio") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- end }}
