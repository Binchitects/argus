# Argus Arena on Kubernetes: the services of deploy/docker-compose.yml.
# One release per namespace: the services keep the names the app reaches them by
# (litellm, llamacpp, argus, ...). docs/deployment.md, "Helm", says how to install.

# The address people open: https://DOMAIN, gateway.DOMAIN (the API) and argus.DOMAIN (Argus's MCP).
domain: arena.example.com
adminEmail: admin@example.com
# The first chat model (repo:quant, or a .gguf in the library), added once its files are in the library. More under Admin -> Models.
model: unsloth/Qwen3.8-27B-GGUF:UD-Q4_K_XL
# "download": the app downloads the default models (the chat model, pictures, video, speech) once, at its first start.
# Empty: nothing is downloaded but by an admin (Admin -> Models -> Default models), or the files are copied into the library.
defaultModels: ""
gitlab:
  # Argus reads this GitLab with a read-only token (secrets.gitlabToken).
  url: ""
  verifyTls: true
  # Password mode with an LDAP account: "" tries GitLab's own sign-in, then each LDAP one; a provider (ldapmain) only it; off never.
  ldap: ""

# The browser agent's browser (Chromium's DevTools): the chart runs none yet; point it at one you run (http://host:9222).
browser:
  url: ""

# Pull requests on GitHub and Gitea, read with each person's own read-only token (Account -> Code hosts).
codeHosts:
  # "" is github.com; a GitHub Enterprise API (https://github.example.com/api/v3); "off" for none.
  githubApi: ""
  # Your Gitea (https://gitea.example.com); "" for none.
  giteaUrl: ""

# Secrets: left empty, each is made once (randAlphaNum) and kept across upgrades (looked up in the
# release's Secret). For GitOps tools that cannot look up, set them here or name an existingSecret
# with the keys ADMIN_PASSWORD, DB_PASSWORD, APP_KEY, ENGINE_KEY, ARGUS_KEY, GATEWAY_KEY (sk-...),
# and optionally HF_TOKEN, GITLAB_TOKEN, GITLAB_USERNAME, GITLAB_PASSWORD.
# APP_KEY never changes after the first start: the app's key ring depends on it.
secrets:
  existingSecret: ""
  adminPassword: ""
  dbPassword: ""
  appKey: ""
  engineKey: ""
  argusKey: ""
  workspacesKey: ""
  gatewayKey: ""
  hfToken: ""
  gitlabToken: ""
  gitlabUsername: ""
  gitlabPassword: ""

# Images. The app, web, Argus, sandbox and Laya images are built from this repository (docker compose build)
# and pushed to a registry the cluster can pull from; the tag defaults to the chart's appVersion.
images:
  app: { repository: arena-app, tag: "" }
  web: { repository: arena-web, tag: "" }
  argus: { repository: arena-argus, tag: "" }
  sandbox: { repository: arena-sandbox, tag: "" }
  blender: { repository: arena-blender, tag: "" }
  laya: { repository: arena-laya, tag: "" }
  studio: { repository: arena-studio, tag: "" }
  workspaces: { repository: arena-workspaces, tag: "" }
  postgres: { repository: pgvector/pgvector, tag: 0.8.0-pg16 }
  litellm: { repository: ghcr.io/berriai/litellm, tag: main-stable }
  llamacpp: { repository: ghcr.io/ggml-org/llama.cpp, tag: server-cuda }
  # A build that is known to work: master-cuda moves under its flags.
  sdcpp: { repository: ghcr.io/leejet/stable-diffusion.cpp, digest: "sha256:1aee2217d5e20ddfb19dfcbca21db3cbe1dcb0ae3b9bc4151773e503dca8aede" }
  audio: { repository: ghcr.io/speaches-ai/speaches, tag: 0.9.0-rc.3-cpu }
  searxng: { repository: ghcr.io/searxng/searxng, tag: latest }
  prometheus: { repository: prom/prometheus, tag: v3.1.0 }
  alertmanager: { repository: prom/alertmanager, tag: v0.28.0 }
  loki: { repository: grafana/loki, tag: 3.4.1 }
  nodeExporter: { repository: prom/node-exporter, tag: v1.9.0 }
  # The CPU temperature exporter's (services/cpu-temp-exporter, from the chart's files).
  python: { repository: python, tag: 3.13-slim }
  valkey: { repository: public.ecr.aws/valkey/valkey, tag: 8.1-alpine }
  # vLLM (vllm.enabled): an image you have (NGC's, or arena-vllm built from deploy/services/vllm.Dockerfile and
  # pushed to your registry); nothing is pulled while it is off (docs/multi-gpu-server.md §6).
  vllm: { repository: nvcr.io/nvidia/vllm, tag: 26.09-py3 }
  pullPolicy: IfNotPresent
  pullSecrets: []

# Availability of what serves people (the app, the web, the gateway): their replicas spread over nodes
# (strictSpread: never two on one node, which needs as many nodes as replicas), rolled one at a time, a
# PodDisruptionBudget each when it has more than one; autoscale grows them with their CPU up to maxReplicas
# (the cluster's metrics server). The app's replicas share the model library: its volume must be
# ReadWriteMany (storage.className) when they run on several nodes.
availability:
  strictSpread: false
  autoscale:
    enabled: false
    cpuPercent: 70
    maxReplicas: { app: 6, web: 4, litellm: 4 }

app:
  # Several replicas share the database: one leads (the once-only background work), and the
  # ingress keeps each browser on one (ingress.sticky), where its answers run.
  replicas: 2
  resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { memory: 2Gi } }
  # More configuration for the app, as environment variables (Section__Key: value).
  env: {}

web:
  replicas: 2
  resources: { requests: { cpu: 50m, memory: 32Mi }, limits: { memory: 128Mi } }

# This chart's Postgres, or an external one (externalDatabase). Postgres 16 or newer.
postgresql:
  enabled: true
  size: 50Gi
  resources: { requests: { cpu: 250m, memory: 512Mi } }
externalDatabase:
  host: ""
  port: 5432
  # The role needs to create the app's database (llmapp) and the gateway's (litellm), or have both made for it.
  user: arena
  # disable, prefer, require, verify-ca or verify-full (the gateway knows disable, prefer and require).
  sslMode: require
  # A Secret with the server's CA as ca.crt, for verify-ca and verify-full.
  caSecret: ""

litellm:
  # The gateway counts API keys' rate limits in its own memory: with several
  # replicas each counts on its own (docs/admin.md, Rate limits for API keys),
  # unless valkey.enabled: then they share their counts there.
  replicas: 1
  resources: { requests: { cpu: 250m, memory: 1Gi } }

# Valkey: the gateway replicas' shared counts (and LMCache's shared store, engines.lmcacheRemote).
# Its image is Valkey's own registry on ECR; a cache, so one replica and no persistence is enough.
valkey:
  enabled: false
  resources: { requests: { cpu: 100m, memory: 256Mi } }

# The chat models' engine (llama.cpp in router mode), on GPUs. Off: only other GPU servers' models.
# The GPU resource the GPU pods ask for: nvidia.com/gpu (NVIDIA's device plugin or GPU Operator), or
# amd.com/gpu (AMD's device plugin) with ROCm images (images.llamacpp server-rocm, a ROCm images.vllm).
gpuResource: nvidia.com/gpu

# How the app sees the engines' GPUs: llama.cpp's backend (cuda, rocm, vulkan, sycl, metal, cpu: it names
# the GPUs in the presets), and the GPU the picture server and the embedder run on ("": the first, the CPU).
engines:
  backend: cuda
  mediaGpu: ""
  embedGpu: ""
  # LMCache's remote store for the vLLM models' token cache (redis://valkey:6379 with valkey.enabled); "": none.
  lmcacheRemote: ""

llamacpp:
  enabled: true
  gpus: 1
  # Conversations' caches on disk (Engine:KvCacheGb): a claim on a fast local disk (an NVMe), kept across restarts;
  # empty: an emptyDir of this size, lost when the pod moves.
  kvCacheClaim: ""
  kvCacheSize: 200Gi
  resources: { requests: { cpu: "4", memory: 16Gi } }
  nodeSelector: {}
  tolerations: []

# vLLM (Admin -> Models, engine vLLM): one `vllm serve` per model the app wants, on its GPUs (services/vllm/supervisor.sh).
# Each instance is a Deployment of its own with the GPUs it takes (pin it to a node with nodeSelector: several machines).
# The first is the app's "vllm"; more are named to the app too (app.env: Engine__Vllm__1__Name and the like).
# fake: tools/fake-vllm in its place, on the python image, with no GPU (CI, load tests).
vllm:
  enabled: false
  fake: false
  instances:
    - { name: vllm, gpus: 1, nodeSelector: {}, tolerations: [] }
  shmSize: 16Gi
  # LMCache's disk tier (/kvcache): a claim on the node's NVMe (a local-path PV); "": an emptyDir, lost with the pod.
  kvcacheClaim: ""
  resources: { requests: { cpu: "4", memory: 32Gi } }

# Embeddings for Argus, on the CPU.
embed:
  enabled: true
  resources: { requests: { cpu: "2", memory: 2Gi } }

# The code index (GitLab, read-only token) and knowledge packs, over MCP.
argus:
  enabled: true
  size: 50Gi
  # Built knowledge packs to load (Admin -> Packs), as compose's packs/ folder: a claim of yours, mounted read only.
  packLibraryClaim: ""
  resources: { requests: { cpu: "1", memory: 2Gi } }

# Pictures (FLUX.2 klein) and video (Wan2.2 TI2V 5B), on GPUs. Each GPU pod takes whole GPUs unless the
# cluster shares them (the NVIDIA device plugin's time-slicing): video is off here; on one GPU share it, or turn pictures off too.
imagegen:
  enabled: true
  gpus: 1
  nodeSelector: {}
  tolerations: []
videogen:
  enabled: false
  gpus: 1
  nodeSelector: {}
  tolerations: []
# The media studio's own models on a GPU: a picture's background taken away, speech in a voice from a
# sample, music. Off unless turned on; the app fetches their weights (11.6 GB) into the library's studio folder.
studio:
  enabled: false
  gpus: 1
  idleSeconds: 180
  nodeSelector: {}
  tolerations: []
  resources:
    requests: { cpu: "2", memory: 8Gi }
    limits: { cpu: "8", memory: 24Gi }

# Speech to text and text to speech, on the CPU.
audio:
  enabled: true
  size: 20Gi

# The chat's Python: no network (a NetworkPolicy), a read-only root, jobs through a shared volume.
sandbox:
  enabled: true
  resources: { limits: { cpu: "2", memory: 4Gi } }

# Code Studio's workspaces: Code Arena's own engine per workspace, each as its own user (services/workspaces). Off
# unless turned on. Its pod reaches the app, the gateway and the internet (the code host, package registries), not
# the cluster's other services.
workspaces:
  enabled: false
  slots: 32
  resources: { requests: { cpu: "1", memory: 2Gi }, limits: { cpu: "4", memory: 16Gi } }

# The chat's 3D models: Blender headless, as the sandbox is (no network, a read-only root), with more room.
blender:
  enabled: false
  resources: { limits: { cpu: "4", memory: 8Gi } }

# The chat's web search.
searxng:
  enabled: true

# Laya: typed decisions (the chat's Decide tool, Code Arena's look at commands), on the CPU. Off unless
# turned on; the app fetches its two checkpoints (1.5 GB) into the model library's laya folder.
laya:
  enabled: false
  threads: 4
  resources: { requests: { cpu: "2", memory: 4Gi }, limits: { cpu: "4", memory: 6Gi } }

# Prometheus, Alertmanager and Loki: what the app's dashboards, alerts and logs read. Shipping the
# pods' logs to Loki (promtail, or the cluster's own agent) is the cluster's.
monitoring:
  enabled: true
  prometheusSize: 50Gi
  lokiSize: 20Gi
  # The host's figures (node-exporter and the CPU's temperature), as compose's: a DaemonSet with the host's
  # processes and its /, /proc and /sys read only, which a namespace with the restricted or baseline Pod
  # Security level refuses. Off: TargetDown fires for the node and cpu-temp jobs, and the host's disks, memory and
  # temperature go unwatched. On several nodes, a nodeSelector for the GPU node keeps one node's figures.
  hostExporters:
    enabled: true
    nodeSelector: {}
    tolerations: []

# Volumes. The model library and the app's files are shared by several pods (the app's replicas, the
# engines, the sandbox): on more than one node they need ReadWriteMany storage (NFS, CephFS, ...).
persistence:
  storageClass: ""
  sharedStorageClass: ""
  sharedAccessMode: ReadWriteMany
  models: { size: 500Gi, existingClaim: "" }
  engine: { size: 1Gi }
  # What the picture and video servers say they do (their status files), read by the app.
  mediaStatus: { size: 64Mi }
  # What the vLLM supervisors say of their models and GPUs, read by the app.
  vllmStatus: { size: 64Mi }
  directory: { size: 1Gi }
  # The audit log's daily anchors, apart from the database.
  audit: { size: 1Gi }
  sandbox: { size: 10Gi }
  # Code Studio's workspaces: their clones, their engines' homes, what was not pushed yet.
  workspaces: { size: 100Gi }
  blender: { size: 10Gi }

ingress:
  enabled: true
  className: ""
  # A TLS Secret (kubernetes.io/tls) for DOMAIN, gateway.DOMAIN and argus.DOMAIN (a wildcard, or one with the three names).
  tlsSecret: arena-tls
  # Strict-Transport-Security's max-age the app sends: a year, for a certificate browsers trust; 0 while they do not.
  hstsSeconds: 31536000
  # Keeps each browser on one app replica (its answers stream from there): the NGINX controller's
  # cookie affinity and Traefik's sticky cookie are both set; another controller needs its own.
  sticky: true
  annotations: {}
