# A throwaway GitLab CE instance for verifying Argus end to end.
#
# This exists to answer questions no unit test can:
#   * does the service token actually SEE private projects? (the membership=false
#     question that has been open since Phase 1 Task 8)
#   * can developer A genuinely not read developer B's repository through the
#     MCP tools, using two real GitLab personal access tokens?
#
# NOT for production. Root password is in plaintext, TLS is off, and the whole
# instance is disposable.
#
#   docker compose -f deploy/test-gitlab/docker-compose.yml up -d
#   # first boot takes several minutes; watch:
#   docker compose -f deploy/test-gitlab/docker-compose.yml logs -f gitlab
#
# Tear down completely (including data):
#   docker compose -f deploy/test-gitlab/docker-compose.yml down -v

services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: argus-test-gitlab
    hostname: gitlab.test
    restart: unless-stopped
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: "argus-test-root-pw-2026"
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224

        # Trim everything a throwaway verification instance does not need.
        # Without this GitLab CE happily eats 8GB+ and takes far longer to boot.
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
        gitlab_exporter['enable'] = false
        grafana['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['max_concurrency'] = 5
        gitlab_rails['gitlab_default_projects_features_container_registry'] = false
        registry['enable'] = false

        # No outbound mail from a disposable box.
        gitlab_rails['smtp_enable'] = false
        gitlab_rails['gitlab_email_enabled'] = false
    ports:
      - "8929:8929"
      - "2224:22"
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      # GitLab's own healthcheck is slow to go green; give it a long runway.
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 30s
      timeout: 15s
      retries: 40
      start_period: 300s

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
