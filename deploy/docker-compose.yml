# Argus Arena: chat, API keys and credit, code search, pictures, video and voice.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d     # https://$DOMAIN
#
# The core (Traefik, the web, the app, Postgres, the gateway) always runs. Every
# other service runs under its feature's profile, and COMPOSE_PROFILES in .env
# names the features that are on (features beside this file lists them, with
# what each runs and needs; installer.sh --with and --without change them).
#
# Traefik does TLS: Let's Encrypt when ACME_EMAIL is set, else its own
# certificate (config/traefik/README.md has a certificate of your own).

name: arena

x-service: &service
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

x-gpu: &gpu
  deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

services:
  traefik:
    <<: *service
    image: traefik:v3.6.7
    container_name: traefik
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=:${HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Answers stream for minutes.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --ping=true
      - --metrics.prometheus=true
      - --global.checknewversion=false
    environment:
      DOMAIN: ${DOMAIN:-llm.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Strict-Transport-Security's max-age; empty: a year with Let's Encrypt, none with your own CA.
      HSTS_SECONDS: ${HSTS_SECONDS:-}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./config/traefik:/etc/traefik/dynamic:ro
      # A certificate of your own (scripts/make-cert.sh writes it, and config/traefik/certificate.yml naming it).
      - ./certs:/certs:ro
      - acme:/acme
    healthcheck: { test: [CMD, traefik, healthcheck, --ping] }

  web:
    <<: *service
    build: { context: .., dockerfile: src/web/Dockerfile }
    container_name: web
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  app:
    <<: *service
    build: { context: .., dockerfile: src/Llm.Api/Dockerfile }
    container_name: app
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      Auth__Domain: ${DOMAIN:-llm.localhost}
      Auth__HttpsPort: ${HTTPS_PORT:-443}
      Auth__AdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Auth__AdminPassword: ${ADMIN_PASSWORD:-}
      Auth__DataKey: ${APP_KEY:?set APP_KEY in .env}
      # Postgres: this stack's, or an external one (DB_HOST and the rest in .env).
      Database__Host: ${DB_HOST:-postgres}
      Database__Port: ${DB_PORT:-5432}
      Database__Username: ${DB_USER:-arena}
      Database__SslMode: ${DB_SSL_MODE:-prefer}
      Database__Password: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      Gateway__MasterKey: ${GATEWAY_KEY:?set GATEWAY_KEY in .env}
      Engine__ApiKey: ${ENGINE_KEY:?set ENGINE_KEY in .env}
      Engine__FirstModel: ${MODEL:-}
      Engine__DefaultModels: ${DEFAULT_MODELS:-}
      # Engines and GPUs: llama.cpp's backend (cuda, rocm, vulkan, sycl, metal, cpu), and the GPU the
      # picture server and the embedder run on (empty: the first, and the CPU).
      Engine__Backend: ${LLAMACPP_BACKEND:-cuda}
      Engine__MediaGpu: ${MEDIA_GPU:-}
      Engine__EmbedGpu: ${EMBED_GPU:-}
      # LMCache's remote store for the vLLM models' token cache (redis://valkey:6379 with the valkey profile); empty: none.
      Engine__LmcacheRemote: ${LMCACHE_REMOTE:-}
      Argus__AdminToken: ${ARGUS_KEY:?set ARGUS_KEY in .env}
      # Code Studio's workspaces (the workspaces profile): the service and its key.
      Workspaces__Url: http://workspaces:4000
      Workspaces__Key: ${WORKSPACES_KEY:-}
      Argus__GitlabUrl: ${GITLAB_URL:-}
      # The browser agent's browser (COMPOSE_PROFILES=browser); without it the Browser tool says it is not running.
      Browser__Url: ${BROWSER_URL:-http://browser:9222}
      HuggingFace__Token: ${HF_TOKEN:-}
      # How many backups scripts/backup.sh keeps, for Admin -> Storage's preview of old ones.
      Storage__BackupsKept: ${BACKUP_KEEP:-14}
      # Who issued the certificate Traefik serves, for Admin -> Overview.
      Stack__Acme: ${ACME_EMAIL:+letsencrypt}
      # The same HSTS as Traefik's, on the app's own answers (and a cluster without Traefik).
      Stack__HstsSeconds: ${HSTS_SECONDS:-}
      # The features that are on (features): the app leaves the others out of its pages and API.
      Features__On: ${COMPOSE_PROFILES:-}
    volumes:
      - ${MODELS_DIR:-./models}:/library
      - engine:/engine-config
      - media-status:/media-status:ro
      # What the vLLM supervisor says of its models and GPUs (services/vllm/supervisor.sh).
      - vllm-status:/vllm-status:ro
      - directory:/directory
      - sandbox:/sandbox
      - blender:/blender
      - lean:/lean
      # The audit log's daily anchors, kept apart from the database (docs/compliance).
      - audit:/audit
      # scripts/backup.sh's backups, for Admin -> Storage: their sizes and how each ended.
      # Read only: they hold .env and the compose files a restore puts back, so the app
      # never changes or deletes them (scripts/backup.sh --prune removes old ones).
      # Written out as a bind so that BACKUP_DIR=backups, which backup.sh reads as
      # deploy/backups, is that folder here too and not a volume of that name.
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups
        read_only: true
        bind: { create_host_path: true }
    # The stack's network, Laya's and the browser's, which lead nowhere else.
    networks: [default, laya, browsing, studio, workspaces]
    # Not required: with an external Postgres this stack's is left out.
    depends_on: { postgres: { condition: service_healthy, required: false } }

  postgres:
    <<: *service
    image: pgvector/pgvector:0.8.0-pg16
    container_name: postgres
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # The gateway's; the app makes its own.
      POSTGRES_DB: litellm
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: { test: [CMD, pg_isready, -U, arena, -d, litellm], interval: 10s }

  litellm:
    <<: *service
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    # The workspaces' agents call the gateway too, with their own keys.
    networks: [default, workspaces]
    command: [--config, /app/arena.yaml, --port, "4000"]
    environment:
      LITELLM_MASTER_KEY: ${GATEWAY_KEY}
      DATABASE_URL: postgresql://${DB_USER:-arena}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/litellm${DB_SSL_MODE:+?sslmode=}${DB_SSL_MODE:-}
      ENGINE_API_BASE: http://llamacpp:8080/v1
      ENGINE_API_KEY: ${ENGINE_KEY}
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes: [./config/litellm.yaml:/app/arena.yaml:ro]
    depends_on: { postgres: { condition: service_healthy, required: false } }

  # Valkey: the gateway's shared counts when it runs as several replicas (ha.yml), and LMCache's
  # shared store (LMCACHE_REMOTE). Off until asked for: COMPOSE_PROFILES=ha (its image comes from
  # Valkey's own registry on ECR, not pulled while the profile is off). On the stack's network
  # only, never published; append-only, so a restart keeps the counts.
  valkey:
    <<: *service
    image: ${VALKEY_IMAGE:-public.ecr.aws/valkey/valkey:8.1-alpine}
    container_name: valkey
    profiles: [ha]
    command: [valkey-server, --appendonly, "yes", --save, ""]
    volumes: [valkey:/data]

  # The chat models (Admin -> Models), loaded and unloaded live.
  llamacpp:
    <<: [*service, *gpu]
    profiles: [chat-models]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    entrypoint: [/bin/sh, /router.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # What llama.cpp fetches itself (a preset's hf-repo) lands in the library and stays.
      LLAMA_CACHE: /library/.llama.cpp
    volumes:
      - ./services/llamacpp/router.sh:/router.sh:ro
      - ${MODELS_DIR:-./models}:/library
      - engine:/presets:ro
      # Conversations' caches on disk (Engine:KvCacheGb): a fast disk, NVMe.
      - ${KV_CACHE_DIR:-${DATA_DIR:?set DATA_DIR in .env}/kvcache}:/kvcache
    ulimits: { memlock: -1 }
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
          # RAM the host keeps for the engine under memory pressure (cgroup memory.low, never a hard limit):
          # the model's layers and experts held in RAM stay there instead of being read from disk again after
          # an idle spell (a first answer that seems stuck). 0: none.
          memory: ${ENGINE_RAM_PROTECT:-0}

  # vLLM (Admin -> Models, engine vLLM): one `vllm serve` per model the app wants, each on its own
  # GPUs (services/vllm/supervisor.sh follows the app's /presets/vllm/models.json). Off until asked
  # for: COMPOSE_PROFILES=vllm, with VLLM_IMAGE a vLLM image you have (docs/multi-gpu-server.md §6;
  # nothing is pulled while the profile is off). fake-gpu.yml runs it with the fake vLLM instead.
  vllm:
    <<: [*service, *gpu]
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.09-py3}
    container_name: vllm
    profiles: [vllm]
    entrypoint: [/bin/sh, /vllm/supervisor.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # This engine's name: its desired state and status are /presets/vllm and /status/vllm.
      VLLM_PRESETS: /presets/vllm
      VLLM_STATUS: /status/vllm
      # The vLLM to run (fake-gpu.yml: tools/fake-vllm's).
      VLLM_BIN: ${VLLM_BIN:-vllm}
      # Snapshots come from the library, never fetched by vLLM itself.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./services/vllm:/vllm:ro
      - ./services/gpu-probe.py:/gpu-probe.py:ro
      - ../tools/fake-vllm:/fake-vllm:ro
      - ${MODELS_DIR:-./models}:/library:ro
      - engine:/presets:ro
      - vllm-status:/status
      # LMCache's disk tier (a model's KV tier on disk): fast local NVMe, kept across restarts.
      - ${KVCACHE_DIR:-./kvcache}:/kvcache
    ulimits: { memlock: -1 }
    # Tensor parallel ranks talk through shared memory (NCCL).
    shm_size: ${VLLM_SHM:-16gb}

  # Embeddings for Argus and the app's company knowledge, on the CPU. The app fetches the file into MODELS_DIR/embed.
  embed:
    <<: *service
    profiles: [knowledge]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: embed
    volumes: ["${MODELS_DIR:-./models}:/models"]
    entrypoint: [/bin/sh, -c]
    command:
      - |
        until [ -f /models/embed/nomic-embed-text-v1.5.f16.gguf ]; do sleep 30; done
        exec /app/llama-server -m /models/embed/nomic-embed-text-v1.5.f16.gguf --alias nomic-embed-text --embeddings --pooling mean \
          -ngl 0 -c 2048 -b 2048 -ub 2048 -t 4 --parallel 2 --port 8080

  # The code index (GitLab, read-only token) and knowledge packs, over MCP.
  argus:
    <<: *service
    profiles: [argus]
    build: { context: .., dockerfile: src/Argus/Dockerfile, target: server }
    container_name: argus
    command:
      - serve
      - --config=/etc/argus/config.yaml
      - --host=0.0.0.0
      - --port=7700
      - --allowed-host=argus
      - --allowed-host=argus:*
      - --allowed-host=argus.${DOMAIN:-llm.localhost}
      - --allowed-host=argus.${DOMAIN:-llm.localhost}:*
    environment:
      ARGUS_ADMIN_TOKEN: ${ARGUS_KEY}
      ARGUS_CHAT_CLIENT_TOKEN: ${ARGUS_KEY}
      # Coding agents connect with the person's API key (sk-...); the app says whose it is. GitLab tokens are refused.
      ARGUS_KEY_CHECK_URL: http://app:8080/api/authz/key
      ARGUS_GITLAB_URL: ${GITLAB_URL:-}
      ARGUS_GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      # Only where no token can be made for the account: Argus signs in with these once and makes its own token.
      ARGUS_GITLAB_USERNAME: ${GITLAB_USERNAME:-}
      ARGUS_GITLAB_PASSWORD: ${GITLAB_PASSWORD:-}
      ARGUS_GITLAB_LDAP: ${GITLAB_LDAP:-}
      ARGUS_GITLAB_VERIFY: ${GITLAB_VERIFY_TLS:-true}
      # Pull requests on GitHub (or GitHub Enterprise's API, or off) and Gitea, read with each person's own token.
      ARGUS_GITHUB_API: ${GITHUB_API_URL:-}
      ARGUS_GITEA_URL: ${GITEA_URL:-}
      ARGUS_USERS_FILE: /directory/users.yml
      ARGUS_EMBED_URL: http://embed:8080
      ARGUS_PACK_LIBRARY: /pack-library
      ARGUS_APP: "off"
    volumes:
      - ./config/argus.yaml:/etc/argus/config.yaml:ro
      - argus:/var/lib/argus
      # Built knowledge packs to load (Admin -> Packs): the repository's packs/, or ARGUS_PACK_LIBRARY_DIR.
      - ${ARGUS_PACK_LIBRARY_DIR:-../packs}:/pack-library:ro
      - directory:/directory:ro
    # Code Studio's workspaces ask it too, each with the person's own key.
    networks: [default, workspaces]
    # A GitLab on this machine.
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Pictures and video (stable-diffusion.cpp): each runs the model the app names in its
  # control file (Admin -> Models: load, unload, keep loaded, the model's settings), and
  # says what it does in its status file (services/sd-serve.sh).
  imagegen:
    <<: [*service, *gpu]
    profiles: [pictures]
    image: ghcr.io/leejet/stable-diffusion.cpp@sha256:1aee2217d5e20ddfb19dfcbca21db3cbe1dcb0ae3b9bc4151773e503dca8aede
    container_name: imagegen
    user: "65534:65534"
    read_only: true
    environment: { CUDA_DEVICE_ORDER: PCI_BUS_ID, NAME: imagegen }
    volumes: ["${MODELS_DIR:-./models}:/models:ro", "engine:/control:ro", "media-status:/status", "./services/sd-serve.sh:/sd-serve.sh:ro"]
    entrypoint: [/bin/sh, /sd-serve.sh]

  videogen:
    <<: [*service, *gpu]
    profiles: [video]
    image: ghcr.io/leejet/stable-diffusion.cpp@sha256:1aee2217d5e20ddfb19dfcbca21db3cbe1dcb0ae3b9bc4151773e503dca8aede
    container_name: videogen
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    environment: { CUDA_DEVICE_ORDER: PCI_BUS_ID, NAME: videogen }
    volumes: ["${MODELS_DIR:-./models}:/models:ro", "engine:/control:ro", "media-status:/status", "./services/sd-serve.sh:/sd-serve.sh:ro"]
    entrypoint: [/bin/sh, /sd-serve.sh]

  # Speech to text and text to speech. It fetches its models itself.
  audio:
    <<: *service
    profiles: [speech]
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: audio
    # Plain HTTPS downloads: Hugging Face's Xet transfer stalls on flaky links. Its models stay loaded until the app
    # unloads them (unused for a while, Admin -> Models), not on a timer of its own.
    environment: { HF_HUB_DISABLE_XET: "1", STT_MODEL_TTL: "-1", TTS_MODEL_TTL: "-1" }
    volumes: [audio:/home/ubuntu/.cache/huggingface/hub]

  # The chat's Python: no network, a read-only root, each run its own user.
  sandbox:
    <<: *service
    profiles: [sandbox]
    build: ./services/sandbox
    container_name: sandbox
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    tmpfs: ["/work:size=1g,mode=0711", "/tmp:size=64m,mode=0700"]
    volumes: [sandbox:/jobs]

  # The browser agent's browser (the chat's Browser tool): Debian's Chromium, headless, driven by the app over its
  # DevTools. Off unless COMPOSE_PROFILES names browser. Its network leads nowhere: every page goes through the app's
  # proxy (port 3128 there), which opens public sites on the admin's lists only. A read-only root, its own user; each
  # chat its own browser context, closed when unused.
  browser:
    <<: *service
    build: ./services/browser
    image: arena-browser
    container_name: browser
    profiles: [browser]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777", "/home/browser:size=64m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 1g
    environment: { BROWSER_PROXY: "http://app:3128" }
    networks: [browsing]
    pids_limit: 512
    mem_limit: 3g
    cpus: 2

  # The chat's 3D models: Blender headless, as the sandbox is (no network, a read-only root, each run its
  # own user), with more memory and time. Off unless COMPOSE_PROFILES names 3d.
  blender:
    <<: *service
    build: { context: ./services, dockerfile: blender/Dockerfile }
    image: arena-blender
    container_name: blender
    profiles: [3d]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    environment: { SANDBOX_SLOTS: "1", SANDBOX_MAX_TIMEOUT: "600" }
    pids_limit: 512
    mem_limit: 8g
    cpus: 4
    tmpfs: ["/work:size=4g,mode=0711", "/tmp:size=1g,mode=0700"]
    volumes: [blender:/jobs]

  # The science lab's proof checker: Lean 4 with Mathlib, run as the sandbox is (no network, a read-only root, each
  # job its own user and limits); the app hands it Lean files through a volume of its own (Lab/ProofTool.cs). The
  # image holds Mathlib's compiled library (about 13 GB). Off unless COMPOSE_PROFILES names lean.
  lean:
    <<: *service
    build: { context: ./services, dockerfile: lean/Dockerfile, args: { MATHLIB_CACHE_DEBUG_USE_LEGACY: "${LEAN_CACHE_AZURE:-}" } }
    image: arena-lean
    container_name: lean
    profiles: [lean]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    environment: { SANDBOX_SLOTS: "2", SANDBOX_MAX_TIMEOUT: "300" }
    pids_limit: 512
    mem_limit: 14g
    cpus: 4
    tmpfs: ["/work:size=1g,mode=0711", "/tmp:size=512m,mode=0700"]
    volumes: [lean:/jobs]

  # The media studio's own models on the GPU: a picture's background taken away, a text spoken
  # in a voice from a short sample, music from words. Their weights come from the library
  # (MODELS_DIR/studio, fetched by the app); one works at a time and is unloaded when unused.
  # Off unless COMPOSE_PROFILES names studio.
  studio:
    <<: [*service, *gpu]
    build: ./services/studio
    image: arena-studio
    container_name: studio
    profiles: [studio]
    read_only: true
    tmpfs: ["/tmp:size=2g,mode=1777,exec"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: { CUDA_DEVICE_ORDER: PCI_BUS_ID, STUDIO_IDLE: "180" }
    volumes: ["${MODELS_DIR:-./models}:/models:ro"]
    networks: [studio]
    mem_limit: 24g
    cpus: 8

  # Code Studio's workspaces: Code Arena's own engine per workspace (a clone of a project the person works on in the
  # browser's IDE), each as its own user with limits (services/workspaces/supervisor.py). Off unless COMPOSE_PROFILES
  # names workspaces. No Docker socket; only the capabilities to switch users and clean up after them. Its network
  # reaches the app (the IDE's requests come through it), the gateway, Argus (with the person's own key) and the
  # internet (the code host, package registries), not the stack's databases, engines or browser.
  workspaces:
    <<: *service
    build: { context: .., dockerfile: deploy/services/workspaces/Dockerfile }
    image: arena-workspaces
    container_name: workspaces
    profiles: [workspaces]
    init: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    pids_limit: 4096
    mem_limit: ${WORKSPACES_MEMORY:-16g}
    cpus: ${WORKSPACES_CPUS:-4}
    environment:
      WORKSPACES_KEY: ${WORKSPACES_KEY:-}
      WORKSPACES_SLOTS: ${WORKSPACES_SLOTS:-32}
    volumes: [workspaces:/workspaces]
    networks: [workspaces]

  # Laya: typed decisions (a text and questions in, probabilities out) for the chat's
  # Decide tool and Code Arena, on the CPU. Off unless COMPOSE_PROFILES names laya. The
  # app fetches its two checkpoints into MODELS_DIR/laya; it reads them, and reaches
  # nothing: its network has no way out, and only the app is on it.
  laya:
    <<: *service
    build: ./services/laya
    container_name: laya
    profiles: [laya]
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: { LAYA_THREADS: "4" }
    volumes: ["${MODELS_DIR:-./models}:/models:ro"]
    networks: [laya]
    mem_limit: 6g
    cpus: 4

  # The chat's web search.
  searxng:
    <<: *service
    profiles: [web-search]
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    user: "977:977"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/var/cache/searxng:mode=1777", /tmp]
    volumes: [./config/searxng.yml:/etc/searxng/settings.yml:ro]
    # A new secret each start: it signs nothing that outlives the process.
    entrypoint: [/bin/sh, -c, 'export SEARXNG_SECRET=$$(od -An -N32 -tx1 /dev/urandom | tr -d " \n"); exec /usr/local/searxng/entrypoint.sh']

  # Monitoring: the app's dashboards, logs and alerts read these.
  prometheus:
    <<: *service
    profiles: [monitoring]
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    environment: { ENGINE_KEY: "${ENGINE_KEY}", ARGUS_KEY: "${ARGUS_KEY}" }
    entrypoint: [/bin/sh, -c]
    command:
      - |
        printf %s "$$ENGINE_KEY" > /tmp/engine.token; printf %s "$$ARGUS_KEY" > /tmp/argus.token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d --storage.tsdb.retention.size=20GB --web.enable-lifecycle --web.enable-admin-api
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - engine:/engine-sd:ro
      - prometheus:/prometheus

  alertmanager:
    <<: *service
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    volumes: [./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro, alertmanager:/alertmanager]

  loki:
    <<: *service
    profiles: [monitoring]
    image: grafana/loki:3.4.1
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    volumes: [./config/loki.yml:/etc/loki/loki.yml:ro, loki:/loki]

  promtail:
    <<: *service
    profiles: [monitoring]
    image: grafana/promtail:3.4.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./config/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node-exporter:
    <<: *service
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    pid: host
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/rootfs, "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)"]
    volumes: [/proc:/host/proc:ro, /sys:/host/sys:ro, /:/rootfs:ro]

  gpu-exporter:
    <<: [*service, *gpu]
    profiles: [gpu-monitoring]
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: gpu-exporter

  # Data-centre GPU detail (PCIe and NVLink throughput, SM and tensor activity, XID, ECC and retired pages)
  # for the GPU Hardware dashboard's DCGM section. Bare-metal Linux only (not WSL2), and its image is on
  # NVIDIA's registry (nvcr.io): COMPOSE_PROFILES=dcgm turns it on; the installer offers it where it can.
  dcgm-exporter:
    <<: [*service, *gpu]
    image: ${DCGM_EXPORTER_IMAGE:-nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-ubuntu22.04}
    container_name: dcgm-exporter
    profiles: [dcgm]
    cap_add: [SYS_ADMIN]
    environment:
      DCGM_EXPORTER_LISTEN: ":9400"
      DCGM_EXPORTER_KUBERNETES: "false"

  cpu-temp-exporter:
    <<: *service
    profiles: [monitoring]
    image: python:3.13-slim
    container_name: cpu-temp-exporter
    command: [python, /app/exporter.py]
    volumes: [./services/cpu-temp-exporter:/app:ro]

  # GPU_POWER_LIMIT_W and CPU_POWER_LIMIT_W from .env, kept applied. Privileged: it writes /sys.
  power-limits:
    <<: [*service, *gpu]
    profiles: [power-limits]
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: power-limits
    privileged: true
    network_mode: none
    environment:
      GPU_POWER_LIMIT_W: ${GPU_POWER_LIMIT_W:-}
      CPU_POWER_LIMIT_W: ${CPU_POWER_LIMIT_W:-}
    volumes: [./services/power-limits.sh:/power-limits.sh:ro, power-limits:/state]
    entrypoint: [/bin/sh, /power-limits.sh]

networks:
  # Between the app and Laya only: internal, so no way out of the stack.
  laya: { internal: true }
  # Between the app and the browser only: internal, so the browser's only way out is the app's proxy.
  browsing: { internal: true }
  # Between the app and the studio only: internal, so no way out of the stack.
  studio: { internal: true }
  # Between the app, the gateway and Code Studio's workspaces: not internal (a workspace clones, pushes and installs
  # packages), and nothing else of the stack is on it.
  workspaces: {}

# The stack's data lives in folders of DATA_DIR on the host, one per volume (the installer asks where,
# and makes them with their services' owners); compose names them as volumes, so backups and
# restores reach them the same way. DATA_DIR is an absolute folder (a bind needs one).
volumes:
  acme:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/acme" }
  postgres:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/postgres" }
  engine:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/engine" }
  directory:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/directory" }
  # The audit log's anchors: its newest entry and hash each day, where changing the database does not reach.
  audit:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/audit" }
  sandbox:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/sandbox" }
  # Code Studio's workspaces: each a clone, its engine's home and what the person has not pushed yet.
  workspaces:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/workspaces" }
  blender:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/blender" }
  lean:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/lean" }
  argus:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/argus" }
  audio:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/audio" }
  prometheus:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/prometheus" }
  alertmanager:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/alertmanager" }
  loki:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/loki" }
  power-limits:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/power-limits" }
  # What the picture and video servers say they do (services/sd-serve.sh), every 2 s: kept in memory, theirs to write.
  media-status:
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=65534,gid=65534,mode=0755,size=64m" }
  valkey:
  # What the vLLM supervisor says of its models (and the GPUs it sees), every 2 s: in memory, its to write.
  vllm-status:
    driver_opts: { type: tmpfs, device: tmpfs, o: "mode=0755,size=64m" }
