# Argus Arena: chat, API keys and credit, code search, pictures, video and voice.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d     # https://$DOMAIN
#
# Every module runs. To leave one out, name it in docker-compose.override.yml:
#
#   services:
#     videogen: { profiles: [off] }
#
# Traefik does TLS: Let's Encrypt when ACME_EMAIL is set, else its own
# certificate (config/traefik/README.md has a certificate of your own).

name: arena

x-service: &service
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

x-gpu: &gpu
  deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

services:
  traefik:
    <<: *service
    image: traefik:v3.6.7
    container_name: traefik
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=:${HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Answers stream for minutes.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --ping=true
      - --metrics.prometheus=true
      - --global.checknewversion=false
    environment:
      DOMAIN: ${DOMAIN:-llm.localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./config/traefik:/etc/traefik/dynamic:ro
      # A certificate of your own (scripts/make-cert.sh writes it, and config/traefik/certificate.yml naming it).
      - ./certs:/certs:ro
      - acme:/acme
    healthcheck: { test: [CMD, traefik, healthcheck, --ping] }

  web:
    <<: *service
    build: ../src/web
    container_name: web
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  app:
    <<: *service
    build: { context: .., dockerfile: src/Llm.Api/Dockerfile }
    container_name: app
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      Auth__Domain: ${DOMAIN:-llm.localhost}
      Auth__HttpsPort: ${HTTPS_PORT:-443}
      Auth__AdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Auth__AdminPassword: ${ADMIN_PASSWORD:-}
      Auth__DataKey: ${APP_KEY:?set APP_KEY in .env}
      # Postgres: this stack's, or an external one (DB_HOST and the rest in .env).
      Database__Host: ${DB_HOST:-postgres}
      Database__Port: ${DB_PORT:-5432}
      Database__Username: ${DB_USER:-arena}
      Database__SslMode: ${DB_SSL_MODE:-prefer}
      Database__Password: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      Gateway__MasterKey: ${GATEWAY_KEY:?set GATEWAY_KEY in .env}
      Engine__ApiKey: ${ENGINE_KEY:?set ENGINE_KEY in .env}
      Engine__FirstModel: ${MODEL:-}
      Argus__AdminToken: ${ARGUS_KEY:?set ARGUS_KEY in .env}
      Argus__GitlabUrl: ${GITLAB_URL:-}
      HuggingFace__Token: ${HF_TOKEN:-}
      # Who issued the certificate Traefik serves, for Admin -> Overview.
      Stack__Acme: ${ACME_EMAIL:+letsencrypt}
    volumes:
      - ${MODELS_DIR:-./models}:/library
      - engine:/engine-config
      - directory:/directory
      - sandbox:/sandbox
    # Not required: with an external Postgres this stack's is left out.
    depends_on: { postgres: { condition: service_healthy, required: false } }

  postgres:
    <<: *service
    image: pgvector/pgvector:0.8.0-pg16
    container_name: postgres
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # The gateway's; the app makes its own.
      POSTGRES_DB: litellm
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck: { test: [CMD, pg_isready, -U, arena], interval: 10s }

  litellm:
    <<: *service
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    command: [--config, /app/arena.yaml, --port, "4000"]
    environment:
      LITELLM_MASTER_KEY: ${GATEWAY_KEY}
      DATABASE_URL: postgresql://${DB_USER:-arena}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/litellm${DB_SSL_MODE:+?sslmode=}${DB_SSL_MODE:-}
      ENGINE_API_BASE: http://llamacpp:8080/v1
      ENGINE_API_KEY: ${ENGINE_KEY}
      STORE_MODEL_IN_DB: "True"
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes: [./config/litellm.yaml:/app/arena.yaml:ro]
    depends_on: { postgres: { condition: service_healthy, required: false } }

  # The chat models (Admin -> Models), loaded and unloaded live.
  llamacpp:
    <<: [*service, *gpu]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    entrypoint: [/bin/sh, /router.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # What llama.cpp fetches itself (a preset's hf-repo) lands in the library and stays.
      LLAMA_CACHE: /library/.llama.cpp
    volumes:
      - ./services/llamacpp/router.sh:/router.sh:ro
      - ${MODELS_DIR:-./models}:/library
      - engine:/presets:ro
    ulimits: { memlock: -1 }
    shm_size: 2gb

  # Embeddings for Argus and the app's company knowledge, on the CPU. The app fetches the file into MODELS_DIR/embed.
  embed:
    <<: *service
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: embed
    volumes: ["${MODELS_DIR:-./models}:/models"]
    entrypoint: [/bin/sh, -c]
    command:
      - |
        until [ -f /models/embed/nomic-embed-text-v1.5.f16.gguf ]; do sleep 30; done
        exec /app/llama-server -m /models/embed/nomic-embed-text-v1.5.f16.gguf --alias nomic-embed-text --embeddings --pooling mean \
          -ngl 0 -c 2048 -b 2048 -ub 2048 -t 4 --parallel 2 --port 8080

  # The code index (GitLab, read-only token) and knowledge packs, over MCP.
  argus:
    <<: *service
    build: { context: .., dockerfile: src/Argus/Dockerfile, target: server }
    container_name: argus
    command:
      - serve
      - --config=/etc/argus/config.yaml
      - --host=0.0.0.0
      - --port=7700
      - --allowed-host=argus
      - --allowed-host=argus:*
      - --allowed-host=argus.${DOMAIN:-llm.localhost}
      - --allowed-host=argus.${DOMAIN:-llm.localhost}:*
    environment:
      ARGUS_ADMIN_TOKEN: ${ARGUS_KEY}
      ARGUS_CHAT_CLIENT_TOKEN: ${ARGUS_KEY}
      # Coding agents connect with the person's API key (sk-...); the app says whose it is. GitLab tokens are refused.
      ARGUS_KEY_CHECK_URL: http://app:8080/api/authz/key
      ARGUS_GITLAB_URL: ${GITLAB_URL:-}
      ARGUS_GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      # Only where no token can be made for the account: Argus signs in with these once and makes its own token.
      ARGUS_GITLAB_USERNAME: ${GITLAB_USERNAME:-}
      ARGUS_GITLAB_PASSWORD: ${GITLAB_PASSWORD:-}
      ARGUS_GITLAB_VERIFY: ${GITLAB_VERIFY_TLS:-true}
      ARGUS_USERS_FILE: /directory/users.yml
      ARGUS_EMBED_URL: http://embed:8080
      ARGUS_PACK_LIBRARY: /pack-library
      ARGUS_APP: "off"
    volumes:
      - ./config/argus.yaml:/etc/argus/config.yaml:ro
      - argus:/var/lib/argus
      - ../packs:/pack-library:ro
      - directory:/directory:ro
    # A GitLab on this machine.
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Pictures: FLUX.2 klein. The app fetches the files into MODELS_DIR/image, and
  # loads and unloads it (Admin -> Models).
  imagegen:
    <<: [*service, *gpu]
    image: ghcr.io/leejet/stable-diffusion.cpp:master-cuda
    container_name: imagegen
    user: "65534:65534"
    read_only: true
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NAME: imagegen
      FILES: flux-2-klein-4b-Q4_0.gguf Qwen3-4B-Q4_K_M.gguf flux2-vae.safetensors
    volumes: ["${MODELS_DIR:-./models}:/models", "engine:/control:ro", "./services/sd-serve.sh:/sd-serve.sh:ro"]
    working_dir: /models/image/flux2-klein-4b
    entrypoint: [/bin/sh, /sd-serve.sh]
    command: >
      --listen-ip 0.0.0.0 --listen-port 1234 --diffusion-model flux-2-klein-4b-Q4_0.gguf
      --llm Qwen3-4B-Q4_K_M.gguf --vae flux2-vae.safetensors --max-vram 2 --diffusion-fa --cfg-scale 1.0 --steps 4

  # Video: Wan2.2 TI2V 5B. The app fetches the files into MODELS_DIR/video, and
  # loads and unloads it (Admin -> Models).
  videogen:
    <<: [*service, *gpu]
    image: ghcr.io/leejet/stable-diffusion.cpp:master-cuda
    container_name: videogen
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NAME: videogen
      FILES: Wan2.2-TI2V-5B-Q4_K_M.gguf umt5-xxl-encoder-Q4_K_M.gguf wan2.2_vae.safetensors
      # Decode on the GPU when it has this much free (MB) as the server loads: its 3 GB
      # (--max-vram) and the decode's, with room to spare. Less, and it decodes on the CPU.
      VAE_GPU_MB: "8192"
    volumes: ["${MODELS_DIR:-./models}:/models", "engine:/control:ro", "./services/sd-serve.sh:/sd-serve.sh:ro"]
    working_dir: /models/video/wan2.2-ti2v-5b
    entrypoint: [/bin/sh, /sd-serve.sh]
    command: >
      --listen-ip 0.0.0.0 --listen-port 1234 --diffusion-model Wan2.2-TI2V-5B-Q4_K_M.gguf
      --t5xxl umt5-xxl-encoder-Q4_K_M.gguf --vae wan2.2_vae.safetensors --max-vram 3 --diffusion-fa
      --vae-tiling --cfg-scale 5.0 --flow-shift 5.0 --sampling-method euler

  # Speech to text and text to speech. It fetches its models itself.
  audio:
    <<: *service
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: audio
    # Plain HTTPS downloads: Hugging Face's Xet transfer stalls on flaky links.
    environment: { HF_HUB_DISABLE_XET: "1" }
    volumes: [audio:/home/ubuntu/.cache/huggingface/hub]

  # The chat's Python: no network, a read-only root, each run its own user.
  sandbox:
    <<: *service
    build: ./services/sandbox
    container_name: sandbox
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    tmpfs: ["/work:size=1g,mode=0711", "/tmp:size=64m,mode=0700"]
    volumes: [sandbox:/jobs]

  # The chat's web search.
  searxng:
    <<: *service
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    user: "977:977"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/var/cache/searxng:mode=1777", /tmp]
    volumes: [./config/searxng.yml:/etc/searxng/settings.yml:ro]
    # A new secret each start: it signs nothing that outlives the process.
    entrypoint: [/bin/sh, -c, 'export SEARXNG_SECRET=$$(od -An -N32 -tx1 /dev/urandom | tr -d " \n"); exec /usr/local/searxng/entrypoint.sh']

  # Monitoring: the app's dashboards, logs and alerts read these.
  prometheus:
    <<: *service
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    environment: { ENGINE_KEY: "${ENGINE_KEY}", ARGUS_KEY: "${ARGUS_KEY}" }
    entrypoint: [/bin/sh, -c]
    command:
      - |
        printf %s "$$ENGINE_KEY" > /tmp/engine.token; printf %s "$$ARGUS_KEY" > /tmp/argus.token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d --storage.tsdb.retention.size=20GB --web.enable-lifecycle --web.enable-admin-api
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - engine:/engine-sd:ro
      - prometheus:/prometheus

  alertmanager:
    <<: *service
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    volumes: [./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro, alertmanager:/alertmanager]

  loki:
    <<: *service
    image: grafana/loki:3.4.1
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    volumes: [./config/loki.yml:/etc/loki/loki.yml:ro, loki:/loki]

  promtail:
    <<: *service
    image: grafana/promtail:3.4.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./config/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node-exporter:
    <<: *service
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    pid: host
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/rootfs, "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)"]
    volumes: [/proc:/host/proc:ro, /sys:/host/sys:ro, /:/rootfs:ro]

  gpu-exporter:
    <<: [*service, *gpu]
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: gpu-exporter

  cpu-temp-exporter:
    <<: *service
    image: python:3.13-slim
    container_name: cpu-temp-exporter
    command: [python, /app/exporter.py]
    volumes: [./services/cpu-temp-exporter:/app:ro]

  # GPU_POWER_LIMIT_W and CPU_POWER_LIMIT_W from .env, kept applied. Privileged: it writes /sys.
  power-limits:
    <<: [*service, *gpu]
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: power-limits
    privileged: true
    network_mode: none
    environment:
      GPU_POWER_LIMIT_W: ${GPU_POWER_LIMIT_W:-}
      CPU_POWER_LIMIT_W: ${CPU_POWER_LIMIT_W:-}
    volumes: [./services/power-limits.sh:/power-limits.sh:ro, power-limits:/state]
    entrypoint: [/bin/sh, /power-limits.sh]

volumes:
  acme:
  postgres:
  engine:
  directory:
  sandbox:
  argus:
  audio:
  prometheus:
  alertmanager:
  loki:
  power-limits:
