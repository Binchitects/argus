# Arena: chat, API keys and credit, code search, pictures, video and voice.
#
#   cp .env.example .env     # then fill it in
#   docker compose up -d     # https://$DOMAIN
#
# The core (Traefik, the web, the app with its model gateway, Postgres) always runs. Every
# other service runs under its feature's profile, and COMPOSE_PROFILES in .env
# names the features that are on (features beside this file lists them, with
# what each runs and needs; installer.sh --with and --without change them).
#
# Traefik does TLS: Let's Encrypt when ACME_EMAIL is set, else its own
# certificate (config/traefik/README.md has a certificate of your own).

name: arena

x-service: &service
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: 20m, max-file: "5" } }

x-gpu: &gpu
  deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

services:
  traefik:
    <<: *service
    image: traefik:v3.6.7
    container_name: traefik
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=:${HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Answers stream for minutes.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0
      - --entrypoints.websecure.transport.respondingtimeouts.writetimeout=0
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --ping=true
      - --metrics.prometheus=true
      - --global.checknewversion=false
    environment:
      DOMAIN: ${DOMAIN:-llm.localhost}
      # The code-intelligence service's address: CODE_INTEL_HOST.DOMAIN (an upgrade from before 8.0 keeps argus).
      CODE_INTEL_HOST: ${CODE_INTEL_HOST:-code-intel}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # Strict-Transport-Security's max-age; empty: a year with Let's Encrypt, none with your own CA.
      HSTS_SECONDS: ${HSTS_SECONDS:-}
      # Only these addresses or ranges (comma separated) reach the stack at all; empty: every one (config/traefik/routes.yml).
      IP_ALLOW: ${IP_ALLOW:-}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes:
      - ./config/traefik:/etc/traefik/dynamic:ro
      # A certificate of your own (scripts/make-cert.sh writes it, and config/traefik/certificate.yml naming it).
      - ./certs:/certs:ro
      - acme:/acme
    healthcheck: { test: [CMD, traefik, healthcheck, --ping] }

  web:
    <<: *service
    build: { context: .., dockerfile: src/web/Dockerfile, args: { PRODUCT_NAME: "${PRODUCT_NAME:-}", CODE_INTEL_NAME: "${CODE_INTEL_NAME:-}" } }
    container_name: web
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  app:
    <<: *service
    build: { context: .., dockerfile: src/Llm.Api/Dockerfile, args: { PRODUCT_NAME: "${PRODUCT_NAME:-}", CODE_INTEL_NAME: "${CODE_INTEL_NAME:-}" } }
    container_name: app
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      Auth__Domain: ${DOMAIN:-llm.localhost}
      Auth__HttpsPort: ${HTTPS_PORT:-443}
      Auth__AdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Auth__AdminPassword: ${ADMIN_PASSWORD:-}
      Auth__DataKey: ${APP_KEY:?set APP_KEY in .env}
      # Postgres: this stack's, or an external one (DB_HOST and the rest in .env).
      Database__Host: ${DB_HOST:-postgres}
      Database__Port: ${DB_PORT:-5432}
      Database__Username: ${DB_USER:-arena}
      Database__SslMode: ${DB_SSL_MODE:-prefer}
      Database__Password: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      Engine__ApiKey: ${ENGINE_KEY:?set ENGINE_KEY in .env}
      Engine__FirstModel: ${MODEL:-}
      Engine__DefaultModels: ${DEFAULT_MODELS:-}
      # Engines and GPUs: llama.cpp's backend (cuda, rocm, vulkan, sycl, metal, cpu), and the GPU the
      # picture server and the embedder run on (empty: the first, and the CPU).
      Engine__Backend: ${LLAMACPP_BACKEND:-cuda}
      Engine__MediaGpu: ${MEDIA_GPU:-}
      Engine__EmbedGpu: ${EMBED_GPU:-}
      # LMCache's remote store for the vLLM models' token cache (redis://valkey:6379 with the valkey profile); empty: none.
      Engine__LmcacheRemote: ${LMCACHE_REMOTE:-}
      CodeIntel__AdminToken: ${CODE_INTEL_KEY:?set CODE_INTEL_KEY in .env}
      # Code Studio's workspaces (the workspaces profile): the service and its key.
      Workspaces__Url: http://workspaces:4000
      Workspaces__Key: ${WORKSPACES_KEY:-}
      CodeIntel__GitlabUrl: ${GITLAB_URL:-}
      CodeIntel__Host: ${CODE_INTEL_HOST:-code-intel}
      # GitLab's CA when it is the company's own (GITLAB_CA_FILE), trusted by every client the app makes; Settings can add one.
      Tls__CompanyCaFile: ${GITLAB_CA_FILE:+/etc/arena/company-ca.pem}
      # The browser agent's browser (COMPOSE_PROFILES=browser); without it the Browser tool says it is not running.
      Browser__Url: ${BROWSER_URL:-http://browser:9222}
      HuggingFace__Token: ${HF_TOKEN:-}
      # How many backups scripts/backup.sh keeps, for Admin -> Storage's preview of old ones.
      Storage__BackupsKept: ${BACKUP_KEEP:-14}
      # Who issued the certificate Traefik serves, for Admin -> Overview.
      Stack__Acme: ${ACME_EMAIL:+letsencrypt}
      # The same HSTS as Traefik's, on the app's own answers (and a cluster without Traefik).
      Stack__HstsSeconds: ${HSTS_SECONDS:-}
      # The features that are on (features): the app leaves the others out of its pages and API.
      Features__On: ${COMPOSE_PROFILES:-}
    volumes:
      - ${MODELS_DIR:-./models}:/library
      - engine:/engine-config
      - media-status:/media-status:ro
      # What the vLLM supervisor says of its models and GPUs (services/vllm/supervisor.sh).
      - vllm-status:/vllm-status:ro
      - directory:/directory
      - sandbox:/sandbox
      - blender:/blender
      - lean:/lean
      # The audit log's daily anchors, kept apart from the database (docs/compliance).
      - audit:/audit
      # GitLab's CA (GITLAB_CA_FILE), read only; none given: an empty file.
      - ${GITLAB_CA_FILE:-/dev/null}:/etc/arena/company-ca.pem:ro
      # The Code Arena builds' signature, made on the host with the CA's key (scripts/sign-code-arena.sh).
      - code-arena-signature:/downloads-signature:ro
      # scripts/backup.sh's backups, for Admin -> Storage: their sizes and how each ended.
      # Read only: they hold .env and the compose files a restore puts back, so the app
      # never changes or deletes them (scripts/backup.sh --prune removes old ones).
      # Written out as a bind so that BACKUP_DIR=backups, which backup.sh reads as
      # deploy/backups, is that folder here too and not a volume of that name.
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups
        read_only: true
        bind: { create_host_path: true }
    # The stack's network, Laya's and the browser's, which lead nowhere else.
    networks: [default, laya, browsing, studio, workspaces]
    # Not required: with an external Postgres this stack's is left out.
    depends_on: { postgres: { condition: service_healthy, required: false } }

  postgres:
    <<: *service
    image: pgvector/pgvector:0.8.0-pg16
    container_name: postgres
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # The app's (a database the app makes itself otherwise).
      POSTGRES_DB: llmapp
    volumes: [postgres:/var/lib/postgresql/data]
    # Room for parallel queries' shared memory: Docker's 64 MB fails a large sort or hash join with "could not resize
    # shared memory segment ... No space left on device".
    shm_size: 1g
    healthcheck: { test: [CMD, pg_isready, -U, arena, -d, postgres], interval: 10s }

  # Valkey: LMCache's shared store for the vLLM models' token cache (LMCACHE_REMOTE). Off until
  # asked for: COMPOSE_PROFILES=valkey (its image comes from Valkey's own registry on ECR, not
  # pulled while the profile is off). On the stack's network only, never published; append-only,
  # so a restart keeps what it holds.
  valkey:
    <<: *service
    image: ${VALKEY_IMAGE:-public.ecr.aws/valkey/valkey:8.1-alpine}
    container_name: valkey
    profiles: [valkey]
    command: [valkey-server, --appendonly, "yes", --save, ""]
    volumes: [valkey:/data]

  # The chat models (Admin -> Models), loaded and unloaded live.
  llamacpp:
    <<: [*service, *gpu]
    profiles: [chat-models]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    entrypoint: [/bin/sh, /router.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # llama.cpp's own cache, in the library. It fetches nothing: the app writes only the library's files into its
      # presets, and refuses a preset's hf-repo, hf-file or model-url (ModelCatalog's reserved keys).
      LLAMA_CACHE: /library/.llama.cpp
    volumes:
      - ./services/llamacpp/router.sh:/router.sh:ro
      - ${MODELS_DIR:-./models}:/library
      - engine:/presets:ro
      # Conversations' caches on disk (Engine:KvCacheGb): a fast disk, NVMe.
      - ${KV_CACHE_DIR:-${DATA_DIR:?set DATA_DIR in .env}/kvcache}:/kvcache
    ulimits: { memlock: -1 }
    shm_size: 2gb
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
          # RAM the host keeps for the engine under memory pressure (cgroup memory.low, never a hard limit):
          # the model's layers and experts held in RAM stay there instead of being read from disk again after
          # an idle spell (a first answer that seems stuck). 0: none.
          memory: ${ENGINE_RAM_PROTECT:-0}

  # vLLM (Admin -> Models, engine vLLM): one `vllm serve` per model the app wants, each on its own
  # GPUs (services/vllm/supervisor.sh follows the app's /presets/vllm/models.json), a Hugging Face
  # snapshot or a GGUF file from the library. Off until asked for: COMPOSE_PROFILES=vllm. Its image,
  # arena-vllm, is built here (services/vllm.Dockerfile): vLLM's own image, VLLM_IMAGE, with its
  # GGUF plugin (docs/multi-gpu-server.md §6; nothing is built or pulled while the profile is off).
  # vllm-build.yml builds it from PyPI instead; fake-gpu.yml runs the fake vLLM.
  vllm:
    <<: [*service, *gpu]
    build: { context: ./services, dockerfile: vllm.Dockerfile, args: { VLLM_IMAGE: "${VLLM_IMAGE:-vllm/vllm-openai:v0.31.0}" } }
    image: arena-vllm
    container_name: vllm
    profiles: [vllm]
    entrypoint: [/bin/sh, /vllm/supervisor.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      ENGINE_SERVER: vllm
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # This engine's name: its desired state and status are /presets/vllm and /status/vllm.
      VLLM_PRESETS: /presets/vllm
      VLLM_STATUS: /status/vllm
      # The vLLM to run: its launcher, which reads a GGUF file's config and tokenizer from its header first
      # (fake-gpu.yml: tools/fake-vllm's).
      VLLM_BIN: ${VLLM_BIN:-python3 /vllm/serve.py}
      # Models come from the library, never fetched by vLLM itself.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./services/vllm:/vllm:ro
      - ./services/gpu-probe.py:/gpu-probe.py:ro
      - ../tools/fake-vllm:/fake-vllm:ro
      - ${MODELS_DIR:-./models}:/library:ro
      - engine:/presets:ro
      - vllm-status:/status
      # LMCache's disk tier (a model's KV tier on disk): fast local NVMe, kept across restarts.
      - ${KVCACHE_DIR:-./kvcache}:/kvcache
    ulimits: { memlock: -1 }
    # Tensor parallel ranks talk through shared memory (NCCL).
    shm_size: ${VLLM_SHM:-16gb}

  # SGLang (Admin -> Models, engine SGLang): one SGLang server per model the app wants, each on its own GPUs, run
  # by the same supervisor as vLLM's (ENGINE_SERVER=sglang; it follows /presets/sglang/models.json). Off until asked
  # for: COMPOSE_PROFILES=sglang, with SGLANG_IMAGE an SGLang image (lmsysorg/sglang's, or arena-sglang built by
  # sglang-build.yml where Docker Hub cannot be reached). fake-gpu.yml runs it with the fake SGLang instead.
  sglang:
    <<: [*service, *gpu]
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.21-cu130-runtime}
    container_name: sglang
    profiles: [sglang]
    entrypoint: [/bin/sh, /vllm/supervisor.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      ENGINE_SERVER: sglang
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # This engine's name: its desired state and status are /presets/sglang and /status/sglang.
      VLLM_PRESETS: /presets/sglang
      VLLM_STATUS: /status/sglang
      # The SGLang to run (fake-gpu.yml: tools/fake-vllm's, as SGLang).
      VLLM_BIN: ${SGLANG_BIN:-python3 /sglang/serve.py}
      # Models (snapshots or one-file GGUFs) come from the library, never fetched by SGLang itself.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./services/vllm:/vllm:ro
      - ./services/sglang:/sglang:ro
      - ./services/gpu-probe.py:/gpu-probe.py:ro
      - ../tools/fake-vllm:/fake-vllm:ro
      - ${MODELS_DIR:-./models}:/library:ro
      - engine:/presets:ro
      - vllm-status:/status
    ulimits: { memlock: -1 }
    # Tensor parallel ranks talk through shared memory (NCCL).
    shm_size: ${SGLANG_SHM:-16gb}

  # LMDeploy (Admin -> Models, engine LMDeploy): one `lmdeploy serve api_server` per model the app wants,
  # each on its own GPUs, from a Hugging Face snapshot of the library (TurboMind where it has the model,
  # else LMDeploy's PyTorch engine), run by the same supervisor (ENGINE_SERVER=lmdeploy; it follows
  # /presets/lmdeploy/models.json). Off until asked for: COMPOSE_PROFILES=lmdeploy. Its image,
  # arena-lmdeploy, is built from PyPI by lmdeploy-build.yml (LMDeploy's own is on Docker Hub).
  lmdeploy:
    <<: [*service, *gpu]
    image: ${LMDEPLOY_IMAGE:-arena-lmdeploy:0.18.0}
    container_name: lmdeploy
    profiles: [lmdeploy]
    entrypoint: [/bin/sh, /vllm/supervisor.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      ENGINE_SERVER: lmdeploy
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      VLLM_PRESETS: /presets/lmdeploy
      VLLM_STATUS: /status/lmdeploy
      # The LMDeploy to run (fake-gpu.yml: tools/fake-vllm's, as LMDeploy).
      VLLM_BIN: ${LMDEPLOY_BIN:-python3 /lmdeploy/serve.py}
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./services/vllm:/vllm:ro
      - ./services/lmdeploy:/lmdeploy:ro
      - ./services/gpu-probe.py:/gpu-probe.py:ro
      - ../tools/fake-vllm:/fake-vllm:ro
      - ${MODELS_DIR:-./models}:/library:ro
      - engine:/presets:ro
      - vllm-status:/status
    ulimits: { memlock: -1 }
    shm_size: ${LMDEPLOY_SHM:-16gb}

  # Strata (Admin -> Models, engine Strata): its own engine for a few large MoE families as GGUF files
  # (Qwen3.8-Flash-Next, Qwen3.6-35B-A3B), the experts that do not fit the GPUs read from RAM. One
  # `strata launch` per model the app wants, on its GPUs, run by the same supervisor
  # (ENGINE_SERVER=strata; services/strata/serve.py keeps it in the foreground) in Strata's own image
  # from GitHub's registry, with its Python. Its prepared packs and presets are kept in strata-data.
  # Nothing is downloaded: it starts without drafting (STRATA_DRAFTING=mtp once its draft layer is in
  # strata-data). Off until asked for: COMPOSE_PROFILES=strata.
  strata:
    <<: [*service, *gpu]
    image: ${STRATA_IMAGE:-ghcr.io/niko1221/strata:0.2.11-cuda13}
    container_name: strata
    profiles: [strata]
    entrypoint: [/usr/bin/tini, --, /bin/sh, /vllm/supervisor.sh]
    environment:
      ENGINE_KEY: ${ENGINE_KEY}
      ENGINE_SERVER: strata
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      VLLM_PRESETS: /presets/strata
      VLLM_STATUS: /status/strata
      # Strata's own Python runs the supervisor's helper and the launcher (fake-gpu.yml: tools/fake-vllm's, as Strata).
      PATH: /opt/strata/terminal/python/bin:/opt/strata/terminal/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      VLLM_BIN: ${STRATA_BIN:-python3 /strata/serve.py}
      STRATA_CLI: /opt/strata/terminal/bin/strata
      # A model ends its answers and frees its GPUs in up to two minutes.
      VLLM_DRAIN: "120"
    volumes:
      - ./services/vllm:/vllm:ro
      - ./services/strata:/strata:ro
      - ./services/gpu-probe.py:/gpu-probe.py:ro
      - ../tools/fake-vllm:/fake-vllm:ro
      - ${MODELS_DIR:-./models}:/library:ro
      - engine:/presets:ro
      - vllm-status:/status
      - strata-data:/data
    ulimits: { memlock: -1 }
    shm_size: ${STRATA_SHM:-2gb}
    stop_grace_period: 3m
    # Strata's image checks a Strata server of its own for up to two hours; here the supervisor starts one per model
    # the app wants, and none while it wants none: the image's check would keep the service "starting" and the
    # installer waiting for it. The supervisor is the engine, as vLLM's and SGLang's are, with no check of the image's.
    healthcheck:
      disable: true

  # Embeddings for code-intel and the app's company knowledge, on the CPU. The app fetches the file into MODELS_DIR/embed.
  embed:
    <<: *service
    profiles: [knowledge]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: embed
    volumes: ["${MODELS_DIR:-./models}:/models"]
    entrypoint: [/bin/sh, -c]
    command:
      - |
        until [ -f /models/embed/nomic-embed-text-v1.5.f16.gguf ]; do sleep 30; done
        exec /app/llama-server -m /models/embed/nomic-embed-text-v1.5.f16.gguf --alias nomic-embed-text --embeddings --pooling mean \
          -ngl 0 -c 2048 -b 2048 -ub 2048 -t 4 --parallel 2 --port 8080

  # The code index (GitLab, read-only token) and knowledge packs, over MCP.
  code-intel:
    <<: *service
    profiles: [code-intel]
    build: { context: .., dockerfile: src/CodeIntel/Dockerfile, target: server, args: { PRODUCT_NAME: "${PRODUCT_NAME:-}", CODE_INTEL_NAME: "${CODE_INTEL_NAME:-}" } }
    container_name: code-intel
    command:
      - serve
      - --config=/etc/code-intel/config.yaml
      - --host=0.0.0.0
      - --port=7700
      - --allowed-host=code-intel
      - --allowed-host=code-intel:*
      - --allowed-host=${CODE_INTEL_HOST:-code-intel}.${DOMAIN:-llm.localhost}
      - --allowed-host=${CODE_INTEL_HOST:-code-intel}.${DOMAIN:-llm.localhost}:*
    environment:
      CODE_INTEL_ADMIN_TOKEN: ${CODE_INTEL_KEY}
      CODE_INTEL_CHAT_CLIENT_TOKEN: ${CODE_INTEL_KEY}
      # Coding agents connect with the person's API key (sk-...); the app says whose it is. GitLab tokens are refused.
      CODE_INTEL_KEY_CHECK_URL: http://app:8080/api/authz/key
      CODE_INTEL_GITLAB_URL: ${GITLAB_URL:-}
      CODE_INTEL_GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      # Only where no token can be made for the account: code-intel signs in with these once and makes its own token.
      CODE_INTEL_GITLAB_USERNAME: ${GITLAB_USERNAME:-}
      CODE_INTEL_GITLAB_PASSWORD: ${GITLAB_PASSWORD:-}
      CODE_INTEL_GITLAB_LDAP: ${GITLAB_LDAP:-}
      CODE_INTEL_GITLAB_VERIFY: ${GITLAB_VERIFY_TLS:-true}
      # The company CA the app trusts (GITLAB_CA_FILE and Settings), written for code-intel beside the directory, read again as it changes.
      CODE_INTEL_GITLAB_CA_EXTRA: /directory/company-ca.pem
      # Pull requests on GitHub (or GitHub Enterprise's API, or off) and Gitea, read with each person's own token.
      CODE_INTEL_GITHUB_API: ${GITHUB_API_URL:-}
      CODE_INTEL_GITEA_URL: ${GITEA_URL:-}
      CODE_INTEL_USERS_FILE: /directory/users.yml
      CODE_INTEL_EMBED_URL: http://embed:8080
      CODE_INTEL_PACK_LIBRARY: /pack-library
      CODE_INTEL_APP: "off"
      # The security scanners (the scanners feature): security reviews send them the commit read.
      CODE_INTEL_SCANNERS_URL: http://scanners:7800
      # The advisories pack, once installed, renewed each day from GitHub's advisory database and CISA's catalog.
      CODE_INTEL_ADVISORIES_RENEW_HOURS: "24"
    volumes:
      - ./config/code-intel.yaml:/etc/code-intel/config.yaml:ro
      - code-intel:/var/lib/code-intel
      # Built knowledge packs to load (Admin -> Packs): the repository's packs/, or CODE_INTEL_PACK_LIBRARY_DIR.
      - ${CODE_INTEL_PACK_LIBRARY_DIR:-../packs}:/pack-library:ro
      - directory:/directory:ro
    # Code Studio's workspaces ask it too, each with the person's own key; it alone reaches the scanners.
    networks: [default, workspaces, scanning]
    # A GitLab on this machine.
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Pictures and video (stable-diffusion.cpp): each runs the model the app names in its
  # control file (Admin -> Models: load, unload, keep loaded, the model's settings), and
  # says what it does in its status file (services/sd-serve.sh). The image is pinned by a tag
  # of our own (deploy/pinned-images: arenactl build pulls its digest and tags it): an image an
  # offline bundle loads has no digest to be found by on every store, only its tag.
  imagegen:
    <<: [*service, *gpu]
    profiles: [pictures]
    image: ghcr.io/leejet/stable-diffusion.cpp:arena-1aee2217d5e2
    container_name: imagegen
    user: "65534:65534"
    read_only: true
    environment: { CUDA_DEVICE_ORDER: PCI_BUS_ID, NAME: imagegen }
    volumes: ["${MODELS_DIR:-./models}:/models:ro", "engine:/control:ro", "media-status:/status", "./services/sd-serve.sh:/sd-serve.sh:ro"]
    entrypoint: [/bin/sh, /sd-serve.sh]

  videogen:
    <<: [*service, *gpu]
    profiles: [video]
    image: ghcr.io/leejet/stable-diffusion.cpp:arena-1aee2217d5e2
    container_name: videogen
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    environment: { CUDA_DEVICE_ORDER: PCI_BUS_ID, NAME: videogen }
    volumes: ["${MODELS_DIR:-./models}:/models:ro", "engine:/control:ro", "media-status:/status", "./services/sd-serve.sh:/sd-serve.sh:ro"]
    entrypoint: [/bin/sh, /sd-serve.sh]

  # Speech to text and text to speech. It fetches its models itself.
  audio:
    <<: *service
    profiles: [speech]
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    container_name: audio
    # Plain HTTPS downloads: Hugging Face's Xet transfer stalls on flaky links. Its models stay loaded until the app
    # unloads them (unused for a while, Admin -> Models), not on a timer of its own.
    environment: { HF_HUB_DISABLE_XET: "1", STT_MODEL_TTL: "-1", TTS_MODEL_TTL: "-1" }
    volumes: [audio:/home/ubuntu/.cache/huggingface/hub]

  # The chat's Python: no network, a read-only root, each run its own user.
  sandbox:
    <<: *service
    profiles: [sandbox]
    build: ./services/sandbox
    container_name: sandbox
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    # Its jobs at once and its room (.env: SANDBOX_SLOTS, SANDBOX_MEMORY, SANDBOX_CPUS); more wait in line, the chat
    # saying how many are ahead. Each job has at most SANDBOX_JOB_MEMORY_MB of the memory.
    environment: { SANDBOX_SLOTS: "${SANDBOX_SLOTS:-2}", SANDBOX_JOB_MEMORY_MB: "${SANDBOX_JOB_MEMORY_MB:-3072}" }
    pids_limit: ${SANDBOX_PIDS:-256}
    mem_limit: ${SANDBOX_MEMORY:-7g}
    cpus: ${SANDBOX_CPUS:-2}
    tmpfs: ["/work:size=${SANDBOX_WORK:-1g},mode=0711", "/tmp:size=64m,mode=0700"]
    volumes: [sandbox:/jobs]

  # The browser agent's browser (the chat's Browser tool): Debian's Chromium, headless, driven by the app over its
  # DevTools. Off unless COMPOSE_PROFILES names browser. Its network leads nowhere: every page goes through the app's
  # proxy (port 3128 there), which opens public sites on the admin's lists only. A read-only root, its own user; each
  # chat its own browser context, closed when unused.
  browser:
    <<: *service
    build: ./services/browser
    image: arena-browser
    container_name: browser
    profiles: [browser]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777", "/home/browser:size=64m,uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 1g
    environment: { BROWSER_PROXY: "http://app:3128" }
    networks: [browsing]
    pids_limit: 512
    mem_limit: 3g
    cpus: 2

  # The chat's 3D models: Blender headless, as the sandbox is (no network, a read-only root, each run its
  # own user), with more memory and time. Off unless COMPOSE_PROFILES names 3d.
  blender:
    <<: *service
    build: { context: ./services, dockerfile: blender/Dockerfile }
    image: arena-blender
    container_name: blender
    profiles: [3d]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    # Its jobs at once and its room (.env: BLENDER_SLOTS, BLENDER_MEMORY, BLENDER_CPUS): a render takes the CPUs it has.
    environment: { SANDBOX_SLOTS: "${BLENDER_SLOTS:-1}", SANDBOX_MAX_TIMEOUT: "600", SANDBOX_JOB_MEMORY_MB: "${BLENDER_JOB_MEMORY_MB:-3072}" }
    pids_limit: 512
    mem_limit: ${BLENDER_MEMORY:-8g}
    cpus: ${BLENDER_CPUS:-4}
    tmpfs: ["/work:size=${BLENDER_WORK:-4g},mode=0711", "/tmp:size=1g,mode=0700"]
    volumes: [blender:/jobs]

  # The science lab's proof checker: Lean 4 with Mathlib, run as the sandbox is (no network, a read-only root, each
  # job its own user and limits); the app hands it Lean files through a volume of its own (Lab/ProofTool.cs). The
  # image holds Mathlib's compiled library (about 13 GB). Off unless COMPOSE_PROFILES names lean.
  lean:
    <<: *service
    build: { context: ./services, dockerfile: lean/Dockerfile, args: { MATHLIB_CACHE_DEBUG_USE_LEGACY: "${LEAN_CACHE_AZURE:-}" } }
    image: arena-lean
    container_name: lean
    profiles: [lean]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: [no-new-privileges:true]
    environment: { SANDBOX_SLOTS: "${LEAN_SLOTS:-2}", SANDBOX_MAX_TIMEOUT: "300" }
    pids_limit: 512
    mem_limit: ${LEAN_MEMORY:-14g}
    cpus: ${LEAN_CPUS:-4}
    tmpfs: ["/work:size=1g,mode=0711", "/tmp:size=512m,mode=0700"]
    volumes: [lean:/jobs]

  # The media studio's own models on the GPU: a picture's background taken away, a text spoken
  # in a voice from a short sample, music from words. Their weights come from the library
  # (MODELS_DIR/studio, fetched by the app); one works at a time and is unloaded when unused.
  # Off unless COMPOSE_PROFILES names studio.
  studio:
    <<: [*service, *gpu]
    build: ./services/studio
    image: arena-studio
    container_name: studio
    profiles: [studio]
    read_only: true
    tmpfs: ["/tmp:size=2g,mode=1777,exec"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: { CUDA_DEVICE_ORDER: PCI_BUS_ID, STUDIO_IDLE: "180" }
    volumes: ["${MODELS_DIR:-./models}:/models:ro"]
    networks: [studio]
    mem_limit: 24g
    cpus: 8

  # Code Studio's workspaces: Code Arena's own engine per workspace (a clone of a project the person works on in the
  # browser's IDE), each as its own user with limits (services/workspaces/supervisor.py). Off unless COMPOSE_PROFILES
  # names workspaces. No Docker socket; only the capabilities to switch users and clean up after them. Its network
  # reaches the app (the IDE's requests come through it, and its agents' model calls), code-intel (with the person's own key)
  # and the internet (the code host, package registries), not the stack's databases, engines or browser.
  workspaces:
    <<: *service
    build: { context: .., dockerfile: deploy/services/workspaces/Dockerfile, args: { PRODUCT_NAME: "${PRODUCT_NAME:-}", CODE_INTEL_NAME: "${CODE_INTEL_NAME:-}" } }
    image: arena-workspaces
    container_name: workspaces
    profiles: [workspaces]
    init: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    # The agent's commands run in bubblewrap, which makes user, PID and mount namespaces without any capability: the
    # seccomp profile allows the calls for them (Podman's default, config/workspaces-seccomp.json; Docker's refuses them
    # without CAP_SYS_ADMIN), AppArmor's docker-default refuses its mounts, and a masked /proc refuses its own /proc.
    # The container keeps no capability to use them for itself.
    security_opt: [no-new-privileges:true, seccomp=./config/workspaces-seccomp.json, apparmor=unconfined, systempaths=unconfined]
    pids_limit: 4096
    mem_limit: ${WORKSPACES_MEMORY:-16g}
    cpus: ${WORKSPACES_CPUS:-4}
    environment:
      WORKSPACES_KEY: ${WORKSPACES_KEY:-}
      WORKSPACES_SLOTS: ${WORKSPACES_SLOTS:-32}
    volumes: [workspaces:/workspaces]
    networks: [workspaces]

  # Laya: typed decisions (a text and questions in, probabilities out) for the chat's
  # Decide tool and Code Arena, on the CPU. Off unless COMPOSE_PROFILES names laya. The
  # app fetches its two checkpoints into MODELS_DIR/laya; it reads them, and reaches
  # nothing: its network has no way out, and only the app is on it.
  laya:
    <<: *service
    build: ./services/laya
    container_name: laya
    profiles: [laya]
    user: "65534:65534"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: { LAYA_THREADS: "4" }
    volumes: ["${MODELS_DIR:-./models}:/models:ro"]
    networks: [laya]
    mem_limit: 6g
    cpus: 4

  # The security scanners: opengrep with Arena's own rules, Bandit, gitleaks and Trivy's configuration checks, run on
  # a commit code-intel sends (a security review's). Off unless COMPOSE_PROFILES names scanners. Its network is code-intel's
  # alone and leads nowhere: the scanners fetch nothing, and nothing they are sent is run. A read-only root, nobody's
  # user, and each scan's files in memory, gone when it ends.
  scanners:
    <<: *service
    build: ./services/scanners
    image: arena-scanners
    container_name: scanners
    profiles: [scanners]
    user: "65534:65534"
    read_only: true
    tmpfs: ["/work:size=2g,uid=65534,gid=65534,mode=0700", "/tmp:size=256m,uid=65534,gid=65534,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment: { SCANNERS_THREADS: "2" }
    networks: [scanning]
    pids_limit: 512
    mem_limit: 6g
    cpus: 2

  # The chat's web search.
  searxng:
    <<: *service
    profiles: [web-search]
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    user: "977:977"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/var/cache/searxng:mode=1777", /tmp]
    volumes: [./config/searxng.yml:/etc/searxng/settings.yml:ro]
    # A new secret each start: it signs nothing that outlives the process.
    entrypoint: [/bin/sh, -c, 'export SEARXNG_SECRET=$$(od -An -N32 -tx1 /dev/urandom | tr -d " \n"); exec /usr/local/searxng/entrypoint.sh']

  # Monitoring: the app's dashboards, logs and alerts read these.
  prometheus:
    <<: *service
    profiles: [monitoring]
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    environment: { ENGINE_KEY: "${ENGINE_KEY}", CODE_INTEL_KEY: "${CODE_INTEL_KEY}" }
    entrypoint: [/bin/sh, -c]
    command:
      - |
        printf %s "$$ENGINE_KEY" > /tmp/engine.token; printf %s "$$CODE_INTEL_KEY" > /tmp/code-intel.token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=30d --storage.tsdb.retention.size=20GB --web.enable-lifecycle --web.enable-admin-api
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - engine:/engine-sd:ro
      - prometheus:/prometheus

  alertmanager:
    <<: *service
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    volumes: [./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro, alertmanager:/alertmanager]

  loki:
    <<: *service
    profiles: [monitoring]
    image: grafana/loki:3.4.1
    container_name: loki
    command: -config.file=/etc/loki/loki.yml
    volumes: [./config/loki.yml:/etc/loki/loki.yml:ro, loki:/loki]

  promtail:
    <<: *service
    profiles: [monitoring]
    image: grafana/promtail:3.4.1
    container_name: promtail
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./config/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  node-exporter:
    <<: *service
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.0
    container_name: node-exporter
    pid: host
    command: [--path.procfs=/host/proc, --path.sysfs=/host/sys, --path.rootfs=/rootfs, --collector.cpu.info, "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)"]
    volumes: [/proc:/host/proc:ro, /sys:/host/sys:ro, /:/rootfs:ro]

  gpu-exporter:
    <<: [*service, *gpu]
    profiles: [gpu-monitoring]
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: gpu-exporter

  # Data-centre GPU detail (PCIe and NVLink throughput, SM and tensor activity, XID, ECC and retired pages)
  # for the GPU Hardware dashboard's DCGM section. Bare-metal Linux only (not WSL2); NVIDIA's own image on Docker Hub
  # (nvcr.io has the same, where it is reachable): COMPOSE_PROFILES=dcgm turns it on; the installer offers it where it can.
  dcgm-exporter:
    <<: [*service, *gpu]
    image: ${DCGM_EXPORTER_IMAGE:-nvidia/dcgm-exporter:4.6.1-4.8.4}
    container_name: dcgm-exporter
    profiles: [dcgm]
    cap_add: [SYS_ADMIN]
    # The image's defaults leave out SM activity, NVLink, throttle reasons, ECC and retired pages, which the dashboard reads.
    command: ["-f", "/etc/dcgm-exporter/arena-counters.csv"]
    volumes: [./config/dcgm-counters.csv:/etc/dcgm-exporter/arena-counters.csv:ro]
    environment:
      DCGM_EXPORTER_LISTEN: ":9400"
      DCGM_EXPORTER_KUBERNETES: "false"

  cpu-temp-exporter:
    <<: *service
    profiles: [monitoring]
    image: python:3.13-slim
    container_name: cpu-temp-exporter
    command: [python, /app/exporter.py]
    volumes: [./services/cpu-temp-exporter:/app:ro]

  # GPU_POWER_LIMIT_W and CPU_POWER_LIMIT_W from .env, kept applied. Privileged: it writes /sys.
  power-limits:
    <<: [*service, *gpu]
    profiles: [power-limits]
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: power-limits
    privileged: true
    network_mode: none
    # The caps, and the temperature policy that steps them down while a GPU or the CPU runs hot (power-limits.sh).
    environment:
      GPU_POWER_LIMIT_W: ${GPU_POWER_LIMIT_W:-}
      CPU_POWER_LIMIT_W: ${CPU_POWER_LIMIT_W:-}
      THERMAL_POLICY: ${THERMAL_POLICY:-on}
      GPU_TEMP_LIMIT_C: ${GPU_TEMP_LIMIT_C:-83}
      GPU_TEMP_CRITICAL_C: ${GPU_TEMP_CRITICAL_C:-90}
      CPU_TEMP_LIMIT_C: ${CPU_TEMP_LIMIT_C:-90}
      CPU_TEMP_CRITICAL_C: ${CPU_TEMP_CRITICAL_C:-95}
      THERMAL_STEP_PCT: ${THERMAL_STEP_PCT:-10}
      THERMAL_FLOOR_PCT: ${THERMAL_FLOOR_PCT:-50}
    volumes: [./services/power-limits.sh:/power-limits.sh:ro, power-limits:/state]
    entrypoint: [/bin/sh, /power-limits.sh]

networks:
  # Between the app and Laya only: internal, so no way out of the stack.
  laya: { internal: true }
  # Between the app and the browser only: internal, so the browser's only way out is the app's proxy.
  browsing: { internal: true }
  # Between the app and the studio only: internal, so no way out of the stack.
  studio: { internal: true }
  # Between code-intel and the security scanners only: internal, so no way out of the stack.
  scanning: { internal: true }
  # Between the app (its model gateway too) and Code Studio's workspaces: not internal (a workspace clones, pushes and installs
  # packages), and nothing else of the stack is on it.
  workspaces: {}

# The stack's data lives in folders of DATA_DIR on the host, one per volume (the installer asks where,
# and makes them with their services' owners); compose names them as volumes, so backups and
# restores reach them the same way. DATA_DIR is an absolute folder (a bind needs one).
volumes:
  acme:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/acme" }
  postgres:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/postgres" }
  engine:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/engine" }
  directory:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/directory" }
  # The audit log's anchors: its newest entry and hash each day, where changing the database does not reach.
  audit:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/audit" }
  code-arena-signature:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/code-arena-signature" }
  sandbox:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/sandbox" }
  # Code Studio's workspaces: each a clone, its engine's home and what the person has not pushed yet.
  workspaces:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/workspaces" }
  blender:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/blender" }
  lean:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/lean" }
  code-intel:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/code-intel" }
  audio:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/audio" }
  prometheus:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/prometheus" }
  alertmanager:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/alertmanager" }
  loki:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/loki" }
  power-limits:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/power-limits" }
  # Strata's prepared packs, presets and tuning, made from the library's files: kept, so a model starts again without preparing.
  strata-data:
    driver_opts: { type: none, o: bind, device: "${DATA_DIR:?set DATA_DIR in .env: an absolute folder for the stack's data}/strata-data" }
  # What the picture and video servers say they do (services/sd-serve.sh), every 2 s: kept in memory, theirs to write.
  media-status:
    driver_opts: { type: tmpfs, device: tmpfs, o: "uid=65534,gid=65534,mode=0755,size=64m" }
  valkey:
  # What the vLLM supervisor says of its models (and the GPUs it sees), every 2 s: in memory, its to write.
  vllm-status:
    driver_opts: { type: tmpfs, device: tmpfs, o: "mode=0755,size=64m" }
