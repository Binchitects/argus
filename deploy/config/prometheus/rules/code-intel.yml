# Is the code index still telling the truth?
#
# Every other rule in this directory answers a question about the machine: is
# the GPU too hot, is the disk filling, is an engine listening. They can all be
# green while code-intel answers every question out of an index that stopped
# updating last Tuesday -- and an out-of-date index is the worst failure mode
# this stack has, because the answers stay exactly as confident as they were on
# the day the data was good. Nothing goes red. Nothing looks wrong.
#
# So this file watches the index itself. The metrics come from code-intel's
# /admin/metrics (see the `code-intel` scrape job in prometheus.yml); the threshold
# behind `code_intel_index_stale` is code-intel's own CODE_INTEL_INDEX_STALE_AFTER, default
# 3600s, four times the documented 900s polling interval.
#
# The raw timestamps are exported too. If you want a rule at a different
# threshold than the exporter's, write it against
# `time() - code_intel_index_last_run_timestamp_seconds` rather than editing the
# exporter, because the panel's Overview reads the same exporter and the two
# numbers on screen must not be able to disagree.

groups:

  - name: code-intel-index
    interval: 30s
    rules:

      # Per repository and branch. Never indexed counts as stale -- there is
      # nothing to answer from, which is worse than being a day behind -- and a
      # never-run repository exports a timestamp of 0 rather than no series, so
      # it cannot hide from this by being absent.
      - alert: CodeIntelIndexStale
        expr: code_intel_index_stale == 1
        for: 15m
        labels:
          severity: warning
          component: index
        annotations:
          summary: "Index for {{ $labels.repo }} ({{ $labels.branch }}) is out of date"
          description: >-
            No successful indexing pass within CODE_INTEL_INDEX_STALE_AFTER, or the
            repository has never been indexed at all. Answers about this
            repository are being served from old data with no indication to the
            person asking. Check `code-intel index --interval 900` is running,
            gitlab is reachable, and the run is not exceeding its time budget.

      - alert: CodeIntelIndexErrored
        expr: code_intel_index_errored == 1
        for: 15m
        labels:
          severity: warning
          component: index
        annotations:
          summary: "Last index pass for {{ $labels.repo }} ({{ $labels.branch }}) recorded an error"
          description: >-
            The pass ran and failed. The repository is still being served from
            whatever the previous successful pass left behind. The error text
            is in the index's `repos.last_run_error` column and on the admin
            console's Indexing page.

      # The scrape itself is fine (200, and `up` is 1) but code-intel could not read
      # its own index -- a locked database, a missing volume, a bad path. code-intel
      # deliberately answers 200 here rather than 500, so this is the only
      # signal that distinguishes "cannot see the index" from "index is empty",
      # and it is why the rule watches this gauge and not `up`.
      - alert: CodeIntelIndexUnreadable
        expr: code_intel_index_scrape_ok == 0
        for: 5m
        labels:
          severity: critical
          component: index
        annotations:
          summary: "code-intel cannot read its index"
          description: >-
            The metrics endpoint answered but the index query failed. Every
            indexed lookup is failing right now. Check the index database path
            and that its volume is mounted and writable by the code-intel container.

      # code-intel is up and healthy and knows about no repositories at all. That is
      # not "everything is indexed"; it is the GitLab token or the ACL lookup
      # having quietly stopped working, which otherwise presents as an empty
      # table that looks like a fresh install.
      - alert: CodeIntelIndexEmpty
        expr: code_intel_index_repos == 0
        for: 30m
        labels:
          severity: warning
          component: index
        annotations:
          summary: "code-intel knows about no repositories"
          description: >-
            The index has zero repositories registered. Usually the GitLab
            service token has expired or been revoked, or the configured GitLab
            URL no longer resolves. Verify with the admin console's Indexing
            page and `code-intel index --list`.
