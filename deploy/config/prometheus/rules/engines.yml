# The engines the app runs on several GPUs (vLLM and SGLang beside llama.cpp), and the GPUs themselves
# (docs/multi-gpu-server.md §5.7). On a llama.cpp-only stack the vllm: and sglang: series do not exist
# and these stay silent; the DCGM ones need the dcgm profile (or a cluster's DCGM exporter).

groups:
  - name: engines
    interval: 30s
    rules:

      - alert: VllmKvCacheFull
        # vLLM v1 names it kv_cache_usage_perc; older ones gpu_cache_usage_perc.
        expr: max by (model_name) (vllm:kv_cache_usage_perc or vllm:gpu_cache_usage_perc) > 0.95
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "{{ $labels.model_name }}'s token cache is over 95% full"
          description: >-
            vLLM preempts and recomputes answers when its cache is full: answers slow down.
            Give it a CPU tier (Admin -> Models, CPU tier), fewer answers at once, a shorter
            context, or more GPUs.

      - alert: VllmRequestsWaiting
        # The app queues fairly before the engine; requests waiting inside vLLM for minutes means
        # more is let through than it can run.
        expr: min_over_time(vllm:num_requests_waiting[2m]) > 0
        for: 2m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "{{ $labels.model_name }} has had requests waiting inside vLLM for over 2 minutes"
          description: >-
            {{ $value | printf "%.0f" }} waiting. Lower its answers at once in the app (they set the
            gateway's limit), or add a copy of the model.

      - alert: SglangKvCacheFull
        # SGLang's token pool, its totals of its first rank (with priority scheduling each gauge is also per priority).
        expr: max by (model_name) (sglang:token_usage{tp_rank="0",priority=""}) > 0.95
        for: 5m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "{{ $labels.model_name }}'s token cache is over 95% full"
          description: >-
            SGLang retracts and recomputes answers when its token pool is full: answers slow down.
            Give it a CPU tier (Admin -> Models, CPU tier), fewer answers at once, a shorter
            context, or more GPUs.

      - alert: SglangRequestsWaiting
        expr: min_over_time(sglang:num_queue_reqs{tp_rank="0",priority=""}[2m]) > 0
        for: 2m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "{{ $labels.model_name }} has had requests waiting inside SGLang for over 2 minutes"
          description: >-
            {{ $value | printf "%.0f" }} waiting. Lower its answers at once in the app (they set the
            gateway's limit), or add a copy of the model.

      - alert: VllmPreempting
        expr: sum by (model_name) (rate(vllm:num_preemptions_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          component: inference
        annotations:
          summary: "{{ $labels.model_name }} is preempting answers"
          description: "Its cache cannot hold the answers it runs at once: they are stopped and computed again."

      - alert: EngineRestartLoop
        # Each vLLM process (and llama.cpp's router) restarted more than three times in half an hour:
        # the supervisor's backoff is running, the model keeps crashing (its log: Admin -> Models).
        expr: changes(process_start_time_seconds{component="inference"}[30m]) > 3
        labels:
          severity: critical
          component: inference
        annotations:
          summary: "{{ $labels.model }} restarted {{ $value | printf \"%.0f\" }} times in 30 minutes"
          description: "A crash loop. Its status file and log say why (out of memory, a kernel the GPU lacks)."

      - alert: GpuXidErrors
        expr: increase(DCGM_FI_DEV_XID_ERRORS[10m]) > 0
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} reported Xid errors"
          description: >-
            The driver saw a fault on this GPU. Repeated, fence it: place no model on it
            (Admin -> Models) until it is checked (deploy/scripts/gpu-check.sh).

      - alert: GpuEccErrors
        expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[1h]) > 0
        labels:
          severity: critical
          component: gpu
        annotations:
          summary: "GPU {{ $labels.gpu }} had uncorrectable memory errors"
          description: "Double-bit ECC errors: its memory is failing. Fence it and have it replaced."

      - alert: GpuPcieThroughputLow
        # Tensor parallel over PCIe: an all-reduce falling back off P2P shows as little PCIe traffic
        # while the engines are busy.
        expr: >-
          sum(vllm:num_requests_running) > 0
          and on() sum(rate(DCGM_FI_PROF_PCIE_TX_BYTES[5m])) < 1e8
        for: 15m
        labels:
          severity: info
          component: gpu
        annotations:
          summary: "PCIe traffic is low while vLLM answers"
          description: "If a model runs over several GPUs, check P2P (deploy/scripts/gpu-check.sh)."
