# What Prometheus scrapes. The app's dashboards and alerts read it.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: arena

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { tier: core }

  # Each loaded model (the app writes the list): /metrics?model=NAME.
  - job_name: llamacpp
    authorization:
      credentials_file: /tmp/engine.token
    file_sd_configs:
      - files: ["/engine-sd/targets.json"]
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [model]
        target_label: __param_model

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { tier: core, component: host }

  - job_name: nvidia-smi
    static_configs:
      - targets: ["gpu-exporter:9835"]
        labels: { tier: optional, component: gpu }

  - job_name: cpu-temp
    static_configs:
      - targets: ["cpu-temp-exporter:9110"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels: { tier: core }

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels: { tier: optional }

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
        labels: { tier: optional, component: proxy }

  - job_name: argus
    metrics_path: /admin/metrics
    authorization:
      credentials_file: /tmp/argus.token
    static_configs:
      - targets: ["argus:7700"]
        labels: { tier: optional, component: index }
