# pgBackRest for the stack's Postgres (pitr.yml): its repository on the backup disk (BACKUP_DIR/pgbackrest,
# mounted at /pgbackrest), a full backup a week and a differential a day (scripts/backup.sh --pitr full|diff),
# WAL archived continuously, four full backups kept with their WAL.
[global]
repo1-path=/pgbackrest
repo1-retention-full=4
compress-type=zst
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-path=/var/log/pgbackrest
log-level-console=info

[arena]
pg1-path=/var/lib/postgresql/data
pg1-user=arena
