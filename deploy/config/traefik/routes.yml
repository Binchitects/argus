# Traefik's routes. DOMAIN and ACME_EMAIL come from .env through compose.
{{ $domain := env "DOMAIN" }}
{{ $acme := env "ACME_EMAIL" }}
{{ $replicas := atoi (env "APP_REPLICAS") }}
{{ $project := env "COMPOSE_PROJECT_NAME" | default "arena" }}
{{/* HSTS: a year with Let's Encrypt's certificate; with your own CA, only once browsers trust it (HSTS_SECONDS in .env). */}}
{{ $hsts := env "HSTS_SECONDS" | default (ternary "31536000" "0" (ne $acme "")) }}
http:
  routers:
    # The web on the bare domain, except the app's paths (/mcp: Arena MCP, each person's tools for their agents; /mcp/code: the same as code).
    web:
      rule: Host(`{{ $domain }}`)
      service: web
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    app:
      rule: Host(`{{ $domain }}`) && (PathPrefix(`/api`) || PathPrefix(`/connect`) || PathPrefix(`/.well-known`) || Path(`/mcp`) || Path(`/mcp/code`) || PathPrefix(`/scim`))
      service: app
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # The API for keys: OpenAI and Anthropic protocols.
    gateway:
      rule: Host(`gateway.{{ $domain }}`)
      service: litellm
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # The requests that ask a model with a key go by the app: each key's line (as many answered at
    # once as Chat:ApiRequestsPerKey, the rest waiting their turn rather than refused) and the answer
    # cache; straight to LiteLLM when the app is down.
    gateway-completions:
      rule: Host(`gateway.{{ $domain }}`) && (Path(`/v1/chat/completions`) || Path(`/chat/completions`) || Path(`/v1/messages`) || Path(`/messages`) || Path(`/v1/responses`) || Path(`/responses`) || Path(`/v1/completions`) || Path(`/completions`))
      service: completions
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # Speech with keys goes by the app, which reads a text that names no voice in the
    # key's person's voice, and writes down speech that names no language in the
    # language they speak (Your account → Voice); straight to LiteLLM when the app is down.
    # POST only: a browser's preflight (OPTIONS) goes to LiteLLM, which answers it.
    # Pictures with keys go by it too: a picture model that is not loaded is loaded first.
    gateway-speech:
      rule: Host(`gateway.{{ $domain }}`) && Method(`POST`) && (Path(`/v1/audio/speech`) || Path(`/audio/speech`) || Path(`/v1/audio/transcriptions`) || Path(`/audio/transcriptions`) || Path(`/v1/images/generations`) || Path(`/images/generations`))
      service: speech
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # Argus's MCP, for coding agents with their own key.
    argus:
      rule: Host(`argus.{{ $domain }}`)
      service: argus
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}

  services:
    web: { loadBalancer: { servers: [{ url: "http://web:8080" }] } }
{{ if gt $replicas 1 }}
    # Several app replicas (scale.yml): a sticky cookie keeps each browser on one,
    # where its answers run; a replica that stops answering is left out.
    app:
      loadBalancer:
        sticky: { cookie: { name: arena_replica, secure: true, httpOnly: true, sameSite: lax } }
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
        servers:
{{ range $i := until $replicas }}
          - url: "http://{{ $project }}-app-{{ add1 $i }}:8080"
{{ end }}
{{ else }}
    app: { loadBalancer: { servers: [{ url: "http://app:8080" }] } }
{{ end }}
    litellm: { loadBalancer: { servers: [{ url: "http://litellm:4000" }] } }
    argus: { loadBalancer: { servers: [{ url: "http://argus:7700" }] } }
    # The app answers its health check only while the answer cache is on: Traefik
    # asks every 10 seconds, so turning the cache on or off takes effect within that.
    # Whenever the app is up (its health, not the answer cache's mode: the key's line, the fair line
    # and the prompt log are the app's whether the cache is on or off).
    completions:
      failover: { service: app-completions, fallback: litellm }
    app-completions:
      loadBalancer:
        servers: [{ url: "http://app:8080" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
    speech:
      failover: { service: app-speech, fallback: litellm }
    app-speech:
      loadBalancer:
        servers: [{ url: "http://app:8080" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }

  middlewares:
    secure:
      chain: { middlewares: [headers, compress] }
    headers:
      headers: { contentTypeNosniff: true, referrerPolicy: same-origin, stsSeconds: {{ $hsts }}, stsIncludeSubdomains: true }
    # Not the answer streams: compressing them would hold words back.
    compress:
      compress: { excludedContentTypes: [text/event-stream] }

# TLS 1.2 and 1.3 only; for 1.2, only key exchange with forward secrecy and authenticated
# encryption (1.3's ciphers all are). deploy/scripts/compliance-check.py checks it from outside.
tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences: [X25519, CurveP256, CurveP384]
