# Traefik's routes. DOMAIN and ACME_EMAIL come from .env through compose.
{{ $domain := env "DOMAIN" }}
{{ $acme := env "ACME_EMAIL" }}
{{ $replicas := atoi (env "APP_REPLICAS") }}
http:
  routers:
    # The web on the bare domain, except the app's paths (/mcp: Arena MCP, each person's tools for their agents).
    web:
      rule: Host(`{{ $domain }}`)
      service: web
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    app:
      rule: Host(`{{ $domain }}`) && (PathPrefix(`/api`) || PathPrefix(`/connect`) || PathPrefix(`/.well-known`) || Path(`/mcp`) || PathPrefix(`/scim`))
      service: app
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # The API for keys: OpenAI and Anthropic protocols.
    gateway:
      rule: Host(`gateway.{{ $domain }}`)
      service: litellm
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # Chat completions with keys go by the app while its answer cache is on
    # (Settings → API keys), and straight to LiteLLM otherwise or when the app is down.
    gateway-completions:
      rule: Host(`gateway.{{ $domain }}`) && (Path(`/v1/chat/completions`) || Path(`/chat/completions`))
      service: completions
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # Speech with keys goes by the app, which reads a text that names no voice in the
    # key's person's voice (Your account → Voice); straight to LiteLLM when the app is down.
    gateway-speech:
      rule: Host(`gateway.{{ $domain }}`) && (Path(`/v1/audio/speech`) || Path(`/audio/speech`))
      service: speech
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}
    # Argus's MCP, for coding agents with their own key.
    argus:
      rule: Host(`argus.{{ $domain }}`)
      service: argus
      middlewares: [secure]
      tls: {{ if $acme }}{ certResolver: letsencrypt }{{ else }}{}{{ end }}

  services:
    web: { loadBalancer: { servers: [{ url: "http://web:8080" }] } }
{{ if gt $replicas 1 }}
    # Several app replicas (scale.yml): a sticky cookie keeps each browser on one,
    # where its answers run; a replica that stops answering is left out.
    app:
      loadBalancer:
        sticky: { cookie: { name: arena_replica, secure: true, httpOnly: true, sameSite: lax } }
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }
        servers:
{{ range $i := until $replicas }}
          - url: "http://arena-app-{{ add1 $i }}:8080"
{{ end }}
{{ else }}
    app: { loadBalancer: { servers: [{ url: "http://app:8080" }] } }
{{ end }}
    litellm: { loadBalancer: { servers: [{ url: "http://litellm:4000" }] } }
    argus: { loadBalancer: { servers: [{ url: "http://argus:7700" }] } }
    # The app answers its health check only while the answer cache is on: Traefik
    # asks every 10 seconds, so turning the cache on or off takes effect within that.
    completions:
      failover: { service: answer-cache, fallback: litellm }
    answer-cache:
      loadBalancer:
        servers: [{ url: "http://app:8080" }]
        healthCheck: { path: /v1/answer-cache, interval: 10s, timeout: 3s }
    speech:
      failover: { service: app-speech, fallback: litellm }
    app-speech:
      loadBalancer:
        servers: [{ url: "http://app:8080" }]
        healthCheck: { path: /healthz, interval: 10s, timeout: 3s }

  middlewares:
    secure:
      chain: { middlewares: [headers, compress] }
    headers:
      headers: { contentTypeNosniff: true, referrerPolicy: same-origin }
    # Not the answer streams: compressing them would hold words back.
    compress:
      compress: { excludedContentTypes: [text/event-stream] }
