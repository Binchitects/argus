# TLS options for every router. The certificate itself is named in
# certificate.yml, which tls-init writes on every `up`: one signed by the
# stack's own CA (trust config/traefik/certs/ca.crt once), or yours from
# config/tls. Renewals and domain changes need no edit here.
#
# For a real public domain, see the certificatesResolvers block in
# ../traefik.yml.

tls:
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
