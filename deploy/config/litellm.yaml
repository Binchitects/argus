# The gateway: one key per person, their credit, and every request's cost.
# The app registers the models (chat, pictures, speech) as they come and go.
model_list: []

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600

litellm_settings:
  drop_params: true
  # A new person's credit, per period. Each person's own is set under People.
  max_internal_user_budget: 50
  internal_user_budget_duration: 1mo

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # The chat's requests name their person; the spend is theirs.
  user_header_mappings:
    - header_name: X-LLM-User-Email
      litellm_user_role: internal_user

# Before each request the gateway asks the app (http://app:8080, inside the network):
# secrets, blocked words, the model's check and personal data (Settings → Safeguards,
# and each group's own), and the credit, one over the chat and API keys, groups' too.
# The app answers within milliseconds; the chat's own requests pass at once.
# fail_closed: while the app is down (a restart), API requests are refused rather than
# go unchecked; fail_open lets them through instead.
guardrails:
  - guardrail_name: arena-safeguards
    litellm_params:
      guardrail: generic_guardrail_api
      mode: pre_call
      default_on: true
      api_base: http://app:8080/internal/guardrail
      api_key: os.environ/LITELLM_MASTER_KEY
      unreachable_fallback: fail_closed
