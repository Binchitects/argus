# The gateway: one key per person, their credit, and every request's cost.
# The app registers the models (chat, pictures, speech) as they come and go.
model_list: []

router_settings:
  # A model on several GPU servers (Admin -> Models -> Other GPU servers) is a pool:
  # each request goes to the copy with the fewest requests going, never past a
  # copy's slots (the app sends max_parallel_requests with each copy).
  routing_strategy: least-busy
  num_retries: 2
  # A long prompt the engine has not cached reads at 100-150 tokens a second: a full
  # window takes minutes before the first token. The gateway waits longer than Code
  # Arena does for an answer to start (15 minutes), so the client gives up first and
  # says why, never the gateway in the middle of the engine's reading.
  timeout: 960
  stream_timeout: 960
  # Several gateway replicas (ha.yml, Helm valkey.enabled) share their counts here: least-busy, each
  # deployment's max_parallel_requests and the keys' limits stay global. Unset: each counts alone.
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

litellm_settings:
  drop_params: true
  # No budget here: each person's and each group's credits (one per kind: the chat,
  # API keys, pictures, video, speech) are the app's, and it checks them before each
  # request (the guardrail below, and before each chat answer).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Each replica keeps a key it checked in memory this long: a key deleted (rotated, a person
  # removed) stops on every replica within it, not only on the one that deleted it.
  user_api_key_cache_ttl: 10
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # The chat's requests name their person; the spend is theirs.
  user_header_mappings:
    - header_name: X-LLM-User-Email
      litellm_user_role: internal_user

# Before each request the gateway asks the app (http://app:8080, inside the network):
# secrets, blocked words, the model's check and personal data (Settings → Safeguards,
# and each group's own), API access and the credit of the request's kind, groups' too;
# then room in the engine for a model not loaded, so the engine never unloads the big
# one for it. The app answers within milliseconds (at the engine's limit, it may wait up
# to a minute for an idle model to make room); the chat's own requests pass at once.
# fail_closed: while the app is down (a restart), API requests are refused rather than
# go unchecked; fail_open lets them through instead.
guardrails:
  - guardrail_name: arena-safeguards
    litellm_params:
      guardrail: generic_guardrail_api
      mode: pre_call
      default_on: true
      api_base: http://app:8080/internal/guardrail
      api_key: os.environ/LITELLM_MASTER_KEY
      unreachable_fallback: fail_closed
