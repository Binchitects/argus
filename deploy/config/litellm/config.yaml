# ==============================================================================
# LiteLLM gateway (compose profile: gateway)
#
# Why put this in front of vLLM at all?
#   - one virtual API key per person, with spend limits and rate limits
#   - usage attributed to a user, which vLLM alone cannot do (its metrics carry
#     a model_name label but no user dimension)
#   - one endpoint that can front local vLLM AND hosted providers, with fallbacks
#
# Reach it at https://gateway.<LLM_DOMAIN>/v1. Mint per-person keys with
# POST /key/generate using LITELLM_MASTER_KEY.
#
# ONE MODEL, ONE NAME. The model list below has a single entry whose name,
# window and output limit come from .env (MODEL_NAME, MODEL_CONTEXT,
# MODEL_MAX_OUTPUT). LiteLLM does not expand variables in `model_name` or
# `model_info`, so the litellm service renders ${MODEL_NAME}-style tokens in
# this file from its environment at startup -- see its entrypoint in
# docker-compose.yml. Changing model is an .env edit and `docker compose up -d`.
# No aliases: clients see the model's real name only. The models added under
# Admin -> Models are registered by the app, beside this one.
# ==============================================================================

model_list:
  # The engine is chosen in .env: ENGINE_API_BASE / ENGINE_API_KEY, resolved by
  # LiteLLM through os.environ/ (llama.cpp: http://llamacpp:8080/v1, vLLM:
  # http://vllm:8000/v1). ENGINE_MODEL is openai/<the engine's served name>.
  - model_name: ${MODEL_NAME}
    litellm_params:
      model: os.environ/ENGINE_MODEL
      api_base: os.environ/ENGINE_API_BASE
      api_key: os.environ/ENGINE_API_KEY
      # Prices from .env, per 1M tokens, converted to per-token at startup --
      # DeepSeek-style: a prompt token served from the engine's prefix cache
      # (a resent conversation, a system prompt) is priced separately from one
      # the engine had to process. LiteLLM reads the cached count from the
      # response's usage.prompt_tokens_details.cached_tokens.
      input_cost_per_token: ${MODEL_COST_INPUT_TOKEN}
      cache_read_input_token_cost: ${MODEL_COST_CACHED_INPUT_TOKEN}
      output_cost_per_token: ${MODEL_COST_OUTPUT_TOKEN}
      # ------------------------------------------------------- reasoning
      # How hard the model thinks before it answers. These are the ENGINE's
      # chat-template variables, not OpenAI's `reasoning_effort`.
      #
      # Why chat_template_kwargs and not the obvious field: llama-server runs
      # with --jinja, so the model's own template decides what thinking means,
      # and it reads `reasoning_effort` and `enable_thinking` out of Jinja
      # variables. Passing OpenAI's top-level `reasoning_effort` looks like it
      # should work and does not -- LiteLLM drops it for a custom `openai/`
      # api_base. Measured both ways: a top-level reasoning_effort of "minimal"
      # is accepted by the gateway and never reaches the template, while the
      # same value inside chat_template_kwargs reaches it and raises
      # "Unexpected reasoning effort". That one test is the whole reason this
      # block looks unusual.
      #
      # Rendered from .env by the litellm entrypoint, because LiteLLM does not
      # expand variables in nested values.
      chat_template_kwargs:
        # xhigh (the model's own default), medium, or low.
        reasoning_effort: ${MODEL_REASONING_EFFORT}
        # A real YAML boolean after substitution, deliberately: the template
        # tests `enable_thinking is false`, and the STRING "false" is not false
        # in Jinja, so a quoted value here would silently keep thinking on.
        enable_thinking: ${MODEL_ENABLE_THINKING}
    model_info:
      mode: chat
      # Advertise the REAL window: clients cache /model/info, and a stale
      # number there makes them refuse prompts the engine would accept.
      max_input_tokens: ${MODEL_CONTEXT}
      max_output_tokens: ${MODEL_MAX_OUTPUT}
      max_tokens: ${MODEL_CONTEXT}

  # The picture model (compose profile image; see the imagegen service). The
  # litellm entrypoint removes this entry when that profile is off.
  #<image>
  - model_name: ${IMAGEGEN_MODEL_NAME}
    litellm_params:
      # openai/ is the protocol: sd-server answers /v1/images/generations.
      model: openai/sd-cpp-local
      api_base: http://imagegen:1234/v1
      api_key: none
      # Local: no price per picture, but each still counts as the person's request.
      output_cost_per_image: 0
    model_info:
      mode: image_generation
  #</image>

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 600
  # If the local engine is down or saturated, fall back rather than queue.
  # Requires the cloud-fallback entry above.
  # fallbacks:
  #   - local: ["cloud-fallback"]

litellm_settings:
  drop_params: true
  set_verbose: false

  # ------------------------------------------------------------ spend limits
  # A default ceiling for every internal user, so a person who is added to the
  # roster and never given an explicit quota is still bounded. Spend is
  # counted from BOTH surfaces once user_header_mappings is in place, so this
  # is a per-person total rather than a per-key one.
  #
  # These are USD figures derived from token counts and the model's configured
  # price. For a purely local vLLM deployment the "cost" is notional -- what it
  # actually bounds is tokens -- but it is still the lever that stops one
  # person consuming the whole GPU for a month, and it is what the dashboards
  # sum. Set PRICE_INPUT_PER_MTOK, PRICE_CACHED_INPUT_PER_MTOK and
  # PRICE_OUTPUT_PER_MTOK in .env to make the figure mean money.
  #
  # 0 would block every request rather than allow unlimited, so the default is
  # a real number. Raise per-person under Admin -> People (credit).
  max_internal_user_budget: os.environ/LITELLM_DEFAULT_USER_BUDGET
  internal_user_budget_duration: os.environ/LITELLM_BUDGET_DURATION
  # Response cache in Redis, OFF unless a request asks for it. Its key is the
  # model plus the messages -- not the person, not the temperature -- so on for
  # every request it would replay a stored answer for any repeat of the same
  # conversation: "regenerate" would give back the identical reply, and two
  # people who asked the same thing would get one sampled answer between them.
  #
  # What it was meant to speed up, a resent system prompt, is already handled a
  # layer down: the engine's prefix cache reuses those tokens without
  # replaying an old answer. A caller that genuinely wants replay (a fixed eval
  # set, say) opts in per request with  "cache": {"use-cache": true}.
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    ttl: 3600
    mode: default_off
  # Log every request to Langfuse when the `tracing` profile is running.
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # ---------------------------------------------------------------- identity
  # One person's API usage and their chat usage add up to ONE number. The
  # app's chat calls this gateway with its own key and names the person in
  # X-LLM-User-Email; mapping that header to `internal_user` makes LiteLLM's
  # internal user id the person's email -- and the app mints each person's API
  # key with `user_id: <same email>`. One identity, both surfaces.
  #
  # Two jobs, two mechanisms, measured on this stack:
  #
  #   internal_user  ATTRIBUTES the spend (this header mapping).
  #   end user       ENFORCES the ceiling: the chat puts the email in the body's
  #                  `user` field too, because a budget on an internal user binds
  #                  only keys that user owns, and the chat's key is not theirs.
  #
  # So the app provisions each person twice, with the same email and the same
  # ceiling: once as an internal user, once as an end user. Drop either half
  # and you lose either the total or the limit.
  user_header_mappings:
    - header_name: X-LLM-User-Email
      litellm_user_role: internal_user
  # /metrics is an enterprise feature on current builds; the Prometheus job for
  # it is commented out in config/prometheus/prometheus.yml.
  # callbacks: ["prometheus"]
