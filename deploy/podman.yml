# Rootless Podman: the same stack, with what a user's own containers need.
#
#   systemctl --user enable --now podman.socket
#   echo 'HTTP_PORT=8080' >> .env; echo 'HTTPS_PORT=8443' >> .env   # below 1024 needs root
#   podman compose -f docker-compose.yml -f podman.yml up -d
#
# GPUs come through CDI (sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml).
x-gpu: &gpu
  devices: [nvidia.com/gpu=all]

services:
  # The container's root is you here: the app's downloads into MODELS_DIR stay
  # yours, and it reads what the Python runs write (their own uids).
  app:
    user: "0:0"
    cap_add: [DAC_OVERRIDE, FOWNER]

  llamacpp:
    <<: *gpu
    # A user cannot lift the locked-memory limit.
    ulimits: !reset {}
  imagegen: *gpu
  videogen: *gpu
  gpu-exporter: *gpu

  # Podman's API in place of Docker's.
  promtail:
    volumes: !override
      - ./config/promtail.yml:/etc/promtail/promtail.yml:ro
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro

  # Power caps write /sys, which needs the host's root.
  power-limits:
    profiles: [off]
