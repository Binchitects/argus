# Container-side code-intel config. Mounted read-only at /etc/code-intel/config.yaml.
#
# COMMITTED on purpose: docker-compose bind-mounts this path, so a fresh clone
# must contain it or code-intel will not start. It holds no secrets - the GitLab
# token is injected from CODE_INTEL_GITLAB_TOKEN in .env and never written here.
gitlab:
  # A PLACEHOLDER, and only a default. CODE_INTEL_GITLAB_URL in .env overrides it,
  # and that is the setting to change -- this file is committed, so it must not
  # name any real instance. It stays a valid https URL rather than empty so
  # that a missing .env value fails as an unreachable host, which says what is
  # wrong, instead of as a parse error. Leaving it here keeps `docker compose
  # up` working against the bundled test GitLab with nothing configured at all.
  #
  # (For a GitLab on this same machine from inside a container, the reachable
  # name is host.docker.internal, not localhost.)
  url: https://gitlab.example.com
  # Credentials come from the environment only -- never written here. A token
  # from CODE_INTEL_GITLAB_TOKEN, or CODE_INTEL_GITLAB_USERNAME with
  # CODE_INTEL_GITLAB_PASSWORD for the password mode described in docs/CODE_INTEL.md. A
  # `password` key in THIS file is refused outright rather than ignored.
  #
  # TLS for a GitLab that is not on a public CA comes from
  # CODE_INTEL_GITLAB_CA_CERT (a path inside the container; drop the PEM in
  # config/code-intel/tls/) or CODE_INTEL_GITLAB_VERIFY=false when no CA file exists.
  # Both are read from the environment only, so nothing here needs editing.

index:
  data_dir: /var/lib/code-intel
  db_path: /var/lib/code-intel/index.db

packs:
  dir: /var/lib/code-intel/packs
