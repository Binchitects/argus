<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Farzan Arena</title>
  <desc id="d">Your team's private AI, on your hardware, that knows your code: chat, Code Arena, Farzan Graph, Studio, meetings and agents.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a36"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#7c4dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c8ff"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#a77bff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  
    <linearGradient id="obg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <linearGradient id="obelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="owing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b5d56"/>
    </linearGradient>
    <linearGradient id="oa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d8075"/>
    </linearGradient>
    <linearGradient id="owhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eef0"/>
    </linearGradient>
    <radialGradient id="oiris" cx="0.42" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    </defs>

  <rect width="1200" height="380" rx="24" fill="url(#sky)"/>
  <rect width="1200" height="380" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glow)"/>

  <!-- The wise one: the app's mark, an owl in the A. -->
  <g transform="translate(1020 190) scale(0.25) translate(-512 -512)">
  <!-- Its ear tufts, then its body: a round head on a round body. -->
  <path d="M318 318 L282 168 Q284 154 298 160 L420 252 Z" fill="url(#oa)"/>
  <path d="M706 318 L742 168 Q740 154 726 160 L604 252 Z" fill="url(#oa)"/>
  <path d="M512 214 C690 214 784 330 784 500 C784 700 672 840 512 840 C352 840 240 700 240 500 C240 330 334 214 512 214 Z" fill="url(#oa)"/>
  <!-- Its wings, folded at its sides. -->
  <path d="M262 470 C226 600 252 740 352 812 C330 712 334 588 372 492 Z" fill="url(#owing)"/>
  <path d="M762 470 C798 600 772 740 672 812 C694 712 690 588 652 492 Z" fill="url(#owing)"/>
  <!-- Its belly, light, with a few feathers. -->
  <path d="M512 560 C610 560 664 640 664 712 C664 784 600 826 512 826 C424 826 360 784 360 712 C360 640 414 560 512 560 Z" fill="url(#obelly)"/>
  <path d="M452 668 q16 18 32 0 M540 668 q16 18 32 0 M496 716 q16 18 32 0 M452 764 q16 18 32 0 M540 764 q16 18 32 0" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round"/>
  <!-- Its face: the disc its eyes sit in, the eyes, the beak. -->
  <path d="M512 330 C456 290 300 300 300 432 C300 548 420 582 512 532 C604 582 724 548 724 432 C724 300 568 290 512 330 Z" fill="#0b4f4a" opacity="0.55"/>
  <circle cx="412" cy="436" r="104" fill="url(#owhite)"/>
  <circle cx="612" cy="436" r="104" fill="url(#owhite)"/>
  <circle cx="418" cy="440" r="62" fill="url(#oiris)"/>
  <circle cx="606" cy="440" r="62" fill="url(#oiris)"/>
  <circle cx="421" cy="442" r="30" fill="#0b1720"/>
  <circle cx="603" cy="442" r="30" fill="#0b1720"/>
  <circle cx="440" cy="418" r="12" fill="#ffffff"/>
  <circle cx="624" cy="418" r="12" fill="#ffffff"/>
  <path d="M512 552 L484 508 Q512 494 540 508 Z" fill="#f59e0b"/>
  <!-- Its feet. -->
  <path d="M452 832 q-4 26 -18 36 M470 834 q0 28 0 40 M488 832 q4 26 18 36 M536 832 q-4 26 -18 36 M554 834 q0 28 0 40 M572 832 q4 26 18 36" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="76" font-weight="800" letter-spacing="-2" fill="url(#word)">Farzan Arena</text>
    <text x="74" y="200" font-size="27" font-weight="500" fill="#c9d3f5">Your team's private AI. On your hardware. Knows your code.</text>

    <g font-size="17" font-weight="600" fill="#e6ebff">
      <g transform="translate(74 248)">
        <rect width="92" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="46" y="24" text-anchor="middle">Chat</text>
      </g>
      <g transform="translate(178 248)">
        <rect width="150" height="36" rx="18" fill="#5b8cff" fill-opacity="0.22" stroke="#7aa2ff" stroke-opacity="0.6"/>
        <text x="75" y="24" text-anchor="middle">Code Arena</text>
      </g>
      <g transform="translate(340 248)">
        <rect width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="75" y="24" text-anchor="middle">Farzan Graph</text>
      </g>
      <g transform="translate(502 248)">
        <rect width="98" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="49" y="24" text-anchor="middle">Studio</text>
      </g>
      <g transform="translate(612 248)">
        <rect width="124" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
        <text x="62" y="24" text-anchor="middle">Meetings</text>
      </g>
      <g transform="translate(748 248)">
        <rect width="100" height="36" rx="18" fill="#a77bff" fill-opacity="0.22" stroke="#b996ff" stroke-opacity="0.6"/>
        <text x="50" y="24" text-anchor="middle">Agents</text>
      </g>
    </g>

    <text x="74" y="330" font-size="16" fill="#8f9bc4">Self-hosted · runs offline · every person's keys, budgets and permissions · nothing leaves your network</text>
  </g>
</svg>
