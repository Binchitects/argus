# The controls Arena provides, and what proves each one.
#
# The source of truth for docs/compliance/, Admin → Compliance and the guard test
# (tests/Llm.Tests/ComplianceControlsTests.cs), which fails when anything named here
# is gone. Each control:
#   id         area and number (IAM-01); never reused for something else
#   title      what it is, in a few words
#   meets      how Arena meets it
#   frameworks the clauses it serves, as frameworks.yaml lists each framework's
#              (its clauses, or its catalog): iso27001 (clauses 4 to 10 and
#              Annex A), soc2, hipaa (45 CFR, 164.xxx), gdpr (Art.N), iso42001,
#              iso22301, pcidss, csaccm (by domain), nistcsf, nist80053,
#              nist800171, airmf, euaiact (Art.N, Annex N), commoncriteria
#              (families, FIA_UAU)
#   docs       where it is documented: a file under docs/ and a section's anchor
#   tests      what proves it: Project/Class.Method for .NET (the method carries
#              [Trait("Control", "<id>")]), deploy/test_x.py::test_name for Python
#   checks     what watches it live: app:<id> (inside the app, Admin → Compliance)
#              or live:<id> (from outside, deploy/scripts/compliance-check.py)
#   operator   the part of the company that runs it

frameworks:
  iso27001: ISO/IEC 27001:2022, clauses 4 to 10 and Annex A
  soc2: SOC 2, Trust Services Criteria (2017, revised points of focus 2022)
  hipaa: HIPAA Security and Privacy Rules, 45 CFR Part 164
  gdpr: General Data Protection Regulation (EU) 2016/679
  iso42001: ISO/IEC 42001:2023, the AI management system
  iso22301: ISO 22301:2019, business continuity
  pcidss: PCI DSS v4.0.1
  csaccm: CSA Cloud Controls Matrix v4 (CSA STAR)
  nistcsf: NIST Cybersecurity Framework 2.0
  nist80053: NIST SP 800-53 Rev. 5 (FedRAMP's baselines build on it)
  nist800171: NIST SP 800-171 Rev. 3 (CMMC builds on it)
  airmf: NIST AI Risk Management Framework 1.0
  euaiact: EU AI Act, Regulation (EU) 2024/1689
  commoncriteria: Common Criteria CC:2022 (ISO/IEC 15408)

controls:
  - id: IAM-01
    title: Each person signs in as themselves, with a strong password
    meets: >-
      Every person has their own account. Passwords must score 3 or more on
      zxcvbn, with the person's own names counted against them; a wrong
      password and an unknown name get the same answer; guessing one account,
      spraying many and floods are stopped and lock out.
    frameworks:
      iso27001: [A.5.16, A.5.17, A.8.5]
      soc2: [CC6.1, CC6.2]
      hipaa: [164.308(a)(5)(ii)(C), 164.308(a)(5)(ii)(D), 164.312(a)(2)(i), 164.312(d)]
      gdpr: [Art.32]
      pcidss: [8.2, 8.3]
      csaccm: [IAM]
      nistcsf: [PR.AA-01, PR.AA-03]
      nist80053: [AC-2, AC-7, IA-2, IA-4, IA-5, IA-5(1)]
      nist800171: [03.01.01, 03.01.08, 03.05.01, 03.05.05, 03.05.07]
      commoncriteria: [FIA_UID, FIA_UAU, FIA_AFL, FIA_SOS]
    docs: [authentication.md#what-protects-the-sign-in]
    tests:
      - Llm.Tests/IdentityTests.Wrong_password_and_unknown_name_get_the_same_answer
      - Llm.Tests/IdentityTests.A_person_changes_their_own_password_only_with_the_current_one_and_a_strong_new_one
      - Llm.Tests/IdentityTests.Five_failures_ban_that_account_from_that_address_but_not_colleagues_behind_it
      - Llm.Tests/IdentityTests.Spraying_many_accounts_from_one_address_bans_the_address
      - Llm.Tests/IdentityTests.Ten_failures_lock_the_account_from_any_address
      - Llm.Tests/ConcurrentSignInTests.Parallel_wrong_passwords_still_reach_the_lockout
    checks: [app:passwords]
    operator: >-
      A password policy people are told about; no shared accounts; the first
      admin's password (ADMIN_PASSWORD) kept as a break-glass secret.

  - id: IAM-02
    title: Sessions end on their own
    meets: >-
      A session ends after an hour without activity and after 12 hours in any
      case (30 days only when the person asks to stay signed in); each one is
      re-checked against the account every minute, so a disabled person or a
      reset password ends it at once. The cookie is Secure, HttpOnly and
      SameSite.
    frameworks:
      iso27001: [A.8.5]
      soc2: [CC6.1]
      hipaa: [164.312(a)(2)(iii)]
      gdpr: [Art.32]
      pcidss: [8.2]
      csaccm: [IAM]
      nistcsf: [PR.AA-03]
      nist80053: [AC-11, AC-12, SC-23]
      nist800171: [03.01.10, 03.01.11]
      commoncriteria: [FTA_SSL]
    docs: [authentication.md#what-protects-the-sign-in]
    tests:
      - Llm.Tests/SessionCapTests.Refreshing_a_session_does_not_restart_the_twelve_hour_cap
      - Llm.Tests/IdentityTests.A_password_reset_ends_the_persons_sessions_and_only_the_new_password_works
      - Llm.Tests/IdentityTests.Disabling_signs_out_and_blocks_keys_and_enabling_undoes_it
    checks: [app:sessions, live:cookies]
    operator: >-
      Decide whether "keep me signed in" fits (for health data, set
      Auth:RememberMe no longer than Auth:SessionMax); screens locked when
      people step away.

  - id: IAM-03
    title: Two-factor sign-in
    meets: >-
      People enrol an authenticator app and get recovery codes; an admin can
      reset a lost one. The company requires it of admins or of everyone, and a
      group of its members: who has none sets it up at their next sign-in and
      reaches nothing else until then, and cannot turn it off while it is
      required. Company sign-in brings the identity provider's own second
      factor: when one is required, the provider must say it was used (OIDC's
      amr or acr, SAML's authentication context), or the sign-in is refused.
    frameworks:
      iso27001: [A.8.5]
      soc2: [CC6.1]
      hipaa: [164.312(d)]
      gdpr: [Art.32]
      pcidss: [8.4, 8.5]
      csaccm: [IAM]
      nistcsf: [PR.AA-03]
      nist80053: [IA-2(1), IA-2(2)]
      nist800171: [03.05.03]
      commoncriteria: [FIA_UAU]
    docs: [authentication.md#what-protects-the-sign-in]
    tests:
      - Llm.Tests/IdentityTests.Two_factor_sign_in_with_an_authenticator_and_with_a_recovery_code
      - Llm.Tests/TwoFactorPolicyTests.Required_of_everyone_a_person_without_one_sets_it_up_first_reaches_nothing_else_and_cannot_turn_it_off
      - Llm.Tests/TwoFactorPolicyTests.Required_of_admins_or_of_a_groups_members_it_reaches_only_them_and_the_compliance_check_says_who_has_none
      - Llm.Tests/CompanySignInTests.A_second_factor_required_of_someone_must_come_from_the_provider
      - Llm.Tests/SamlSignInTests.A_second_factor_required_of_someone_must_be_the_assertions_authentication_context
    checks: [app:two-factor]
    operator: >-
      Choose who must use it (Settings → Sign-in: admins at least; everyone
      for health data); require a second factor at the identity provider for
      company sign-in.

  - id: IAM-04
    title: Joiners and leavers follow the company's directory
    meets: >-
      People come from the company's directory (LDAP or Active Directory),
      OIDC or SAML with their groups and role; SCIM creates, changes and
      deactivates them, and a person who leaves is disabled with their keys
      stopped at once.
    frameworks:
      iso27001: [A.5.16, A.5.18]
      soc2: [CC6.2, CC6.3]
      hipaa: [164.308(a)(3)(ii)(C), 164.308(a)(4)(ii)(C)]
      gdpr: [Art.32]
      pcidss: [8.2]
      csaccm: [IAM, HRS]
      nistcsf: [PR.AA-01, PR.AA-05]
      nist80053: [AC-2, AC-2(1), PS-4, PS-5]
      nist800171: [03.01.01, 03.09.02]
    docs:
      - authentication.md#the-company-directory-ldap--active-directory
      - authentication.md#scim-provisioning
      - authentication.md#company-sign-in-by-saml-20
    tests:
      - Llm.Tests/ScimTests.Scim_needs_its_token_which_is_shown_once_stored_as_a_hash_and_replaced_at_once
      - Llm.Tests/ScimTests.A_person_deactivated_through_scim_is_disabled_here_and_their_keys_stop_at_once
      - Llm.Tests/SamlSignInTests.Saml_sign_in_creates_the_person_with_their_groups_their_role_and_a_key
      - Llm.Tests/CompanySignInTests.Company_sign_in_creates_the_person_with_their_groups_their_role_and_a_key
      - Llm.Tests/LdapTests.The_sync_disables_people_who_leave_and_restores_them_when_they_return
    operator: >-
      The joiner, mover and leaver process in the directory; local accounts
      kept to the few who need them.

  - id: IAM-05
    title: Least privilege, by roles and rules
    meets: >-
      What a person may do comes from roles (built in, or made by the company)
      held directly, through a group or by everyone, and from rules that give
      or take a feature; admin roles can be scoped to some groups. The checker
      says why a person may or may not do something. The wiki finds and shows
      each person only the documents they may read.
    frameworks:
      iso27001: [A.5.15, A.5.18, A.8.2, A.8.3]
      soc2: [CC6.1, CC6.3]
      hipaa: [164.308(a)(4)(ii)(B), 164.312(a)(1)]
      gdpr: [Art.25, Art.32]
      pcidss: [7.2, 7.3]
      csaccm: [IAM]
      nistcsf: [PR.AA-05]
      nist80053: [AC-3, AC-5, AC-6]
      nist800171: [03.01.02, 03.01.04, 03.01.05]
      commoncriteria: [FDP_ACC, FDP_ACF, FMT_SMR]
    docs: [admin.md#access-roles-and-rules]
    tests:
      - Llm.Tests/EndpointAccessTests.A_role_reaches_the_reads_of_its_permissions_and_no_others
      - Llm.Tests/EndpointAccessTests.Each_built_in_role_holds_exactly_its_permissions
      - Llm.Tests/AccessEndpointsTests.A_rule_takes_a_feature_from_a_group_and_the_checker_says_why
      - Llm.Tests/WikiTests.People_find_and_read_the_documents_they_may_read_and_nothing_else
    operator: Decide who holds which role, and review it.

  - id: IAM-06
    title: API keys are personal, revocable and checked
    meets: >-
      Each key belongs to one person and works only as them; an unknown,
      blocked or expired key is refused; rotating a key revokes the old one
      first, and disabling a person stops their keys.
    frameworks:
      iso27001: [A.5.17, A.8.5]
      soc2: [CC6.1]
      hipaa: [164.312(d)]
      gdpr: [Art.32]
      pcidss: [8.6]
      csaccm: [IAM]
      nistcsf: [PR.AA-01]
      nist80053: [AC-2, IA-5]
      nist800171: [03.05.12]
      commoncriteria: [FIA_UAU]
    docs: [authentication.md#as-a-machine-client-of-the-engine-api]
    tests:
      - Llm.Tests/KeyCheckTests.An_unknown_blocked_or_expired_key_is_refused
      - Llm.Tests/IdentityTests.Rotating_a_key_revokes_the_old_one_first
    operator: People keep their keys out of shared files and repositories.

  - id: IAM-07
    title: Privileged access is reviewed
    meets: >-
      An access review lists every privileged role given to a person, a group
      or everyone, each member of a group that holds one, and the accounts
      nobody signed in to for long, for a reviewer to keep or revoke; revoking
      takes effect at once and is audited, and a closed review is kept for
      good. One starts by itself every quarter and the admins are told;
      accounts unused for long are disabled when the company says so.
    frameworks:
      iso27001: [A.5.18, A.8.2]
      soc2: [CC6.2, CC6.3]
      hipaa: [164.308(a)(3)(ii)(B), 164.308(a)(4)(ii)(C)]
      gdpr: [Art.32(1)(d)]
      pcidss: [7.2]
      csaccm: [IAM]
      nistcsf: [PR.AA-05]
      nist80053: [AC-2, AC-6(7)]
      nist800171: [03.01.01]
    docs: [compliance/README.md#access-reviews]
    tests:
      - Llm.Tests/AccessReviewTests.A_review_lists_privileged_roles_their_groups_members_and_unused_accounts_and_revoking_takes_effect_at_once
      - Llm.Tests/AccessReviewTests.The_schedule_starts_a_review_when_one_is_due_tells_the_admins_and_disables_unused_accounts_when_asked
    checks: [app:access-review]
    operator: >-
      Name the reviewers (the Compliance officer role), finish each review by
      its due date, and review the directory's and SCIM's groups at their
      source as the review says.

  - id: LOG-01
    title: Who did what is recorded
    meets: >-
      The audit log keeps every sign-in, every change to people, groups,
      roles, settings and the index, every export and every tool an agent
      calls as a person, with who, whom, when and from where; never content.
      Reads of another person's data are audited as changes are: an admin's
      export of them, and their shared chat opened by someone else.
    frameworks:
      iso27001: [A.8.15]
      soc2: [CC7.2]
      hipaa: [164.308(a)(1)(ii)(D), 164.312(b)]
      gdpr: [Art.5(2), Art.30]
      iso42001: [A.6.2.8]
      pcidss: [10.2]
      csaccm: [LOG]
      nistcsf: [PR.PS-04, DE.CM-03]
      nist80053: [AU-2, AU-3, AU-12]
      nist800171: [03.03.01, 03.03.02]
      euaiact: [Art.12]
      commoncriteria: [FAU_GEN]
    docs: [admin.md#admin, settings.md#every-change-is-audited]
    tests:
      - Llm.Tests/IdentityTests.Everything_is_in_the_audit_log
      - Llm.Tests/ArenaMcpTests.An_agent_signs_in_with_the_persons_key_gets_their_chat_tools_and_each_call_is_audited
      - Llm.Tests/ArenaMcpTests.At_its_code_address_an_agent_gets_search_tools_and_run_code_whose_program_calls_the_tools_as_the_person
      - Llm.Tests/ShareTests.A_shared_chat_opens_for_a_colleague_and_not_for_someone_outside_the_group_and_revoking_stops_it
    checks: [app:audit-log]
    operator: Someone reviews the audit log on a schedule.

  - id: LOG-02
    title: Logs are kept, and kept for a set time
    meets: >-
      Every service's logs go to Loki, searchable by container, level and
      text; how long Loki keeps them is read from its configuration and shown.
    frameworks:
      iso27001: [A.8.15]
      soc2: [CC7.2]
      hipaa: [164.312(b)]
      gdpr: [Art.5(1)(e)]
      iso42001: [A.6.2.8]
      pcidss: [10.5]
      csaccm: [LOG]
      nistcsf: [PR.PS-04]
      nist80053: [AU-11]
      commoncriteria: [FAU_STG]
    docs: [admin.md#storage]
    tests:
      - Llm.Tests/StorageTests.Lokis_retention_is_read_from_its_configuration
      - Llm.Tests/RecordRetentionTests.Loki_is_set_to_keep_logs_for_ninety_days_in_compose_and_in_the_chart
    checks: [app:log-retention]
    operator: Decide how long logs are kept.

  - id: LOG-03
    title: Nobody changes the audit log unseen
    meets: >-
      Each entry is sealed onto the one before it with SHA-256, under one lock
      for every writer, so an entry changed, removed or slipped in breaks the
      chain from there; every day the whole chain is walked and its newest
      entry anchored in a volume of its own and the log, which shows an end
      rewritten. A break tells every admin, is in the audit log, and turns the
      check red; the evidence carries the chain's walk and its anchors.
    frameworks:
      iso27001: [A.5.28, A.5.33, A.8.15]
      soc2: [CC7.2, CC7.3]
      hipaa: [164.312(b), 164.312(c)(1), 164.312(c)(2)]
      gdpr: [Art.5(1)(f), Art.5(2), Art.32(1)(b)]
      pcidss: [10.3]
      csaccm: [LOG]
      nistcsf: [PR.PS-04]
      nist80053: [AU-9, AU-9(3)]
      nist800171: [03.03.08]
      commoncriteria: [FAU_STG]
    docs: [compliance/README.md#the-audit-log-as-a-chain]
    tests:
      - Llm.Tests/AuditChainTests.An_entry_changed_removed_or_slipped_in_breaks_the_chain_there_and_every_admin_is_told
      - Llm.Tests/AuditChainTests.An_anchor_kept_apart_shows_the_end_of_the_chain_rewritten_and_entries_from_before_the_chain_are_sealed
      - Llm.Tests/AuditChainTests.Many_writers_at_once_still_make_one_chain
    checks: [app:audit-chain]
    operator: >-
      Keep the audit volume's folder (DATA_DIR/audit) where the database's
      administrators cannot write, and back it up apart; restrict direct
      database access and keep its own logs.

  - id: LOG-04
    title: The audit log is sent on to the company's SIEM
    meets: >-
      Every entry, as it is written, in order and each once, by syslog (RFC
      5424 over UDP, TCP or TLS) and to a webhook signed with HMAC-SHA256,
      with its hash so the SIEM can walk the chain too. How far it got is kept
      in the database, so a restart or another replica goes on from there; a
      collector that does not answer is tried again and nothing is skipped.
    frameworks:
      iso27001: [A.8.15, A.8.16]
      soc2: [CC7.2]
      hipaa: [164.308(a)(1)(ii)(D), 164.312(b)]
      gdpr: [Art.32(1)(b)]
      pcidss: [10.4]
      csaccm: [LOG]
      nistcsf: [DE.AE-03]
      nist80053: [AU-6, AU-9(2)]
      nist800171: [03.03.05]
      commoncriteria: [FAU_SAR]
    docs: [compliance/README.md#sending-it-to-the-siem]
    tests:
      - Llm.Tests/AuditForwardTests.Each_entry_is_posted_once_in_order_signed_and_a_webhook_that_fails_gets_them_all_later
      - Llm.Tests/AuditForwardTests.Syslog_gets_each_entry_octet_counted_as_RFC_5424_with_failures_as_warnings
    checks: [app:audit-forwarding]
    operator: >-
      Run the SIEM, keep what it receives for as long as the frameworks ask
      (six years under HIPAA), and watch its alerts.

  - id: MON-01
    title: The service is watched and people are alerted
    meets: >-
      Prometheus and Alertmanager watch the stack; an alert that starts firing
      reaches every admin's bell, email and the alerts webhook once; the
      certificate warns 30 days before it expires and is critical 7 days before.
    frameworks:
      iso27001: [A.8.16]
      soc2: [CC7.2, CC7.3]
      hipaa: [164.308(a)(1)(ii)(D), 164.308(a)(6)(ii)]
      gdpr: [Art.32(1)(b)]
      pcidss: [10.7]
      csaccm: [LOG]
      nistcsf: [DE.CM-01, DE.CM-09]
      nist80053: [CA-7, SI-4]
      nist800171: [03.14.06]
    docs: [admin.md#admin]
    tests:
      - Llm.Tests/ObserveTests.Alerts_show_what_fires_and_every_rule_and_survive_either_source_down
      - Llm.Tests/NotificationsTests.A_system_alert_that_starts_firing_reaches_every_admin_once
      - Llm.Tests/OperationsTests.The_certificate_alerts_warn_thirty_days_before_and_are_critical_seven_days_before
    checks: [app:certificate]
    operator: Someone takes the alerts, around the clock where the company needs it.

  - id: MON-02
    title: Security events raise alerts, and incidents are handled in time
    meets: >-
      Many failed sign-ins, an administrative role given, many exports by one
      person, a failed or late backup raise a security alert once, to every
      admin; the incident register takes an incident from an alert or by hand,
      runs the GDPR's 72 hours and HIPAA's 60 days from when it was found,
      keeps every step with who and when, and is closed only with what was
      learned (and, with personal data, the authority question answered).
    frameworks:
      iso27001: [A.5.24, A.5.25, A.5.26, A.5.27, A.8.16]
      soc2: [CC7.3, CC7.4, CC7.5]
      hipaa: [164.308(a)(6)(ii), 164.404, 164.408]
      gdpr: [Art.33, Art.34]
      iso42001: [A.8.4]
      iso22301: [8.4.3]
      pcidss: [10.4, 12.10]
      csaccm: [SEF]
      nistcsf: [DE.AE-02, RS.MA-01, RS.CO-02]
      nist80053: [IR-4, IR-5, IR-6, IR-8, SI-4]
      nist800171: [03.06.01, 03.06.02]
      airmf: [MANAGE 4.3]
      euaiact: [Art.73]
    docs: [compliance/README.md#security-alerts-and-incidents]
    tests:
      - Llm.Tests/IncidentTests.Failed_sign_ins_an_admin_made_many_exports_and_a_failed_backup_each_raise_one_alert_to_every_admin
      - Llm.Tests/IncidentTests.An_incident_runs_from_its_alert_to_closure_with_the_GDPRs_72_hours_and_HIPAAs_60_days
    checks: [app:incidents]
    operator: >-
      Name who answers the alerts and runs incidents, know which supervisory
      authority to tell and how, and keep the incident-response runbook.

  - id: DAT-01
    title: Chats and files are deleted when their time is up
    meets: >-
      The company sets how long chats are kept, a group can set a shorter time,
      and every hour a job deletes chats past it with their files, and files
      nobody uses that are as old; each deletion is audited with counts.
    frameworks:
      iso27001: [A.5.33, A.8.10]
      soc2: [C1.2, P4.2, P4.3]
      gdpr: [Art.5(1)(e), Art.17]
      pcidss: [3.2]
      csaccm: [DSP]
      nist80053: [SI-12]
    docs: [admin.md#retention-legal-hold-and-exports]
    tests:
      - Llm.Tests/RetentionTests.A_chat_past_its_groups_retention_is_deleted_with_its_files_and_one_under_legal_hold_is_not
    checks: [app:chat-retention]
    operator: Decide the periods, and write them in the retention policy.

  - id: DAT-02
    title: Legal hold
    meets: >-
      A person on legal hold keeps everything: retention passes them by, and a
      chat they delete is hidden from them, not erased, until the hold ends.
    frameworks:
      iso27001: [A.5.28, A.5.33]
      gdpr: [Art.17(3)(e)]
      csaccm: [DSP]
      nist80053: [SI-12]
    docs: [admin.md#retention-legal-hold-and-exports]
    tests:
      - Llm.Tests/RetentionTests.A_person_on_legal_hold_who_deletes_a_chat_only_hides_it_until_the_hold_ends
    operator: Legal decides holds and when they end.

  - id: DAT-03
    title: A person's data, exported
    meets: >-
      People download everything of theirs from Your account; an admin exports
      a person's data for eDiscovery, audited: their profile, chats as JSON and
      Markdown, and files.
    frameworks:
      iso27001: [A.5.34]
      soc2: [P5.1]
      hipaa: [164.524]
      gdpr: [Art.15, Art.20]
      csaccm: [DSP, IPY]
    docs: [admin.md#retention-legal-hold-and-exports]
    tests:
      - Llm.Tests/RetentionTests.A_persons_export_holds_their_profile_chats_as_json_and_markdown_and_their_files
    operator: Answer a person's request within the time the law gives (a month under the GDPR).

  - id: DAT-04
    title: Personal data and secrets kept from the model
    meets: >-
      Safeguards mask personal data before a question reaches the model while
      the chat keeps it as written; answers are masked or withheld by rule;
      what tools send and bring back is held by their rules; a pasted secret
      or private key is refused and audited by its kind only; words and prompt
      injection are read through their disguises and in eleven languages,
      commands that do damage are kept from agents' tools, and data sent out
      through images and links is stopped.
    frameworks:
      iso27001: [A.8.11, A.8.12]
      soc2: [C1.1, CC6.7]
      hipaa: [164.502(b)]
      gdpr: [Art.25, Art.32(1)(a)]
      pcidss: [3.2]
      csaccm: [DSP]
      nistcsf: [PR.DS-01, PR.DS-02]
      nist80053: [AC-4, SI-15]
      nist800171: [03.01.03]
      commoncriteria: [FDP_IFC, FDP_IFF]
    docs: [admin.md#safeguards, chat.md#safeguards]
    tests:
      - Llm.Tests/SafeguardsTests.Personal_data_reaches_the_model_masked_and_the_chat_keeps_it_as_written
      - Llm.Tests/SafeguardRulesTests.Answers_are_masked_or_withheld_and_what_tools_send_and_bring_back_is_held_by_their_rules
      - Llm.Tests/SafeguardDetectorTests.A_word_is_found_through_its_disguises_and_masks_what_was_written
      - Llm.Tests/SafeguardDetectorTests.Injection_and_jailbreaks_are_found_in_any_language_and_disguise
      - Llm.Tests/SafeguardDetectorTests.Commands_that_do_damage_are_found
      - Llm.Tests/SafeguardDetectorTests.Data_sent_out_through_an_image_or_a_link_is_found_but_not_to_the_companys_own_site
      - Llm.Tests/SecretScanningTests.A_pasted_private_key_is_refused_in_the_chat_and_through_the_API_and_audited_by_its_kind_only
    operator: Decide which data may reach which model, and which models are outside the company.

  - id: DAT-05
    title: Secrets and people's files are encrypted at rest
    meets: >-
      The signing keys, settings' secrets (directory, SSO, connectors) and
      tokens are stored encrypted with APP_KEY; a changed key fails loudly
      instead of resetting keys; secrets are never sent back to a browser.
      People's files (their bytes, a video's sound, a document's drawn pages)
      and deck templates are sealed with AES-256-GCM under a key from APP_KEY
      before they reach the database, and a job seals those stored before.
      The disk under the stack's data is checked for encryption from the host.
    frameworks:
      iso27001: [A.8.24]
      soc2: [CC6.1]
      hipaa: [164.312(a)(2)(iv)]
      gdpr: [Art.32(1)(a)]
      pcidss: [3.5, 3.6]
      csaccm: [CEK]
      nistcsf: [PR.DS-01]
      nist80053: [SC-12, SC-28, SC-28(1)]
      nist800171: [03.13.08, 03.13.10]
      commoncriteria: [FCS_CKM, FCS_COP, FDP_SDC]
    docs: [authentication.md#what-protects-the-sign-in]
    tests:
      - Llm.Tests/KeyRingTests.With_a_data_key_the_key_ring_is_encrypted_and_survives_a_restart
      - Llm.Tests/KeyRingTests.A_changed_data_key_fails_loudly_instead_of_silently_resetting_keys
      - Llm.Tests/SettingsTests.A_secret_is_stored_encrypted_used_in_plain_and_never_sent_back
      - Llm.Tests/KnowledgeConnectorTests.Test_connection_says_what_it_reached_and_secrets_are_stored_encrypted_and_never_sent_back
      - Llm.Tests/FileSealingTests.A_file_is_stored_encrypted_read_as_it_was_and_those_stored_before_are_sealed_by_the_job
      - Llm.Tests/FileSealingTests.Without_APP_KEY_files_are_stored_as_they_are_and_the_check_says_so
    checks: [app:data-key, app:files-sealed, live:disk]
    operator: Keep APP_KEY with the company's secrets, apart from the backups; encrypt the hosts' disks.

  - id: DAT-06
    title: People's requests about their data are answered
    meets: >-
      A person asks from Your account (or an admin takes the request in for
      them) for a copy, their data to take elsewhere, a correction,
      restriction, objection or erasure; each has its month, the admins hear
      of it, and every step is audited. Restriction and objection stop
      everything that learns from their data; erasure removes everything of
      theirs, takes them out of what others keep, refuses while a legal hold
      lasts, and gives a certificate of what is kept and why and when backups
      let go of the rest.
    frameworks:
      iso27001: [A.5.34]
      soc2: [P5.1, P5.2, P4.3]
      hipaa: [164.524, 164.526]
      gdpr: [Art.12(3), Art.15, Art.16, Art.17, Art.18, Art.20, Art.21]
      csaccm: [DSP]
    docs: [compliance/README.md#peoples-data-requests]
    tests:
      - Llm.Tests/DataRequestTests.A_person_asks_the_admins_hear_it_is_due_in_a_month_and_answering_tells_them
      - Llm.Tests/DataRequestTests.Restriction_stops_everything_that_learns_from_their_data_until_it_is_lifted
      - Llm.Tests/DataRequestTests.Erasure_removes_everything_of_theirs_takes_them_out_of_what_others_keep_and_certifies_what_is_kept
    checks: [app:data-requests]
    operator: >-
      Name who answers them (a data protection officer, with the privacy.manage
      permission), verify who is asking, and tell people where to complain.

  - id: DAT-07
    title: Records are kept for set times, and no longer
    meets: >-
      The audit log six years unless set (only ever from the start of its
      chain), the gateway's request log, the record of tool calls, the bell
      and the prompt log of API requests each for a period set under
      Settings → Data retention, removed by
      the hourly sweep and audited with counts; the services' logs 90 days
      (Loki's compactor) and metrics 30 days (Prometheus). Admin → Compliance
      lists how long each kind of data and record is kept, and what removes it.
    frameworks:
      iso27001: [A.5.33, A.8.10, A.8.15]
      soc2: [C1.2, P4.2, P4.3]
      hipaa: [164.316(b)(2)(i)]
      gdpr: [Art.5(1)(e)]
      pcidss: [3.2, 10.5]
      csaccm: [DSP]
      nist80053: [AU-11, SI-12]
    docs: [compliance/README.md#how-long-things-are-kept]
    tests:
      - Llm.Tests/RecordRetentionTests.Records_past_their_time_go_the_audit_log_only_from_the_start_of_its_chain_and_the_check_says_how_long_each_is_kept
    checks: [app:records-retention, app:log-retention]
    operator: Decide the periods, write them in the retention policy, and keep backups as long as it says.

  - id: DAT-08
    title: Personal and health data kept in bounds
    meets: >-
      The safeguards find e-mail addresses, phone, card, IBAN and social
      security numbers, and health and identity data: dates of birth and
      medical record numbers by the words that name them, NHS numbers and
      Iranian national codes with their check digits right, and US Medicare
      numbers by their shape; a rule warns, masks or blocks them before a
      question reaches a model, stricter for models on other providers (the
      template "Health and identity data to cloud models" blocks them there).
      The app's log lines carry no personal data: it is masked before a line
      is written (IP addresses stay, as security needs them); answers' traces
      hold times, tokens and tool names only, and the gateway's request log no
      prompts. The one record of what people ask is the prompt log: only those
      with prompts.review (no built-in role but the admins') read it, each
      search is audited, people are told on their account page, it is kept for
      a set time, and it can be turned off for API requests.
    frameworks:
      iso27001: [A.5.34, A.8.11, A.8.12]
      soc2: [C1.1, CC6.7, P4.1]
      hipaa: [164.502(b), 164.514(b)]
      gdpr: [Art.5(1)(c), Art.9, Art.25, Art.32(1)(a)]
      pcidss: [3.2, 3.3]
      csaccm: [DSP]
      nistcsf: [PR.DS-01]
      nist80053: [PT-2, PT-3]
      airmf: [MEASURE 2.10]
    docs: [compliance/README.md#personal-and-health-data]
    tests:
      - Llm.Tests/PersonalDataTests.Health_and_identity_data_are_found_by_what_names_them_and_their_check_digits
      - Llm.Tests/PersonalDataTests.A_wrong_check_digit_or_a_number_nothing_names_is_not_taken_for_one
      - Llm.Tests/PersonalDataTests.The_apps_log_lines_carry_no_personal_data_but_keep_the_addresses_security_needs
      - Llm.Tests/PersonalDataTests.The_compliance_check_wants_a_rule_keeping_health_data_from_cloud_models_and_the_templates_give_one
      - Llm.Tests/PromptLogTests.The_chats_and_the_API_requests_questions_and_answers_are_read_with_prompts_review_and_each_search_is_audited
      - Llm.Tests/PromptLogTests.An_answer_from_the_answer_cache_is_in_the_prompt_log_as_well
      - Llm.Tests/PromptLogTests.With_the_prompt_log_off_API_requests_are_not_kept
      - Llm.Tests/PromptLogTests.Every_API_request_is_in_the_log_from_its_arrival_while_it_runs_and_when_it_fails_is_refused_or_is_stopped
      - Llm.Tests/PromptLogTests.A_chat_question_is_in_the_log_with_its_answers_state_and_why_it_failed
    checks: [app:personal-data]
    operator: >-
      Decide which models may see which data (a HIPAA BAA, a GDPR processing
      agreement with any provider outside the company), add the templates, and
      add the company's own identifiers as words or patterns.

  - id: NET-01
    title: Encrypted in transit, one way in
    meets: >-
      Only Traefik's ports 80 and 443 are published, 80 only to redirect; TLS
      1.2 and 1.3 only, and for 1.2 only ciphers with forward secrecy and
      authenticated encryption; HSTS for a year with a trusted certificate
      (HSTS_SECONDS); the services talk on Docker's network; every page carries
      a strict content security policy and the security headers; a state
      change needs a header another site cannot send; hosts without a rule are
      refused; the API host goes by the app alone, which passes on only the
      model API's own paths, so the model gateway's management and pages are
      not reachable from outside.
    frameworks:
      iso27001: [A.8.20, A.8.24, A.8.26]
      soc2: [CC6.6, CC6.7]
      hipaa: [164.312(e)(1), 164.312(e)(2)(ii)]
      gdpr: [Art.32(1)(a)]
      pcidss: [1.3, 1.4, 4.2]
      csaccm: [IVS, CEK]
      nistcsf: [PR.DS-02, PR.IR-01]
      nist80053: [SC-7, SC-8, SC-8(1), SC-13]
      nist800171: [03.13.01, 03.13.08]
      commoncriteria: [FTP_ITC, FTP_TRP, FCS_COP]
    docs:
      - authentication.md#what-is-deliberately-not-behind-sign-in
      - deployment.md#certificates
    tests:
      - Llm.Tests/FoundationTests.Security_headers_are_set
      - Llm.Tests/IdentityTests.State_changes_without_the_csrf_header_are_refused
      - Llm.Tests/ForwardAuthTests.Hosts_without_a_rule_are_denied_even_to_admins
      - Llm.Tests/FileSealingTests.With_HSTS_set_the_app_sends_it_as_Traefik_does_and_without_it_clears_any_kept_before
      - Llm.Tests/ApiPassageTests.The_model_list_and_embeddings_are_passed_on_with_the_callers_own_key
      - Llm.Tests/ApiPassageTests.The_gateways_own_management_is_not_found_from_outside
    checks: [live:tls, live:headers, live:csrf]
    operator: A certificate from the company's CA or Let's Encrypt; the network around the hosts.

  - id: OPS-01
    title: Backups, restored and proven
    meets: >-
      scripts/backup.sh backs up the databases, the settings and the files,
      with a second copy elsewhere, each file encrypted (AES-256, PBKDF2) with
      a key kept apart from the backups (BACKUP_KEY_FILE), refused inside them;
      point-in-time recovery archives the WAL;
      the drill restores into a throwaway stack, never the live one, and
      checks that every person, chat and setting came back.
    frameworks:
      iso27001: [A.5.30, A.8.13]
      soc2: [A1.2, A1.3, CC9.1]
      hipaa: [164.308(a)(7)(ii)(A), 164.308(a)(7)(ii)(B), 164.308(a)(7)(ii)(D)]
      gdpr: [Art.32(1)(c), Art.32(1)(d)]
      iso22301: [8.4.5, 8.5, 8.6]
      csaccm: [BCR]
      nistcsf: [PR.DS-11, RC.RP-03]
      nist80053: [CP-4, CP-9, CP-10]
      nist800171: [03.08.09]
      commoncriteria: [FPT_RCV]
    docs:
      - deployment.md#backups-and-restore
      - deployment.md#point-in-time-recovery-pitr
    tests:
      - deploy/test_backup.py::test_By_default_it_keeps_BACKUP_KEEP_here_and_in_the_second_copy
      - deploy/test_backup.py::test_Every_file_is_encrypted_the_MANIFEST_names_the_key_without_it_and_it_opens_only_with_that_key
      - deploy/test_backup.py::test_A_key_inside_deploy_or_the_backups_is_refused_before_anything_is_taken
      - deploy/test_pitr.py::test_pitr_yml_archives_wal_to_the_backup_disk
      - deploy/test_pitr.py::test_the_drill_restores_into_a_scratch_container_never_the_stacks
      - deploy/test_recovery.py::test_The_live_project_is_refused_before_anything_runs
      - deploy/test_recovery_check.py::test_A_person_lost_in_the_restore_fails_it
    checks: [app:backups]
    operator: >-
      Schedule the backups, keep the second copy off the host, keep the
      backups' key (BACKUP_KEY_FILE) apart from them with a copy in the
      company's vault, run the drill on a schedule, and encrypt pgBackRest's
      repository (its repo1-cipher-type and repo1-cipher-pass) when using it.

  - id: OPS-02
    title: Code the model writes runs apart
    meets: >-
      Python, documents and a plugin's own server run in the sandbox: no
      network, a read-only root, its own limits, nothing that outlives a run.
    frameworks:
      iso27001: [A.8.22, A.8.7]
      soc2: [CC6.8]
      hipaa: [164.308(a)(5)(ii)(B)]
      gdpr: [Art.32(1)(b)]
      csaccm: [IVS, AIS]
      nistcsf: [PR.PS-05]
      nist80053: [SC-39, SC-44]
      airmf: [MEASURE 2.7]
      euaiact: [Art.15]
    docs: [plugins.md#a-server-of-its-own-in-the-sandbox]
    tests:
      - Llm.Tests/ChatToolsTests.Python_runs_in_the_sandbox_with_the_chats_files_and_what_it_writes_comes_back
      - Llm.Tests/ChatToolsTests.A_program_calls_the_chats_tools_as_the_person_through_the_sandbox_and_only_what_it_prints_comes_back
      - Llm.Tests/PluginTests.A_plugins_own_server_runs_in_the_sandbox_with_its_settings_one_job_a_call
    operator: Keep the sandbox's host patched.

  - id: GOV-01
    title: The controls are kept from breaking
    meets: >-
      This file names, for each control, the tests and live checks that prove
      it; the guard test fails when one of them is gone, and the release
      checklist requires the live checks to pass.
    frameworks:
      iso27001: [A.5.36, A.8.29, A.8.32, 9.1, 7.5.3]
      soc2: [CC4.1, CC8.1]
      hipaa: [164.308(a)(8)]
      gdpr: [Art.5(2), Art.25]
      iso42001: [9.1, A.6.2.4]
      pcidss: [12.4]
      csaccm: [A&A]
      nistcsf: [GV.OV-03, ID.IM-01]
      nist80053: [CA-2, CA-7, SA-11]
      nist800171: [03.12.01, 03.12.03]
      commoncriteria: [ATE_FUN, ALC_CMC]
    docs:
      - compliance/README.md#controls-and-how-they-are-kept
      - compliance/README.md#the-documents
      - compliance/README.md#when-a-change-weakens-a-control
      - compliance/README.md#the-compliance-center
      - development.md#releasing
    tests:
      - Llm.Tests/ComplianceControlsTests.Every_control_names_tests_documents_and_checks_that_exist
      - Llm.Tests/ComplianceControlsTests.Every_test_that_proves_a_control_is_named_by_it
      - Llm.Tests/ComplianceControlsTests.The_app_runs_its_checks_and_admins_see_them_with_the_controls
      - Llm.Tests/ComplianceControlsTests.The_companys_part_is_attested_and_audited_and_the_evidence_holds_everything_an_auditor_asks_for
      - deploy/test_compliance_check.py::test_A_failed_check_fails_the_run_and_warnings_only_with_strict
      - deploy/test_compliance_docs.py::test_The_written_documents_are_current
      - deploy/test_compliance_docs.py::test_Every_clause_a_control_cites_is_listed_and_every_document_is_there
      - deploy/test_compliance_docs.py::test_The_next_releases_entry_names_each_under_Weakened_controls_or_it_fails
      - deploy/test_compliance_docs.py::test_Nothing_is_weaker_than_in_the_newest_release_unless_the_changelog_says_so
    operator: The release manager runs the checklist; an auditor samples it.

  - id: GOV-02
    title: Everyone accepts the acceptable use and privacy notice
    meets: >-
      The notice the company sets (acceptable use, the privacy notice) is on
      the sign-in page for anyone to read; each person accepts its current
      version before anything else, whichever way they signed in, and again
      when a new version is set; each acceptance is kept with its version,
      time and address, audited, and in the evidence.
    frameworks:
      iso27001: [A.5.10, A.6.3, 7.3]
      soc2: [CC2.3, P1.1]
      hipaa: [164.308(a)(5)(i)]
      gdpr: [Art.12, Art.13]
      iso42001: [7.3]
      pcidss: [12.2]
      csaccm: [HRS]
      nistcsf: [GV.PO-01, PR.AT-01]
      nist80053: [AC-8, PL-4, PT-5]
      nist800171: [03.15.03]
      commoncriteria: [FTA_TAB]
    docs: [compliance/README.md#the-sign-in-notice]
    tests:
      - Llm.Tests/NoticeTests.Everyone_accepts_the_current_version_before_anything_else_and_a_new_version_again
      - Llm.Tests/NoticeTests.Without_a_notice_nothing_waits_and_the_check_asks_for_one
    checks: [app:notice]
    operator: >-
      Write the notice and the policies it points to, keep them current, and
      set a new version when they change in substance.

  - id: GOV-03
    title: What a release ships is listed and its known vulnerabilities gate it
    meets: >-
      Each release has a software bill of materials (CycloneDX) of every .NET,
      npm and Python package and base image it ships, checked against OSV's
      advisories; a critical vulnerability fails the release unless it is
      accepted in writing, with why and until when, and an acceptance past its
      date counts no more.
    frameworks:
      iso27001: [A.5.21, A.8.8, A.8.28]
      soc2: [CC7.1, CC8.1, CC9.2]
      hipaa: [164.308(a)(1)(ii)(A), 164.308(a)(1)(ii)(B)]
      gdpr: [Art.32(1)(d)]
      pcidss: [6.3]
      csaccm: [TVM, STA]
      nistcsf: [ID.AM-02, ID.RA-01, GV.SC-07]
      nist80053: [CM-8, RA-5, SI-2, SR-4]
      nist800171: [03.11.02, 03.14.01]
      commoncriteria: [ALC_FLR, AVA_VAN]
    docs:
      - compliance/README.md#supply-chain
      - development.md#releasing
    tests:
      - deploy/test_release_scan.py::test_What_ships_is_listed_and_the_build_tools_are_not
      - deploy/test_release_scan.py::test_A_critical_finding_fails_the_release_and_is_in_the_SBOM
      - deploy/test_release_scan.py::test_Accepted_with_a_date_not_past_it_ships_and_high_ones_never_stop_it
      - deploy/test_release_scan.py::test_OSV_out_of_reach_fails_it_too
    operator: >-
      The release manager runs the scan and attaches the SBOM to the release;
      the security officer reviews each acceptance before its date and the
      high findings each release.

  - id: GOV-04
    title: Risks are assessed, treated and reviewed
    meets: >-
      A register of the risks to the company's information and its AI (Admin
      → Compliance → Risks): each with the assets it threatens (from what
      Arena knows: its stores, models, knowledge, data sources and tools), its
      likelihood and impact before and after treatment on a 5 by 5 scale, an
      owner, a treatment (reduced with named controls, accepted by a person
      with why and until when, a year at most, transferred, avoided), the
      treatment's actions with their dates, and a review date its level sets
      (three months for critical, six for high, a year otherwise). Every
      change is in the risk's history and the audit log, and the register is
      in the evidence.
    frameworks:
      iso27001: [6.1.1, 6.1.2, 6.1.3, 8.2, 8.3, A.5.7]
      soc2: [CC3.1, CC3.2, CC3.3, CC3.4, CC9.1]
      hipaa: [164.308(a)(1)(ii)(A), 164.308(a)(1)(ii)(B)]
      gdpr: [Art.32(1), Art.32(2)]
      iso42001: [6.1.1, 6.1.2, 6.1.3, 8.2, 8.3]
      iso22301: [6.1, 8.2.3]
      pcidss: [12.3]
      csaccm: [GRC]
      nistcsf: [GV.RM, ID.RA, ID.RA-05, ID.RA-06]
      nist80053: [RA-3, RA-7, PM-9, CA-5]
      nist800171: [03.11.01]
      airmf: [MAP 4.1, MANAGE 1.2, MANAGE 1.3, MANAGE 1.4]
      euaiact: [Art.9]
    docs: [compliance/README.md#risks, compliance/policies/risk-management.md#the-risk-register]
    tests:
      - Llm.Tests/RiskRegisterTests.A_risk_has_its_levels_before_and_after_treatment_its_controls_and_a_review_its_level_sets
      - Llm.Tests/RiskRegisterTests.An_acceptance_names_who_why_and_until_when_and_a_treatment_has_its_actions_and_history
      - Llm.Tests/RiskRegisterTests.Only_those_who_manage_compliance_change_the_register_and_an_auditor_reads_it
    checks: [app:risks]
    operator: >-
      Assess the risks at least once a year and after significant changes,
      with the owners who know them; management accepts the risks left, and
      the treatment's actions are done by their dates.

  - id: GOV-05
    title: The Statement of Applicability is kept and approved
    meets: >-
      For each of ISO 27001's and ISO 42001's Annex A controls (Admin →
      Compliance → Statement of Applicability): whether it applies, and why
      when it does not; how far it is in place; Arena's controls that serve it
      and the open risks they treat. Approved as a whole by a person, once
      every control is decided; each approval is a version kept as it stood,
      and each line's change is audited. The statement as it stands, every
      version and the approvals are downloads and in the evidence.
    frameworks:
      iso27001: [6.1.3, 7.5.3]
      iso42001: [6.1.3, 7.5.3]
      csaccm: [GRC]
      nist80053: [PL-2]
      nist800171: [03.15.02]
    docs: [compliance/README.md#statement-of-applicability]
    tests:
      - Llm.Tests/SoaTests.Each_Annex_A_control_says_whether_it_applies_and_why_how_far_and_what_serves_it
      - Llm.Tests/SoaTests.It_is_approved_once_every_control_is_decided_each_approval_a_version_kept_as_it_stood
    checks: [app:soa]
    operator: >-
      Decide each control with the risk owners, approve the statement (the
      information security officer, or management), and approve it again
      after the risk assessment each year and when the scope changes.

  - id: GOV-06
    title: Policies are owned, approved, reviewed and read
    meets: >-
      The company's policies (Admin → Compliance → Policies), adopted from the
      templates in docs/compliance or written there: each with an owner, the
      people who must read it (everyone, the admins, or groups), and versions.
      A draft is in force once a person approves it (a later version says
      what changed); its review is due after the period the policy sets; and
      each reader acknowledges the version in force under Your account, told
      of it in their bell. Every step is audited; every version, its approval
      and review, the acknowledgements and the texts in force are in the
      evidence.
    frameworks:
      iso27001: [5.2, 7.3, 7.5.2, 7.5.3, A.5.1, A.6.3]
      iso42001: [5.2, 7.3, 7.5.2, 7.5.3, A.2.2, A.2.4]
      iso22301: [5.2, 7.5]
      soc2: [CC2.2, CC5.3]
      hipaa: [164.316(a), 164.316(b)(1), 164.316(b)(2)(iii)]
      pcidss: [12.1]
      csaccm: [GRC]
      nistcsf: [GV.PO-01, GV.PO-02]
      nist80053: [PL-1, PM-1]
      nist800171: [03.15.01]
      airmf: [GOVERN 1.2, GOVERN 1.4]
    docs: [compliance/README.md#policies]
    tests:
      - Llm.Tests/PolicyTests.A_policy_from_a_template_is_in_force_once_approved_and_each_reader_acknowledges_its_version
      - Llm.Tests/PolicyTests.A_new_version_says_what_changed_is_read_again_and_a_review_keeps_it_in_force
    checks: [app:policies]
    operator: >-
      Adopt the policies that apply, fill in their brackets, have them
      approved by management, review each on time, and follow up with
      those who have not read them.

  - id: GOV-07
    title: Audits, their findings and corrective actions are kept
    meets: >-
      The audit programme (Admin → Compliance → Audits): each audit, internal
      or an external body's (a certification's stages, surveillance,
      recertification, a SOC 2 period), with its scope, auditor, dates and
      conclusion. Each finding (a major or minor nonconformity, an
      observation, an opportunity) against a framework's clause and Arena's
      control, with its correction, root cause, corrective action, owner and
      date; a nonconformity's action is taken only once its root cause and
      action are said, and closed only when someone checks that it worked
      (else it opens again). The certificates and reports the company holds,
      with when they end; and waivers of a control not met for a time, by a
      person, with why, what makes up for it and until when (a year at most).
      Every step is audited and all of it is in the evidence.
    frameworks:
      iso27001: [9.2.1, 9.2.2, 10.1, 10.2, A.5.35, A.5.36]
      iso42001: [9.2.1, 9.2.2, 10.1, 10.2]
      iso22301: [9.2, 10.1, 10.2]
      soc2: [CC4.1, CC4.2, CC5.1]
      pcidss: [12.4]
      csaccm: [A&A]
      nistcsf: [ID.IM-01, ID.IM-02, GV.OV-01]
      nist80053: [CA-2, CA-5, CA-7]
      nist800171: [03.12.01, 03.12.02]
      airmf: [GOVERN 1.5]
    docs: [compliance/README.md#audits-findings-and-certificates]
    tests:
      - Llm.Tests/AuditTests.A_finding_is_acted_on_with_its_root_cause_and_closed_only_when_its_action_is_checked
      - Llm.Tests/AuditTests.The_check_wants_an_internal_audit_each_year_findings_in_time_certificates_current_and_waivers_decided
    checks: [app:audits]
    operator: >-
      Plan internal audits that cover every clause and control over the
      certification cycle, by people who do not audit their own work; act on
      the findings by their dates; renew the certificates before they end.

  - id: GOV-08
    title: Suppliers are registered, agreed with and reviewed
    meets: >-
      The supplier register (Admin → Compliance → Suppliers): each model
      provider, cloud, connector or other service, with what it provides, the
      kinds of data it receives (personal, health, confidential, code,
      payment), where, its certifications and reports, the agreements signed,
      its risk and a review its risk sets (six months high, a year medium, two
      years low). The services Arena connects to (cloud model servers, tool
      servers, knowledge connectors, the GitLab Argus reads, Hugging Face) are
      offered for the register until they are in it. Every change and review
      is audited, and the register is in the evidence.
    frameworks:
      iso27001: [A.5.19, A.5.20, A.5.21, A.5.22, A.5.23]
      iso42001: [A.10.2, A.10.3]
      soc2: [CC9.2]
      hipaa: [164.308(b)(1), 164.314(a)(1)]
      gdpr: [Art.28]
      pcidss: [12.8]
      csaccm: [STA]
      nistcsf: [GV.SC-04, GV.SC-07]
      nist80053: [SA-9, SR-6]
      nist800171: [03.17.01, 03.17.03]
      airmf: [GOVERN 6.1]
    docs: [compliance/README.md#suppliers]
    tests:
      - Llm.Tests/SupplierTests.What_Arena_connects_to_is_offered_until_registered_with_its_data_agreements_and_review
    checks: [app:suppliers]
    operator: >-
      Register each supplier with what it gets, sign a DPA (and a BAA for
      health data) where it processes personal data, keep its certificates'
      dates current, and review it on time.

  - id: GOV-09
    title: AI systems are registered, classified, assessed and overseen
    meets: >-
      The register of the company's AI systems (Admin → Compliance → AI
      systems): assistants, agents, apps and models, each with its purpose,
      intended use and whom it affects, its class under the EU AI Act
      (minimal, limited, high-risk with its Annex III area, or a prohibited
      practice) and the company's role (deployer, provider), its impact
      assessment in the assessor's name, its human oversight and its
      evaluation. A system is put into use only once its class, purpose and
      impact assessment are said, and for a high-risk one its area, oversight
      and evaluation; a prohibited practice is never in use. Reviewed each
      year (every six months when high-risk). The shared assistants, Agent
      Studio's workflows, the shared apps and the models are offered until
      registered. Audited, and in the evidence with each impact assessment.
    frameworks:
      iso42001: [6.1.4, 8.4, A.4.2, A.5.2, A.5.3, A.5.4, A.5.5, A.6.2.4, A.6.2.6, A.9.2, A.9.3, A.9.4]
      euaiact: [Art.5, Art.6, Art.14, Art.26, Art.27]
      airmf: [GOVERN 1.6, MAP 1.1, MAP 3.5, MAP 5.1, MEASURE 2.1]
      nist80053: [CM-8, PM-5]
    docs: [compliance/README.md#ai-systems]
    tests:
      - Llm.Tests/AiGovernanceTests.An_AI_system_is_put_into_use_only_once_its_class_impact_oversight_and_evaluation_are_said
    checks: [app:ai-systems]
    operator: >-
      Register each AI system before it goes into use, with its owner;
      classify it under the AI Act with your counsel; assess its impact with
      the people it affects in mind; give each high-risk system its human
      oversight and evaluation, and its fundamental rights assessment where
      Article 27 asks for one.

  - id: GOV-10
    title: People know when content is made by AI
    meets: >-
      Under the chat's box, people are told that answers are made by AI and
      can be wrong. A picture a model made (in the chat or the media studio)
      says so in its own metadata, as IPTC's digital source type
      trainedAlgorithmicMedia in XMP; a person's picture a model changed (an
      edit, a cutout) says compositeWithTrainedAlgorithmicMedia. Sound and
      video a model made (speech, voices, music, clips, stories) say so too,
      where XMP's spec puts it: an MP3's ID3v2 tag, an MP4's uuid box, a WAV's
      or an AVI's _PMX chunk; WebM, which has no place for XMP, in a Matroska
      tag. The chat's read-aloud, streamed as it plays, is not kept and not
      marked.
    frameworks:
      euaiact: [Art.50]
      iso42001: [A.8.2, A.8.5]
      airmf: [GOVERN 4.2, MANAGE 2.4]
    docs: [compliance/README.md#ai-systems]
    tests:
      - Llm.Tests/AiGovernanceTests.A_generated_picture_says_in_its_metadata_that_a_model_made_or_changed_it
      - Llm.Tests/AiGovernanceTests.Generated_sound_and_video_say_in_their_metadata_that_a_model_made_them
    operator: >-
      Tell people elsewhere too where your use of AI is not obvious (a
      published text, a voice on the phone), and keep the marks on what you
      publish.

  - id: GOV-11
    title: Readiness is measured and the evidence is kept over time
    meets: >-
      Each day once, every compliance check's result is kept (six years), so
      an audit over a period (SOC 2 Type II) reads it day by day. For each
      framework, Admin → Compliance says how ready the company is, from 0 to
      100: Arena's controls that serve it holding now, their operator's parts
      attested within the year, and the checks of the management system its
      audit reads; with each gap and where it is put right. Each framework's
      auditor package is one download: its clauses with Arena's controls,
      their state and attestations, the checks' history over the period
      asked, the records its audit reads, and the drafts its scheme asks for
      (a Common Criteria Security Target, the AI Act's Annex IV for each
      high-risk system, a CSF profile). Each download is audited.
    frameworks:
      iso27001: [9.1, 9.3.2]
      iso42001: [9.1, 9.3.2]
      iso22301: [9.1]
      soc2: [CC4.1, CC4.2]
      csaccm: [A&A]
      nistcsf: [GV.OV-03]
      nist80053: [CA-7, CA-2]
      nist800171: [03.12.03]
      euaiact: [Art.11, Annex IV]
      airmf: [MEASURE 1.1]
      commoncriteria: [ASE_TSS, ATE_FUN]
    docs: [compliance/README.md#readiness-and-the-auditors-package]
    tests:
      - Llm.Tests/ReadinessTests.Each_framework_says_how_ready_and_what_is_missing_and_its_package_holds_what_its_auditor_reads
      - Llm.Tests/ReadinessTests.The_checks_are_kept_once_a_day_and_the_package_reads_them_over_the_period
    operator: >-
      Read each framework's gaps before its audit, and hand the auditor its
      package for the period under audit.

  - id: GOV-12
    title: The management system is run, reviewed and measured
    meets: >-
      Admin → Compliance → Management: each of Arena's controls has its
      owner in the company; management reviews are recorded with who took
      part, the minutes and the decisions, beside their inputs as the clause
      names them, drawn up from the system as it stood (the actions from the
      review before, the findings, the audits, the objectives and readiness,
      the risks); the security objectives are each measured by a compliance
      check's daily history, as the share of days it held against its
      target; and an auditor, who may only read, asks for evidence there and
      is answered. Audited, and in the evidence.
    frameworks:
      iso27001: [5.3, 6.2, 9.3.1, 9.3.2, 9.3.3]
      iso42001: [5.3, 6.2, 9.3.1, 9.3.2, 9.3.3]
      iso22301: [5.3, 6.2, 9.3]
      soc2: [CC1.3, CC2.2]
      csaccm: [GRC]
      nistcsf: [GV.RR-01, GV.RR-02]
      nist80053: [PM-2, PM-6]
      airmf: [GOVERN 2.1]
    docs: [compliance/README.md#running-the-management-system]
    tests:
      - Llm.Tests/ManagementTests.A_review_keeps_its_inputs_as_the_system_stood_and_objectives_are_measured_by_their_checks
      - Llm.Tests/ManagementTests.An_auditor_reads_and_asks_for_evidence_and_changes_nothing_else
    checks: [app:management]
    operator: >-
      Name each control's owner, hold the management review at least once a
      year with the leadership, set objectives that matter, and answer the
      auditors' requests in time.

  - id: VUL-01
    title: Repositories are reviewed for vulnerabilities, fixed or accepted in time
    meets: >-
      Code Studio → Security reviews a repository at a commit, read with the
      person's own access: its packages matched against GitHub's reviewed
      advisories and CISA's known-exploited list (the advisories pack, renewed
      each day), and the places where outside data reaches a query, a
      command, a path, a fetch, a deserialiser or HTML, each kept only when
      its line is cited and its CWE is in the security pack, then put to a
      pass that tries to refute it. Each finding is fixed, accepted with why
      and until when, or marked wrong, audited; its bill of materials is
      kept. The vulnerabilities check wants a review within 30 days against
      advisories no older than a week, and each open finding fixed within its
      severity's time (critical 7 days, high 30, medium 90, low 180); an
      overdue critical or high one fails it.
    frameworks:
      iso27001: [A.8.8, A.8.28, A.8.29]
      soc2: [CC7.1, CC8.1]
      hipaa: [164.308(a)(1)(ii)(A), 164.308(a)(1)(ii)(B)]
      gdpr: [Art.32(1)(d)]
      pcidss: [6.2, 6.3, 11.3]
      csaccm: [TVM, AIS]
      nistcsf: [ID.RA-01, PR.PS-06]
      nist80053: [RA-5, SI-2, SA-11, SA-15]
      nist800171: [03.11.02, 03.14.01]
      euaiact: [Art.15]
      commoncriteria: [AVA_VAN, ALC_FLR]
    docs: [compliance/README.md#vulnerabilities]
    tests:
      - Llm.Tests/SecurityReviewTests.A_repository_is_reviewed_as_its_person_and_only_cited_weaknesses_the_pack_knows_are_kept
      - Llm.Tests/SecurityReviewTests.The_vulnerabilities_check_counts_what_is_past_its_time_to_fix
      - Llm.Tests/SecurityReviewTests.When_the_advisories_are_renewed_a_reviews_packages_are_checked_again_at_the_commit_it_read
      - Llm.Tests/FixTests.A_security_findings_fix_starts_from_the_branch_reviewed_with_the_weakness_its_references_and_a_test_first
      - Llm.Tests/SecurityReviewTests.Admin_security_shows_each_repositorys_latest_review_what_cannot_wait_this_week_and_the_risks_accepted
      - Llm.Tests/SecurityReviewTests.What_people_decided_is_remembered_for_the_repositorys_next_review_and_a_fixed_one_found_again_is_open
      - Llm.Tests/ReviewTests.A_merge_request_that_adds_a_vulnerable_package_or_a_scanners_finding_says_so
      - Llm.Tests/FixTests.A_security_fixs_change_is_checked_by_the_scanners_and_the_review_before_its_merge_request
      - Llm.Tests/CodeArenaSyncTests.Code_Arena_reads_the_latest_security_review_of_its_branch_with_what_Fix_it_would_ask
    checks: [app:vulnerabilities]
    operator: >-
      Load the advisories pack and renew it each day, review each repository
      at least monthly and before each release, and fix or accept what it
      finds within its time.
