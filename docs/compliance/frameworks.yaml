# Each framework's clauses, the company's document that governs each, and so the
# mapping from every clause to Arena's controls.
#
# tools/compliance-docs.py reads this with controls.yaml and writes
# docs/compliance/frameworks/<framework>.md and docs/compliance/controls.md;
# tests/deploy/test_compliance_docs.py fails when those are not current, when a
# control cites a clause that is not listed here, or when a document is missing.
#
# Each clause is [id, short title, document]. A control's clause counts for the
# entry it is, or the nearest one it is part of: 164.308(a)(5)(ii)(C) for
# itself, Art.32(1)(a) for Art.32. The titles are short names of the clauses,
# not their text; read the standard or the law itself.

documents:
  information-security: [policies/information-security.md, Information security policy]
  risk: [policies/risk-management.md, Risk management policy]
  access: [policies/access-control.md, Access control policy]
  use: [policies/acceptable-use.md, Acceptable use policy]
  people: [policies/people-security.md, People security policy]
  physical: [policies/physical-security.md, Physical security policy]
  continuity: [policies/business-continuity.md, Backup and business continuity policy]
  data: [policies/data-protection.md, Data protection and retention policy]
  suppliers: [policies/suppliers.md, Supplier and transfer policy]
  change: [policies/change-management.md, Change and vulnerability management policy]
  crypto: [policies/cryptography.md, Cryptography policy]
  incidents: [incident-response.md, Incident response runbook]
  ropa: [templates/record-of-processing.md, Record of processing activities]
  dpia: [templates/dpia.md, Data protection impact assessment]

