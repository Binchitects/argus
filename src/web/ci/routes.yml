http:
  routers:
    api:
      rule: "PathPrefix(`/api`) || PathPrefix(`/connect`) || PathPrefix(`/.well-known`) || Path(`/mcp`) || Path(`/mcp/code`)"
      entryPoints: [websecure]
      service: app
      tls: {}
    # Code Studio's forwarded ports, each at its own name (ws-<workspace>-<port>), as the stack's Traefik has them.
    ports:
      rule: 'HostRegexp(`^ws-[0-9a-f]{32}-[0-9]{1,5}\.llm\.localhost$`)'
      entryPoints: [websecure]
      service: app
      tls: {}
    web:
      rule: "PathPrefix(`/`)"
      entryPoints: [websecure]
      service: web
      tls: {}
  services:
    app:
      loadBalancer:
        servers: [{ url: "http://app:8080" }]
    web:
      loadBalancer:
        servers: [{ url: "http://web:8080" }]
tls:
  certificates:
    - certFile: /certs/tls.crt
      keyFile: /certs/tls.key
