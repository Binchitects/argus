<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Arena</title>
  <!-- The wise one: an owl in the form of an A. Its ear tufts are the A's top, its body the A, its wings the A's legs, the
       space between them the A's opening; its eyes open; no name in it (the names are the build's). -->
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d8075"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b5d56"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eef0"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#bg)"/>
  <!-- The owl as the A: ear tufts at its top, its body widening to its feet, the opening between its legs. -->
  <path d="M168 800 L428 196 Q436 176 452 190 L512 246 L572 190 Q588 176 596 196 L856 800 Q862 816 844 816 L716 816 Q700 816 692 802 L590 642 Q582 630 568 630 L456 630 Q442 630 434 642 L332 802 Q324 816 308 816 L180 816 Q162 816 168 800 Z" fill="url(#a)"/>
  <!-- Its wings, folded down the A's legs. -->
  <path d="M330 470 Q300 640 230 800 L300 800 Q372 660 392 520 Z" fill="url(#wing)" opacity="0.75"/>
  <path d="M694 470 Q724 640 794 800 L724 800 Q652 660 632 520 Z" fill="url(#wing)" opacity="0.75"/>
  <!-- Its face: two eyes side by side, the beak between them. -->
  <circle cx="436" cy="388" r="84" fill="url(#white)"/>
  <circle cx="588" cy="388" r="84" fill="url(#white)"/>
  <circle cx="442" cy="392" r="50" fill="url(#iris)"/>
  <circle cx="582" cy="392" r="50" fill="url(#iris)"/>
  <circle cx="445" cy="394" r="24" fill="#0b1720"/>
  <circle cx="579" cy="394" r="24" fill="#0b1720"/>
  <circle cx="460" cy="376" r="10" fill="#ffffff"/>
  <circle cx="594" cy="376" r="10" fill="#ffffff"/>
  <path d="M512 470 L486 438 Q512 426 538 438 Z" fill="#f59e0b"/>
  <!-- Its feet, at the foot of each leg. -->
  <path d="M236 812 q-6 30 -22 40 M262 812 q0 32 0 44 M288 812 q6 30 22 40" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/>
  <path d="M736 812 q-6 30 -22 40 M762 812 q0 32 0 44 M788 812 q6 30 22 40" fill="none" stroke="#f59e0b" stroke-width="22" stroke-linecap="round"/>
</svg>
