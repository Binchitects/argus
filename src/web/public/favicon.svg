<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Arena</title>
  <!-- The wise one: an owl, its eyes open; no name in it (the names are the build's). -->
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#12304a"/>
      <stop offset="1" stop-color="#06131f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d8075"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b5d56"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ccfbf1"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eef0"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.42" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#bg)"/>
  <!-- Its ear tufts, then its body: a round head on a round body. -->
  <path d="M318 318 L282 168 Q284 154 298 160 L420 252 Z" fill="url(#body)"/>
  <path d="M706 318 L742 168 Q740 154 726 160 L604 252 Z" fill="url(#body)"/>
  <path d="M512 214 C690 214 784 330 784 500 C784 700 672 840 512 840 C352 840 240 700 240 500 C240 330 334 214 512 214 Z" fill="url(#body)"/>
  <!-- Its wings, folded at its sides. -->
  <path d="M262 470 C226 600 252 740 352 812 C330 712 334 588 372 492 Z" fill="url(#wing)"/>
  <path d="M762 470 C798 600 772 740 672 812 C694 712 690 588 652 492 Z" fill="url(#wing)"/>
  <!-- Its belly, light, with a few feathers. -->
  <path d="M512 560 C610 560 664 640 664 712 C664 784 600 826 512 826 C424 826 360 784 360 712 C360 640 414 560 512 560 Z" fill="url(#belly)"/>
  <path d="M452 668 q16 18 32 0 M540 668 q16 18 32 0 M496 716 q16 18 32 0 M452 764 q16 18 32 0 M540 764 q16 18 32 0" fill="none" stroke="#5eead4" stroke-width="10" stroke-linecap="round"/>
  <!-- Its face: the disc its eyes sit in, the eyes, the beak. -->
  <path d="M512 330 C456 290 300 300 300 432 C300 548 420 582 512 532 C604 582 724 548 724 432 C724 300 568 290 512 330 Z" fill="#0b4f4a" opacity="0.55"/>
  <circle cx="412" cy="436" r="104" fill="url(#white)"/>
  <circle cx="612" cy="436" r="104" fill="url(#white)"/>
  <circle cx="418" cy="440" r="62" fill="url(#iris)"/>
  <circle cx="606" cy="440" r="62" fill="url(#iris)"/>
  <circle cx="421" cy="442" r="30" fill="#0b1720"/>
  <circle cx="603" cy="442" r="30" fill="#0b1720"/>
  <circle cx="440" cy="418" r="12" fill="#ffffff"/>
  <circle cx="624" cy="418" r="12" fill="#ffffff"/>
  <path d="M512 552 L484 508 Q512 494 540 508 Z" fill="#f59e0b"/>
  <!-- Its feet. -->
  <path d="M452 832 q-4 26 -18 36 M470 834 q0 28 0 40 M488 832 q4 26 18 36 M536 832 q-4 26 -18 36 M554 834 q0 28 0 40 M572 832 q4 26 18 36" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
</svg>
