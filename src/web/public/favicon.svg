<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Argus Arena</title>
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#141f45"/>
      <stop offset="1" stop-color="#070b1b"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ec8ff"/>
      <stop offset="0.55" stop-color="#1c86f0"/>
      <stop offset="1" stop-color="#0d5fe6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#021046" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#021046" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e6fb"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.45" cy="0.2" r="0.95">
      <stop offset="0" stop-color="#2fd6ff"/>
      <stop offset="0.5" stop-color="#1673e8"/>
      <stop offset="1" stop-color="#0a3db5"/>
    </radialGradient>
    <clipPath id="letter">
      <path id="A" d="M160 760 L428 228 Q446 196 482 196 L542 196 Q578 196 596 228 L864 760 L752 760 Q728 760 714 734 L512 318 L310 734 Q296 760 272 760 Z"/>
    </clipPath>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="230" fill="url(#bg)"/>
  <use href="#A" fill="url(#a)"/>
  <!-- The legs fold under the eye. -->
  <rect x="150" y="536" width="724" height="140" fill="url(#fold)" clip-path="url(#letter)"/>
  <path d="M286 540 C372 470 436 420 512 420 C588 420 652 470 738 540 C668 540 612 642 512 642 C412 642 356 540 286 540 Z" fill="url(#white)"/>
  <circle cx="512" cy="528" r="96" fill="url(#iris)"/>
  <circle cx="512" cy="530" r="42" fill="#06102a"/>
  <circle cx="545" cy="494" r="18" fill="#ffffff"/>
</svg>
