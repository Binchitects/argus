gitlab:
  url: https://gitlab.internal

  # How Argus signs in. Two modes; "token" is the default and is what you
  # want unless your GitLab does not issue access tokens.
  #
  #   auth: token     -- an access token, sent as PRIVATE-TOKEN
  #   auth: password  -- a username and password, exchanged at /oauth/token
  #                      for an OAuth token, then sent as Authorization: Bearer
  #
  # Leave it unset and Argus infers: a username means password mode.
  auth: token

  # --- auth: token ---------------------------------------------------------
  # Prefer the ARGUS_GITLAB_TOKEN environment variable over this field.
  # Requires read_api + read_repository scopes.
  token: ""

  # --- auth: password ------------------------------------------------------
  # username: svc-argus
  #
  # There is deliberately NO password field here. Argus reads it from
  # ARGUS_GITLAB_PASSWORD and refuses to start if `password` appears in this
  # file -- config files get committed, copied into images and pasted into
  # issues, and unlike a token a password is reusable everywhere else the
  # account signs in.
  #
  # CHECK YOUR GITLAB VERSION FIRST. Recent GitLab has removed the password
  # grant this mode depends on: verified against 19.2.1, which answers
  # `unsupported_grant_type` to every password sign-in. There is no headless
  # replacement -- deploy tokens are a username/password pair but cannot
  # enumerate projects, and the authorization-code flow needs a browser. On
  # such a server, auth: token is the only option that works.
  #
  # Password sign-in also cannot satisfy two-factor authentication; GitLab
  # refuses the grant outright for such accounts.
  #
  # Check with:
  #   curl -s -X POST <url>/oauth/token -d grant_type=password -d username=<user> -d password=<pw>
  #
  # An "unsupported_grant_type" reply means this mode cannot work there.
  #
  # Prefer a token in general: it is scopeable to read_api + read_repository,
  # revocable on its own, and cannot be used to sign in to anything else.

  # --- TLS, only for a GitLab that is NOT on a public CA --------------------
  #
  # These apply to the API *and* to every `git clone`. Argus reaches GitLab
  # over two transports that cannot see each other's TLS configuration --
  # httpx for the API, the git binary for clones -- so configuring one and not
  # the other produces the failure that costs the most time: enumeration
  # succeeds, and the first clone dies with "server certificate verification
  # failed", which reads as a bad token or a bad URL.
  #
  # Preferred: the CA that signed GitLab's certificate. Prefer the
  # ARGUS_GITLAB_CA_CERT environment variable over this field. A PEM bundle;
  # the public roots stay loaded alongside it, so a GitLab that redirects to a
  # public host keeps working.
  #
  #   ca_cert: /etc/argus/tls/gitlab-ca.pem
  #
  # Last resort, for a self-signed GitLab with NO CA file available anywhere:
  #
  #   verify: false
  #
  # That turns certificate verification off for every request and every clone
  # to this GitLab, so anything able to answer on its hostname can read the
  # access token. It exists because the alternative is an operator patching
  # Argus, not because it is a good idea. ARGUS_GITLAB_VERIFY overrides it, and
  # accepts true/false, yes/no, on/off or 1/0 -- anything else is refused
  # rather than guessed at.
  #
  # `verify: false` and `ca_cert` together are refused: a CA bundle is exactly
  # what makes verification possible, so one of the two is a mistake.
  verify: true

index:
  data_dir: /var/lib/argus
  db_path: /var/lib/argus/index.db
  max_file_bytes: 1048576
  repo_time_budget_seconds: 600
  exclude_dirs:
    - third_party
    - vendor
    - node_modules
    - build
    - out
    - x64
    - Debug
    - Release
