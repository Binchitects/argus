name: App

# The all-in-one app (app/, docs/enterprise/PLAN.md). Every push runs the
# backend tests on a real Postgres, the web checks, and the browser tests
# against the image that would ship.
on:
  push:
    branches: [enterprise-solution]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build -c Release
      # Testcontainers starts the production Postgres image through the runner's Docker.
      - run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t llm-app:ci --build-arg APP_VERSION=0.0.0-ci.${{ github.run_number }} app
      - name: Start Postgres and the app
        run: |
          docker network create e2e
          docker run -d --name postgres --network e2e -e POSTGRES_USER=app -e POSTGRES_PASSWORD=ci \
            --health-cmd "pg_isready -U app" --health-interval 2s pgvector/pgvector:0.8.0-pg16
          until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ]; do sleep 1; done
          docker run -d --name app --network e2e -p 8080:8080 --read-only --tmpfs /tmp \
            -e Database__Host=postgres -e Database__Username=app -e Database__Password=ci llm-app:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && exit 0; sleep 2
          done
          docker logs app; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/web/package-lock.json }
      - working-directory: app/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:8080 npm run e2e
      - if: failure()
        run: docker logs app
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: app/web/playwright-report }
