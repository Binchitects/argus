name: App

# The app (app/, docs/enterprise/PLAN.md): the API and the web. Every push runs
# the backend tests on a real Postgres, the web's checks, and the browser tests
# against the two images that would ship, behind Traefik.
on:
  push:
    branches: [enterprise-solution]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build -c Release
      # Testcontainers starts the production Postgres image through the runner's Docker.
      - run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The web and the API images behind Traefik with the production path split,
  # in a real browser (desktop and phone, both themes, axe).
  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      E2E_PASSWORD: ci admin password for tests
      E2E_BASE_URL: https://llm.localhost:8443
      E2E_NO_GATEWAY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          docker build -t llm-app:ci --build-arg APP_VERSION=0.0.0-ci.${{ github.run_number }} app
          docker build -t llm-web:ci --build-arg APP_VERSION=0.0.0-ci.${{ github.run_number }} app/frontend
      - name: Start Postgres, the app, the web and Traefik
        run: |
          echo "127.0.0.1 llm.localhost" | sudo tee -a /etc/hosts
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=llm.localhost \
            -addext "subjectAltName=DNS:llm.localhost,DNS:*.llm.localhost" -keyout certs/tls.key -out certs/tls.crt
          chmod 644 certs/*
          docker network create e2e
          docker run -d --name postgres --network e2e -e POSTGRES_USER=app -e POSTGRES_PASSWORD=ci \
            --health-cmd "pg_isready -U app" --health-interval 2s pgvector/pgvector:0.8.0-pg16
          until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ]; do sleep 1; done
          docker exec postgres psql -U app -d postgres -qc "create database litellm"
          docker exec -i postgres psql -U app -d litellm -q < app/tests/Llm.Tests/Resources/litellm-schema.sql
          # The Settings page's folder for pending .env changes (the app runs as a non-root user).
          mkdir -p ci-settings && chmod 777 ci-settings
          docker run -d --name app --network e2e --read-only --tmpfs /tmp \
            -v "$PWD/stack/config/dashboards:/dashboards:ro" -v "$PWD/stack/env-samples:/env-samples:ro" \
            -v "$PWD/ci-settings:/settings" \
            -e Database__Host=postgres -e Database__Username=app -e Database__Password=ci \
            -e Auth__Domain=llm.localhost -e Auth__HttpsPort=8443 -e "Auth__AdminPassword=$E2E_PASSWORD" \
            -e Auth__DataKey=ci-data-key -e Gateway__Url=http://127.0.0.1:9 llm-app:ci
          docker run -d --name web --network e2e --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true llm-web:ci
          docker run -d --name traefik --network e2e -p 8443:8443 -v "$PWD/certs:/certs:ro" \
            -v "$PWD/app/frontend/ci/traefik.yml:/etc/traefik/traefik.yml:ro" \
            -v "$PWD/app/frontend/ci/routes.yml:/etc/traefik/routes.yml:ro" traefik:v3.6.7
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && \
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ] && \
            curl -sfk https://llm.localhost:8443/api/info >/dev/null && exit 0
            sleep 2
          done
          docker logs app; docker logs web; docker logs traefik; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - working-directory: app/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: The app logged no errors
        run: |
          if docker logs app 2>&1 | grep -E '"LogLevel":"(Error|Critical)"'; then exit 1; fi
      - if: failure()
        run: docker logs app; docker logs web; docker logs traefik
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: app/frontend/playwright-report }
