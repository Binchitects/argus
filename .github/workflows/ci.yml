name: CI

# Every push and pull request: the API, Argus and Code Arena (.NET), both web apps, each
# in a real browser, the deployment's tooling, and every env sample resolving
# into a complete compose file.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    # The API and its core, against real Postgres, OpenLDAP and LiteLLM's
    # schema (Testcontainers).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: dotnet test tests/Llm.Tests -c Release --logger "console;verbosity=normal"

  argus:
    # The code index service. Universal Ctags decides which symbols exist, and
    # sqlite-vec is the pinned release, checked against its SHA-256.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends universal-ctags
      - run: tools/fetch-sqlite-vec.sh linux-x64
      - name: Build and test
        run: |
          git config --global user.email ci@argus.invalid && git config --global user.name ci
          dotnet test tests/Argus.Tests -c Release

  code-arena:
    # The coding agent people download: against a fake gateway and fake MCP
    # servers on real sockets, then packaged as one file with its IDE page and
    # started.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/web/package-lock.json }
      - run: dotnet test tests/CodeArena.Tests -c Release
      - name: The package for Linux, and its program starts
        run: |
          (cd src/web && npm ci)
          tools/package-code-arena.sh --online linux-x64
          (cd dist && sha256sum -c SHA256SUMS)
          dist/code-arena/linux-x64/code-arena --version
          dist/code-arena/linux-x64/code-arena --help
      - name: The package has the IDE's page built in
        # The project embeds the page only when it was built (web/code-arena.html): without it the
        # program says "has no IDE" before anything else; with it, the next thing it needs is a sign-in.
        run: |
          test -f src/CodeArena/web/code-arena.html
          said="$(CODE_ARENA_HOME="$(mktemp -d)" dist/code-arena/linux-x64/code-arena web --no-open 2>&1 || true)"
          echo "$said"
          case "$said" in
            *"Not signed in"*) ;;
            *) echo "The package's code-arena did not start its IDE (is the page built into it?)" >&2; exit 1 ;;
          esac

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: src/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  argus-web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: src/argus-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/argus-web/package-lock.json }
      - name: Test, typecheck and build
        run: npm ci && npm test && npm run build

  web-browser:
    # The API and web images behind Traefik, as deployed, driven by Playwright
    # on desktop and phone (no model behind the gateway, E2E_NO_GATEWAY, and no
    # Prometheus, Loki or Alertmanager, E2E_NO_OBSERVE: the deployed run covers those).
    needs: [api, web]
    runs-on: ubuntu-24.04
    env:
      E2E_PASSWORD: ci admin password for tests
      E2E_BASE_URL: https://llm.localhost:8443
      E2E_NO_GATEWAY: "1"
      E2E_NO_OBSERVE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          docker build -t llm-app:ci --build-arg APP_VERSION=0.0.0-ci.${{ github.run_number }} -f src/Llm.Api/Dockerfile .
          docker build -t llm-web:ci --build-arg APP_VERSION=0.0.0-ci.${{ github.run_number }} -f src/web/Dockerfile .
      - name: Start Postgres, the app, the web and Traefik
        run: |
          echo "127.0.0.1 llm.localhost" | sudo tee -a /etc/hosts
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=llm.localhost \
            -addext "subjectAltName=DNS:llm.localhost,DNS:*.llm.localhost" -keyout certs/tls.key -out certs/tls.crt
          chmod 644 certs/*
          docker network create e2e
          docker run -d --name postgres --network e2e -e POSTGRES_USER=app -e POSTGRES_PASSWORD=ci \
            --health-cmd "pg_isready -U app" --health-interval 2s pgvector/pgvector:0.8.0-pg16
          until [ "$(docker inspect -f '{{.State.Health.Status}}' postgres)" = healthy ]; do sleep 1; done
          docker exec postgres psql -U app -d postgres -qc "create database litellm"
          docker exec -i postgres psql -U app -d litellm -q < tests/Llm.Tests/Resources/litellm-schema.sql
          docker run -d --name app --network e2e --read-only --tmpfs /tmp \
            -e Database__Host=postgres -e Database__Username=app -e Database__Password=ci \
            -e Auth__Domain=llm.localhost -e Auth__HttpsPort=8443 -e "Auth__AdminPassword=$E2E_PASSWORD" \
            -e Auth__DataKey=ci-data-key -e Gateway__Url=http://127.0.0.1:9 -e Gateway__ConnectWaitSeconds=0 -e Gateway__KeyWaitSeconds=0 llm-app:ci
          docker run -d --name web --network e2e --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true llm-web:ci
          docker run -d --name traefik --network e2e -p 8443:8443 -v "$PWD/certs:/certs:ro" \
            -v "$PWD/src/web/ci/traefik.yml:/etc/traefik/traefik.yml:ro" \
            -v "$PWD/src/web/ci/routes.yml:/etc/traefik/routes.yml:ro" traefik:v3.6.7
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && \
            [ "$(docker inspect -f '{{.State.Health.Status}}' web)" = healthy ] && \
            curl -sfk https://llm.localhost:8443/api/info >/dev/null && exit 0
            sleep 2
          done
          docker logs app; docker logs web; docker logs traefik; exit 1
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/web/package-lock.json }
      - working-directory: src/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - name: The app logged no errors
        run: |
          if docker logs app 2>&1 | grep -E '"LogLevel":"(Error|Critical)"'; then exit 1; fi
      - if: failure()
        run: docker logs app; docker logs web; docker logs traefik
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: web-playwright-report, path: src/web/playwright-report }

  argus-browser:
    # Argus's own app against its real backend, with fake GitLab, LiteLLM and
    # embeddings on real sockets, driven in Chromium.
    needs: [argus, argus-web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/argus-web/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends universal-ctags
      - run: tools/fetch-sqlite-vec.sh linux-x64 && dotnet build src/Argus -c Release
      - name: Build the app and install Chromium
        working-directory: src/argus-web
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Browser suite
        working-directory: src/argus-web
        run: |
          git config --global user.email ci@argus.invalid && git config --global user.name ci
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argus-screens-and-traces
          path: |
            src/argus-web/e2e/.work/screens
            src/argus-web/test-results
          if-no-files-found: ignore

  kubernetes:
    # The Kubernetes installer (installer.sh --kubernetes) on a kind cluster: the cluster's requirements, the chart
    # installed with helm --atomic --wait, the app answering through its Service, then status and an upgrade that
    # keeps the release's values. The app's and the web's images are built here; what needs a GPU, Argus, the
    # sandbox and the monitoring are left out (deploy/helm/kind-values.yaml).
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the images
        run: |
          docker build -t arena-app:ci --build-arg APP_VERSION=0.0.0-ci.${{ github.run_number }} -f src/Llm.Api/Dockerfile .
          docker build -t arena-web:ci --build-arg APP_VERSION=0.0.0-ci.${{ github.run_number }} -f src/web/Dockerfile .
      - uses: helm/kind-action@v1.12.0
        with: { cluster_name: arena, version: v0.27.0 }
      - name: The images, an ingress controller and a TLS Secret
        run: |
          kind load docker-image arena-app:ci arena-web:ci --name arena
          kubectl label node arena-control-plane ingress-ready=true
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.12.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=complete job --all --timeout=300s
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=300s
          # Its admission webhook answers a little after the pod is ready: until an Ingress passes it (a dry run), wait.
          printf '%s\n' 'apiVersion: networking.k8s.io/v1' 'kind: Ingress' 'metadata: { name: probe, namespace: default }' \
            'spec: { ingressClassName: nginx, rules: [{ host: probe.localhost, http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: probe, port: { number: 80 } } } }] } }] }' > probe.yaml
          for i in $(seq 1 60); do kubectl apply --dry-run=server -f probe.yaml >/dev/null 2>&1 && break; sleep 2; done
          kubectl apply --dry-run=server -f probe.yaml
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=arena.localhost \
            -addext "subjectAltName=DNS:arena.localhost,DNS:*.arena.localhost" -keyout tls.key -out tls.crt
          kubectl create namespace arena
          kubectl -n arena create secret tls arena-tls --cert=tls.crt --key=tls.key
      - name: Install with the installer
        run: |
          bash deploy/scripts/installer.sh requirements --kubernetes --tls-secret arena-tls --replicas 1 --gpu no
          bash deploy/scripts/installer.sh install --kubernetes --domain arena.localhost --tls-secret arena-tls --replicas 1 --gpu no \
            --values deploy/helm/kind-values.yaml --timeout 20 --yes
      - name: Status, and an upgrade that keeps its values
        run: |
          bash deploy/scripts/kube-install.sh status
          bash deploy/scripts/kube-install.sh upgrade --values deploy/helm/kind-values.yaml --timeout 20 --yes
          test "$(helm get values arena -n arena -o json | python3 -c 'import json, sys; print(json.load(sys.stdin)["domain"])')" = arena.localhost
      - name: What the cluster says
        if: failure()
        run: |
          kubectl -n arena get pods -o wide
          kubectl -n arena get events --sort-by=.lastTimestamp | tail -40
          kubectl -n arena logs deploy/app --tail=200 || true
          kubectl -n arena logs deploy/litellm --tail=100 || true

  deploy:
    # The compose files resolving (the platform from .env.example, with Docker and
    # with Podman's overrides; Argus alone per sample), the scripts parsing, and the
    # arena CLI's tests (Python's own unittest, no packages).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          sed -e 's/^\(ADMIN_PASSWORD\|DB_PASSWORD\|APP_KEY\|ENGINE_KEY\|ARGUS_KEY\)=$/\1=ci/' -e 's/^GATEWAY_KEY=$/GATEWAY_KEY=sk-ci/' deploy/.env.example > deploy/.env
          (cd deploy && docker compose config --quiet && docker compose -f docker-compose.yml -f podman.yml config --quiet) && echo "deploy resolves (Docker and Podman)"
          # Podman's own compose command too, when the runner has it (it hands the files to a compose provider).
          if command -v podman >/dev/null && podman compose version >/dev/null 2>&1; then
            (cd deploy && podman compose -f docker-compose.yml -f podman.yml config >/dev/null) && echo "deploy resolves (podman compose)"
          else
            echo "podman compose is not on this runner: checked with docker compose and podman.yml above"
          fi
          fill() { awk '/^# SECRETS/{s=1} /^# APP/{s=0} s && /^[A-Z0-9_]+=$/{c="openssl rand -hex 24"; c|getline r; close(c); if ($0 ~ /^LITELLM_/) r="sk-" r; $0=$0 r} {print}' "$1" > "$2"; }
          for sample in deploy/argus-standalone/env-samples/*.env; do
            fill "$sample" deploy/argus-standalone/.env
            (cd deploy/argus-standalone && docker compose config --quiet) && echo "$sample resolves"
          done
      - name: The Helm chart
        # Its copies of deploy/config and deploy/services, its blocks and values (no helm needed).
        run: python3 deploy/helm/check-chart.py
      - name: Scripts parse
        run: |
          for f in deploy/scripts/*.sh deploy/argus-standalone/scripts/*.sh deploy/services/*.sh deploy/services/*/*.sh deploy/services/sandbox/soffice \
            tools/*.sh tools/test-gitlab/*.sh clients/claude-code/*.sh tools/dn; do bash -n "$f"; done
          # The services' scripts (the picture and video servers', the engine's) run under the images' /bin/sh, not bash.
          for f in deploy/services/*.sh deploy/services/*/*.sh deploy/services/sandbox/soffice; do sh -n "$f"; done
      - name: The arena CLI and its GitLab CI template
        run: python3 -m unittest discover clients/arena -v
      # The air-gap bundle, the restore and rollback tests and their guards, with
      # fake docker and podman on PATH: nothing is pulled, built or started.
      - name: Recovery and offline scripts
        run: python3 -m unittest discover -s tests/deploy -v
