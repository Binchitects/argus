# Runs as the unprivileged `nginx` user with a read-only root: every path it
# writes is under /tmp (a tmpfs in compose).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  # One JSON object per line: promtail ships it to Loki as-is.
  log_format json escape=json '{"time":"$time_iso8601","status":$status,"method":"$request_method",'
                              '"path":"$uri","bytes":$body_bytes_sent,"ms":$request_time,'
                              '"ua":"$http_user_agent"}';
  map $uri $loggable {
    /healthz 0;
    default 1;
  }
  access_log /dev/stdout json if=$loggable;

  server {
    listen 8080;
    root /srv/web;

    # The same headers the API sets on its pages. Scripts only from this origin
    # (the build has no inline script; theme-init.js is a file for that reason);
    # styles allow inline because the UI and chart libraries set style attributes.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    # Fingerprinted by Vite: never change, cache forever. A missing one is a 404,
    # never index.html (which would fail as a script with a confusing error).
    location /assets/ {
      # Not `always`: a 404 must never be cached for a year.
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    # Anything else: the file if it exists (favicon, theme-init.js), otherwise the
    # app's single page, which routes on the client. Always revalidated.
    location / {
      add_header Cache-Control "no-cache" always;
      add_header Content-Security-Policy $csp always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Cross-Origin-Opener-Policy "same-origin" always;
      try_files $uri /index.html;
    }

    # The API is never served from here; a request that ends up here by mistake
    # is a 404, not the single-page app pretending to be JSON.
    location ~ ^/(api|connect|\.well-known)(/|$) {
      return 404;
    }
  }
}
