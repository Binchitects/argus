[project]
name = "argus"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.9,<2.0",
    # Knowledge packs (argus/packs/): vec0 virtual tables for bit/int8
    # embeddings, and zstd for compressing doc/chunk content.
    "sqlite-vec>=0.1.9",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The pgvector backend for symbol embeddings (argus/store/pgvector.py). Optional
# because sqlite-vec remains the default and the vast majority of deployments
# need no Postgres at all; argus/store/pgvector.py imports psycopg lazily so its
# absence costs nothing until ARGUS_VECTOR_BACKEND=pgvector selects it.
pgvector = ["psycopg[binary]>=3.1"]

[project.scripts]
argus = "argus.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src layout. The package lives in src/argus/, which keeps the importable code
# separate from the repository's other concerns -- the deployment in stack/,
# the tooling in scripts/, the docs, the eval harness -- and makes it
# impossible to import the source tree by accident from the repository root.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["argus*"]

[tool.setuptools.package-data]
argus = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
# Argus's own tests, and nothing else. Without this, a bare `pytest` walks the
# whole working tree -- including scripts/test-gitlab/work/trees/, where the
# measurement corpus is checked out. curl ships its own tests/ directory, so
# collection failed outright with a FileNotFoundError from inside curl's
# suite. The corpus is data; it must never look like this project's tests.
testpaths = ["tests"]

# With a src layout this is not a convenience. The Argus image installs the
# package into site-packages, so a test run from a checkout that did NOT put
# src/ on the path would import the IMAGE's argus instead of the working
# tree's -- and pass, testing code nobody is editing. That failure is silent
# and looks like success, which is the worst shape a test bug can have.
pythonpath = ["src"]

# Scoped to this exact message, not the module or the warning category in
# general: starlette.testclient's own recommended migration (httpx2) isn't
# adopted yet, so this one warning is expected noise on every test run. A
# different StarletteDeprecationWarning -- a real, new deprecation -- has a
# different message and is therefore not matched by this filter and will
# still surface.
filterwarnings = [
    "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]
