apiVersion: 1

providers:
  - name: LLMService
    orgId: 1
    folder: LLMService
    type: file
    disableDeletion: false
    # Edits made in the UI are overwritten on the next reload — the JSON files
    # on disk are the source of truth. Use "Save As" to keep experiments.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
