# Promtail discovers containers through the Docker socket, so new services on
# the llm-net network are picked up automatically — no per-service config.

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      # /my-container -> my-container
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

      # Only ingest THIS stack's containers. `regex: ".+"` was the comment's
      # claim and not what it did: it kept every container on the daemon that
      # carries any compose project label, so a second stack on the same host
      # -- the bundled test GitLab is one -- had its whole log shipped into
      # this deployment's Loki. That is not just volume: it is another
      # project's logs appearing in this project's Logs page, and on first start
      # it is what pushed the busiest stream past Loki's rate limit.
      #
      # The project name comes from COMPOSE_PROJECT_NAME rather than a literal,
      # so a renamed deployment keeps working. `-config.expand-env` in the
      # service command is what makes the substitution happen.
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        regex: "${COMPOSE_PROJECT_NAME:-llmservice}"
        action: keep

    pipeline_stages:
      # vLLM writes conventional Python logging lines; lift the level out so you
      # can filter with {container="vllm"} | level="ERROR".
      - match:
          selector: '{container="vllm"}'
          stages:
            - regex:
                expression: '(?P<level>INFO|WARNING|ERROR|CRITICAL|DEBUG)'
            - labels:
                level:

      # Drop the very high-volume per-request throughput lines vLLM emits every
      # 10 seconds; the same data is already in Prometheus, far more cheaply.
      - match:
          selector: '{container="vllm"}'
          action: drop
          expression: ".*Avg prompt throughput.*"

      # llama.cpp is the stack's other engine, and its logs were collected
      # raw with no level label -- so the same level filter that works for
      # vLLM returned nothing on a llama.cpp deployment. Its lines look like
      # "0.03.172.993 I srv load_model: ..." -- a timestamp, then a single
      # letter level (D/I/W/E).
      - match:
          selector: '{container="llamacpp"}'
          stages:
            - regex:
                expression: '^[^ ]+ +(?P<level>[DIWE]) '
            - labels:
                level:

      # Same reasoning as the vLLM drop above: llama.cpp prints a per-slot
      # timing line for every request, and with --metrics on the same numbers
      # are in Prometheus far more cheaply.
      - match:
          selector: '{container="llamacpp"}'
          action: drop
          expression: ".*print_timing.*"

      - match:
          selector: '{container=~"prometheus|loki|promtail"}'
          stages:
            - regex:
                expression: 'level=(?P<level>[a-zA-Z]+)'
            - labels:
                level:

      # The app writes one JSON object per line ({"LogLevel":"Warning",...}),
      # a field Loki's level detection does not know: lift it, so the Logs
      # page's level filter and colours cover the app too.
      - match:
          selector: '{container="app"} |~ "^[{]"'
          stages:
            - json:
                expressions:
                  level: LogLevel
            - labels:
                level:

      # Argus prints one JSON object per tool call or refused request
      # (argus/auditlog.py). event, outcome and tool become labels: a handful of
      # values each, and what the Argus dashboard groups by. The person stays in
      # the line and is read with `| json` at query time -- a label per user
      # would multiply streams for nothing.
      - match:
          selector: '{container="argus"} |~ "^[{]\"ts\""'
          stages:
            - json:
                expressions:
                  event: event
                  outcome: outcome
                  tool: tool
            - labels:
                event:
                outcome:
                tool:
