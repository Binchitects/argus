# Continue -> Argus.  NOT EXECUTED on this machine; transcribed from Continue's
# documented MCP configuration. Merge into ~/.continue/config.yaml.
#
# stdio form: Argus runs as a child process and resolves ARGUS_TOKEN once, at
# startup. For the HTTP form see clients/generic-mcp/http.json -- Continue takes
# the same url/headers shape as every other URL-based client.

mcpServers:
  - name: argus
    command: argus
    args: ["serve", "--config", "/etc/argus/config.yaml", "--stdio"]
    env:
      ARGUS_TOKEN: <gitlab-pat>
