# Continue -> Argus.  NOT EXECUTED on this machine; transcribed from Continue's
# documented MCP configuration. Merge into ~/.continue/config.yaml.
#
# HTTP form: the platform's Argus, with your Arena API key (Your account ->
# API key, sk-...). Argus answers as your GitLab account; it takes no GitLab token.

mcpServers:
  - name: argus
    type: streamable-http
    url: https://argus.llm.localhost/mcp
    requestOptions:
      headers:
        Authorization: Bearer <your API key>

