# Continue -> code-intel.  NOT EXECUTED on this machine; transcribed from Continue's
# documented MCP configuration. Merge into ~/.continue/config.yaml.
#
# HTTP form: the platform's code-intel, with your Arena API key (Your account ->
# API key, sk-...). code-intel answers as your GitLab account; it takes no GitLab token.

mcpServers:
  - name: code-intel
    type: streamable-http
    url: https://code-intel.llm.localhost/mcp
    requestOptions:
      headers:
        Authorization: Bearer <your API key>

