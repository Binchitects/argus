# DeepSeek Harness -> Argus.
#
#   ARGUS_KEY=ak_... dsh --profile headless --patch clients/deepseek-harness/argus-mcp.patch.yml \
#     "Use the mcp__argus__find_symbol tool, with name=DecodeFrame."
#
# `insert:` is the APPEND form: a bare `- name:` entry is read as an override of
# a server that does not exist yet and rejected. The key comes from the
# environment so this file can live in a repository; `!!js` is required, or the
# backticks arrive as literal text and Argus answers 401.

- insert:
  - name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: argus
      transport: streamable-http
      url: http://llm.example.lan:8080/mcp
      headers:
        Authorization: !!js '`Bearer ${process.env.ARGUS_KEY}`'
